# Hosting on Netlify (decided 2026-10-09). Never Vercel.
[build]
  # The data files (data/, src/data/course.json, glossary.json) are committed; recomputing them (pnpm data)
  # ran out of memory on Netlify. Run `pnpm build` locally before pushing so they are current.
  command = "pnpm exec astro build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TELEMETRY_DISABLED = "1"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Every path is gated by netlify/edge-functions/gate.ts (see its config).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"

# Built files under /_astro/ have the content hash in their name: a changed file gets a new name, so the
# browser may keep them for good and never ask again (the sign-in gate still runs in front of each request).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
