<!doctype html>
<!--
  Video scene for lesson 8.18 — "כמה אי־ודאות יש". Every number comes from data/lessons/8-18.json; render(t) depends
  only on t. Synthetic data, for illustration (the stamp says so). We know the true step only because the data is made up.

  Script (one idea: an estimate comes with an interval that shrinks like one over the root of the data; a line fitted to a
  step is a narrow interval around a number that does not exist; with little data a prior assumption carries most of the
  weight and gives way as data arrives):
  1. Title.
  2. Five offers, their mean and the 95% interval.
  3. How the interval shrinks: 5, 20, 100, 400.
  4. A line through data that really has a step: the step model fits better.
  5. The prior meets the data: 12, 20, 60 offers.
  6. Takeaway.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 8.18 · אמידה מנתונים</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      import { boot } from "/video/_s8c.js";
      const v = await boot("8-18");
      const { fact, num, whole, shek, pl, lr, clamp, inScene, vis, after, grow, C, el, txt, box, line, dot, stamp, title } = v;
      const OFFERS = fact("data.offers");
      const hand = fact("hand.mean");
      const slope = fact("slope");
      const lvs = fact("line_vs_step");
      const NS = [12, 20, 60];
      const chain = Object.fromEntries([8, 12, 20, 30, 60].map((n) => [n, fact(`chain.${n}`)]));
      const V = { n: pl(fact("gen.n")), step: fact("truth.step"), thr: pl(fact("thr")), pm: fact("prior.mean"), psd: fact("prior.sd") };
      const pct = (s) => `${Math.round(Number(s) * 100)}%`;
      const S = { title: [0, 7], hand: [7, 36], width: [36, 66], line: [66, 100], chain: [100, 142], end: [142, 154] };
      window.duration = 154;
      window.cues = [
        [1, 5.5, "כמה אי־ודאות יש."],
        [8, 15, "חמש הצעות סינתטיות, חמישה מרווחים."],
        [15, 22, `הממוצע ${hand.mean}. אבל מדגם אחר, ממוצע אחר.`],
        [22, 30, `טווח 95%: מ־${hand.low} עד ${hand.high}.`],
        [30, 35.5, "הוא מדבר על רעש, לא על הטיה."],
        [37, 44, "כמה הטווח מתכווץ כשיש עוד הצעות?"],
        [44, 52, "פי 4 יותר הצעות, טווח צר פי 2."],
        [52, 60, "הוא קטן כמו אחד חלקי שורש מספר ההצעות."],
        [60, 65.5, "דיוק כפול דורש הרבה יותר נתונים."],
        [67, 75, `${V.n} הצעות, ובהן מדרגה בסף ${V.thr}%.`],
        [75, 83, "הרגרסיה מתאימה קו ישר, עלייה הדרגתית."],
        [83, 92, `טעות הקו ${lvs.lineMae}, וטעות המדרגה ${lvs.stepMae}.`],
        [92, 99.5, "טווח צר סביב צורה שגויה לא עוזר."],
        [101, 108, "ומה כשיש מעט נתונים? הנחת פתיחה."],
        [108, 117, `למשל ${V.pm}, עם פיזור ${V.psd}.`],
        [117, 126, "מעט הצעות: ההנחה שוקלת הרבה."],
        [126, 134, "יותר הצעות: הנתונים גוברים."],
        [134, 141.5, "ההנחה היא הנחה, לא עובדה."],
        [143, 148, "אומדן בלי טווח הוא מספר בלי הקשר."],
        [148, 153, "ומעט נתונים: ההנחה עוזרת, ונעלמת."],
      ];

      window.render = (t) => {
        svg.replaceChildren();
        if (inScene(t, S.title)) title(t, S.title, "כמה אי־ודאות יש", "אמידה מנתונים", "רווח סמך · רגרסיה · הנחת פתיחה");
        // Scene 2 — five offers and their interval
        if (inScene(t, S.hand)) {
          const o = vis(t, S.hand);
          txt(640, 120, "חמש הצעות, ממוצע, וטווח", 38, { w: 700, o });
          const A = { l: 300, r: 980, y: 330 };
          const lo = 0.80, hi = 0.98;
          const X = (v) => A.l + ((v - lo) / (hi - lo)) * (A.r - A.l);
          line(A.l - 20, A.y + 40, A.r + 20, A.y + 40, o);
          [0.8, 0.85, 0.9, 0.95].forEach((v) => txt(X(v), A.y + 70, v.toFixed(2), 20, { fill: C.n600, o, ltr: true }));
          [0.84, 0.90, 0.88, 0.93, 0.85].forEach((v, k) => dot(X(v), A.y + 10, 9, C.teal, after(t, S.hand, 1 + k * 0.7, o)));
          const o2 = after(t, S.hand, 9, o);
          if (o2 > 0) { line(X(Number(hand.mean)), A.y - 70, X(Number(hand.mean)), A.y + 40, o2, C.navy, 3); txt(X(Number(hand.mean)), A.y - 84, `ממוצע ${hand.mean}`, 24, { w: 700, o: o2, ltr: false }); }
          const o3 = after(t, S.hand, 15, o);
          if (o3 > 0) {
            el("rect", { x: X(Number(hand.low)), y: A.y - 40, width: X(Number(hand.high)) - X(Number(hand.low)), height: 26, rx: 6, fill: C.tq2, opacity: 0.7 * o3 });
            txt(X(Number(hand.low)) - 12, A.y - 20, hand.low, 22, { anchor: "end", w: 700, o: o3, ltr: true });
            txt(X(Number(hand.high)) + 12, A.y - 20, hand.high, 22, { anchor: "start", w: 700, o: o3, ltr: true });
          }
          stamp(o);
        }
        // Scene 3 — width against n
        if (inScene(t, S.width)) {
          const o = vis(t, S.width);
          txt(640, 120, "רוחב הטווח מול מספר ההצעות", 38, { w: 700, o });
          [5, 20, 100, 400].forEach((n, k) => {
            const y = 190 + k * 80;
            const w = (Number(fact(`w.${n}`)) / 0.25) * 620 * grow(t, S.width, 1 + k * 3, 2);
            txt(1100, y + 36, `${n} הצעות`, 26, { anchor: "start", w: 700, o });
            el("rect", { x: 1000 - w, y, width: w, height: 50, rx: 8, fill: k === 3 ? C.teal : C.tq2, opacity: o });
            if (grow(t, S.width, 1 + k * 3, 2) > 0.95) txt(1000 - w - 14, y + 36, pl(fact(`w.${n}`)), 24, { anchor: "end", w: 700, o, ltr: true });
          });
          txt(640, 530, "פי 4 יותר נתונים: הטווח צר פי 2", 28, { fill: C.teal, w: 700, o: after(t, S.width, 14, o) });
          stamp(o);
        }
        // Scene 4 — a line through a step
        if (inScene(t, S.line)) {
          const o = vis(t, S.line);
          txt(640, 110, "קו ישר מול מדרגה", 38, { w: 700, o });
          const G = { l: 260, r: 1020, top: 160, bot: 500 };
          const X = (v) => G.l + ((v - 30) / 45) * (G.r - G.l);
          const Y = (m) => G.bot - ((m - 0.5) / 1.0) * (G.bot - G.top);
          line(G.l - 20, G.bot, G.r + 10, G.bot, o);
          [30, 40, 50, 60, 70].forEach((v) => txt(X(v), G.bot + 30, `${v}%`, 18, { fill: C.n600, o, ltr: true }));
          [0.6, 0.8, 1.0, 1.2].forEach((m) => txt(G.l - 32, Y(m) + 6, m.toFixed(1), 18, { fill: C.n600, o, anchor: "end", ltr: true }));
          const g = grow(t, S.line, 1, 5);
          OFFERS.forEach((p, k) => dot(X(Number(p.ltv)), Y(Number(p.margin)), 5, C.teal, o * (g * OFFERS.length > k ? 0.85 : 0)));
          const o2 = after(t, S.line, 9, o);
          if (o2 > 0) {
            const y = (x) => Number(slope.slope) * x + Number(slope.intercept);
            line(X(30), Y(y(30)), X(75), Y(y(75)), o2, C.navy, 4);
            txt(X(75) - 4, Y(y(75)) - 22, `קו: טעות ${lvs.lineMae}`, 24, { anchor: "start", w: 700, o: o2 });
          }
          const o3 = after(t, S.line, 20, o);
          if (o3 > 0) {
            const b = Number(chain[60].estimate.meanBelow), a = Number(chain[60].estimate.meanAbove);
            line(X(30), Y(b), X(60), Y(b), o3, C.teal, 5);
            line(X(60), Y(a), X(75), Y(a), o3, C.teal, 5);
            line(X(60), Y(b), X(60), Y(a), o3, C.teal, 3, "6 5");
            txt(X(32), Y(b) + 40, `מדרגה: טעות ${lvs.stepMae}`, 24, { anchor: "start", w: 700, fill: C.teal, o: o3 });
          }
          stamp(o);
        }
        // Scene 5 — prior meets data
        if (inScene(t, S.chain)) {
          const o = vis(t, S.chain);
          txt(640, 110, "הנחת פתיחה שמתעדכנת", 38, { w: 700, o });
          const A = { l: 260, r: 1020 };
          const lo = -0.1, hi = 0.8;
          const X = (v) => A.l + ((v - lo) / (hi - lo)) * (A.r - A.l);
          const pm = Number(V.pm), ps = Number(V.psd);
          NS.forEach((n, k) => {
            const y = 160 + k * 130;
            const oa = after(t, S.chain, 1 + k * 11, o);
            txt(1180, y + 40, `${n} הצעות`, 26, { anchor: "start", w: 700, o: oa });
            line(A.l - 10, y + 70, A.r + 10, y + 70, oa);
            el("rect", { x: X(pm - ps), y: y, width: X(pm + ps) - X(pm - ps), height: 22, rx: 4, fill: C.n300, opacity: oa });
            const c = chain[n];
            if (c.estimate) {
              const ob = after(t, S.chain, 3 + k * 11, o);
              el("rect", { x: X(Number(c.estimate.low)), y: y + 26, width: Math.max(3, X(Number(c.estimate.high)) - X(Number(c.estimate.low))), height: 22, rx: 4, fill: C.tq2, opacity: ob });
              const oc = after(t, S.chain, 6 + k * 11, o);
              dot(X(Number(c.posterior.mean)), y + 58, 9, C.navy, oc);
              txt(640, y + 104, `אחרי החיבור ${c.posterior.mean} · משקל ההנחה ${pct(c.posterior.priorWeight)}`, 20, { w: 700, o: oc });
            }
          });
          stamp(o);
        }
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          const rows = [["אומדן", "תמיד עם טווח"], ["מעט נתונים", "ההנחה גוברת"], ["הרבה נתונים", "הנתונים גוברים"]];
          rows.forEach(([a, b], i) => {
            const oa = after(t, S.end, 0.3 + i * 2.5, o);
            txt(1060, 240 + i * 80, a, 34, { anchor: "start", w: 700, o: oa });
            txt(760, 240 + i * 80, b, 30, { anchor: "start", fill: C.teal, o: oa });
          });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
