<!doctype html>
<!--
  Video scene for lesson 0.8 — "חוב שגדל לבד".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t.
  Every number comes from data/lessons/0-8.json; the inflation rate and index
  values are invented teaching numbers. The subtitle cues (window.cues) carry the
  explanatory sentences — the narration script, if it is ever added.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 0.8 · הצמדה</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/0-8.json")).json();
      const F = (id) => data.facts.find((f) => f.id === id);
      const fact = (id) => F(id).value;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const nf0 = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 0 });
      const shek = (v) => `${nf2.format(Number(v))} ₪`.replace(".00 ₪", " ₪");
      const shek0 = (v) => `${nf0.format(Math.round(Number(v)))} ₪`;

      const one = F("explain.one_step");
      const series = fact("video.series_10");
      const V = {
        p: fact("explain.principal"), i0: one.inputs.base_index, i1: one.inputs.new_index,
        one: one.value, add: fact("explain.one_step_add"),
        infl: F("prediction.indexed").inputs.inflation_percent, years: F("prediction.indexed").inputs.years,
        c10: fact("prediction.indexed"), r10: fact("explain.unindexed_real_10"),
      };

      const S = { title: [0, 12], step: [12, 44], nominal: [44, 84], real: [84, 120], names: [120, 142], end: [142, 154] };
      window.duration = 154;
      window.cues = [
        [1, 6, "הצמדה: חוב שקשור למדד."],
        [6, 11.5, "המספרים כאן להמחשה בלבד."],
        [13, 21, `לקחתם הלוואה של ${shek(V.p)}, מוצמדת למדד.`],
        [21, 28, "הניחו שאין ריבית ושלא משלמים כלום."],
        [28, 35, `המדד עלה מ־${V.i0} ל־${V.i1}: עלייה של ${V.infl}%.`],
        [35, 43, `גם החוב עולה ב־${V.infl}%: עכשיו הוא ${shek(V.one)}.`],
        [45, 54, `הניחו שהמדד עולה ב־${V.infl}% בכל שנה.`],
        [54, 64, "החוב המוצמד גדל משנה לשנה. חוב שלא מוצמד נשאר כמו שהיה."],
        [64, 75, `אחרי ${V.years} שנים: ${shek(V.c10)} — בלי ריבית בכלל.`],
        [75, 83, "אבל כמה שווים השקלים האלה?"],
        [85, 95, "עכשיו מודדים הכול בכוח קנייה של היום."],
        [95, 106, "החוב המוצמד שווה בדיוק מה שהיה שווה בהתחלה."],
        [106, 119, `החוב שלא מוצמד שווה רק ${shek0(V.r10)} בכוח הקנייה של היום.`],
        [121, 131, "נומינלי: בשקלים כפי שהם כתובים, לפני אינפלציה."],
        [131, 141, "ריאלי: אחרי אינפלציה, בכוח קנייה."],
        [143, 153, "הצמדה שומרת על כוח הקנייה של הסכום."],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, s, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n500: "var(--mogi-n500)", n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };
      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);

      // Two bars a year (indexed, unindexed); year 0 at the right, time runs leftward.
      function chart(t, sc, o, real) {
        const base = 540, left = 170, right = 1110, scale = 0.0026;
        const band = (right - left) / series.length, w = band / 2 - 6;
        const shown = 1 + Math.floor(ease((t - sc[0] - 1.5) / 10) * (series.length - 1) + 0.0001);
        el("line", { x1: left, x2: right, y1: base, y2: base, stroke: C.n300, opacity: o });
        for (let i = 0; i < Math.min(shown, series.length); i++) {
          const r = series[i];
          const a = Number(real ? r.unindexed : r.indexed), b = Number(real ? r.unindexed_real : r.unindexed);
          const x = right - (i + 1) * band;
          el("rect", { x: x + band / 2 + 1, y: base - a * scale, width: w, height: a * scale, rx: 3, fill: C.teal, opacity: o });
          el("rect", { x: x + 5, y: base - b * scale, width: w, height: b * scale, rx: 3, fill: C.tq2, opacity: o });
          txt(x + band / 2, base + 26, String(r.year), 16, { fill: C.n600, o });
        }
        const yP = base - Number(V.p) * scale;
        el("line", { x1: left, x2: right, y1: yP, y2: yP, stroke: C.navy, "stroke-width": 2, "stroke-dasharray": "8 6", opacity: o * 0.8 });
        // Legend, right-aligned under the title.
        el("rect", { x: 1030, y: 152, width: 16, height: 16, rx: 3, fill: C.teal, opacity: o });
        txt(1020, 166, "חוב מוצמד", 20, { anchor: "start", fill: C.n700, o });
        el("rect", { x: 870, y: 152, width: 16, height: 16, rx: 3, fill: C.tq2, opacity: o });
        txt(860, 166, "חוב שלא מוצמד", 20, { anchor: "start", fill: C.n700, o });
        const done = shown >= series.length;
        const oEnd = done ? Math.min(o, clamp((t - sc[0] - 13) / 0.8)) : 0;
        const last = series[series.length - 1];
        const a = Number(real ? last.unindexed : last.indexed), b = Number(real ? last.unindexed_real : last.unindexed);
        // End values sit outside the chart, left of the last year's bars (ltr "end" = the right edge at x).
        txt(left - 8, base - a * scale + 8, shek0(a), 22, { anchor: "end", w: 700, fill: C.teal, o: oEnd, ltr: true });
        txt(left - 8, base - b * scale + 8, shek0(b), 22, { anchor: "end", w: 700, fill: C.n700, o: real ? oEnd : 0, ltr: true });
      }

      window.render = (t) => {
        svg.replaceChildren();
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 290, "הצמדה", 84, { w: 700, o });
          txt(640, 360, "חוב שגדל לבד", 34, { fill: C.n600, o });
          txt(640, 450, "מספרים להמחשה: אינפלציה קבועה, בלי ריבית", 22, { fill: C.n500, o: after(t, S.title, 5, o) });
        }
        if (inScene(t, S.step)) {
          const o = vis(t, S.step);
          txt(640, 140, "מדד אחד", 40, { w: 700, o });
          // Index box (right) and debt box (left).
          const o2 = after(t, S.step, 16, o);
          const g = clamp((t - S.step[0] - 17) / 1.2);
          el("rect", { x: 720, y: 220, width: 360, height: 170, rx: 16, fill: C.n0, stroke: C.n200, opacity: o });
          txt(900, 270, "המדד", 26, { fill: C.n600, o });
          txt(900, 345, g < 0.5 ? String(V.i0) : String(V.i1), 60, { w: 700, fill: g < 0.5 ? C.navy : C.teal, o, ltr: true });
          el("rect", { x: 200, y: 220, width: 420, height: 170, rx: 16, fill: C.n0, stroke: C.n200, opacity: o });
          txt(410, 270, "החוב", 26, { fill: C.n600, o });
          const o3 = after(t, S.step, 23, o);
          txt(410, 345, o3 < 0.5 ? shek(V.p) : shek(V.one), 52, { w: 700, fill: o3 < 0.5 ? C.navy : C.teal, o, ltr: true });
          el("rect", { x: 360, y: 430, width: 560, height: 80, rx: 14, fill: C.mint, opacity: o3 * 0.6 });
          txt(640, 482, `ההצמדה הוסיפה ${shek(V.add)}`, 30, { w: 600, o: o3 });
          txt(660, 315, "←", 44, { fill: C.n500, o: o2 });
        }
        if (inScene(t, S.nominal)) {
          const o = vis(t, S.nominal);
          txt(640, 125, "בשקלים שעל הנייר", 40, { w: 700, o });
          chart(t, S.nominal, o, false);
        }
        if (inScene(t, S.real)) {
          const o = vis(t, S.real);
          txt(640, 125, "בכוח קנייה של היום", 40, { w: 700, o });
          chart(t, S.real, o, true);
        }
        if (inScene(t, S.names)) {
          const o = vis(t, S.names);
          el("rect", { x: 680, y: 200, width: 440, height: 220, rx: 16, fill: C.n0, stroke: C.n200, opacity: o });
          txt(900, 270, "נומינלי", 48, { w: 700, o });
          txt(900, 330, "בשקלים כפי שהם כתובים", 26, { fill: C.n700, o });
          txt(900, 370, "לפני אינפלציה", 26, { fill: C.n700, o });
          const o2 = after(t, S.names, 10, o);
          el("rect", { x: 160, y: 200, width: 440, height: 220, rx: 16, fill: C.n0, stroke: C.teal, "stroke-width": 2, opacity: o2 });
          txt(380, 270, "ריאלי", 48, { w: 700, fill: C.teal, o: o2 });
          txt(380, 330, "בכוח קנייה", 26, { fill: C.n700, o: o2 });
          txt(380, 370, "אחרי אינפלציה", 26, { fill: C.n700, o: o2 });
        }
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 280, "הצמדה שומרת", 56, { w: 700, o });
          txt(640, 350, "על כוח הקנייה של הסכום.", 44, { w: 600, fill: C.n700, o });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
