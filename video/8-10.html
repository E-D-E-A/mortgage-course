<!doctype html>
<!--
  Video scene for lesson 8.10 - three forecasts (Directive 451, stress, macro). Pure function of t; numbers from data/lessons/8-10.json.
  Script: (1) title; (2) method / choice / opinion; (3) three prime paths; (4) the initial mix under all three; (5) what was decided: do not mix; (6) takeaway.
  ILLUSTRATION: the curves, the macro table and the stress shocks are invented.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      .tag { position: absolute; top: 36px; left: 40px; font-size: 16px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 8.10 · שלוש תחזיות</div>
      <div class="tag">נתונים סינתטיים · להדגמה</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/8-10.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const num = (v) => nf2.format(Number(v)).replace(/\.00$/, "");
      const shek = (v) => `${num(v)} ₪`;
      const pl = (v) => String(v).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      // LTR isolate for a number (the number only; a sign stays outside).
      const lr = (s) => `\u2066${s}\u2069`;

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, s, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6));
      const grow = (t, sc, s, d) => clamp((t - sc[0] - s) / d);

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)", n400: "var(--mogi-n400)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: anchor "start" puts its right edge at x. LTR runs (numbers) take ltr: true.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);
      const box = (x, y, w, h, o, fill = C.n0) => el("rect", { x, y, width: w, height: h, rx: 14, fill, stroke: fill === C.n0 ? C.n200 : "none", opacity: o });
      const bar = (x, y, w, h, fill, o = 1) => el("rect", { x, y, width: Math.max(0, w), height: h, rx: 6, fill, opacity: o });

      const SIDS = ["forecast451", "stress", "macro"];
      const NAME = { forecast451: "לפי הוראה 451", stress: "תרחיש לחץ", macro: "תחזית מקרו" };
      const KIND = { forecast451: "שיטה", stress: "בחירה", macro: "דעה" };
      const WHO = { forecast451: "חישוב קבוע מעקומי תשואה", stress: "מי שמנתח בוחר ״מה אם״", macro: "גוף מחקר על הכלכלה כולה" };
      const COL = { forecast451: C.teal, stress: C.navy, macro: C.tq2 };
      const path = (sid) => fact(`path.prime.${sid}`).map(Number);
      const S = { title: [0, 8], kinds: [8, 46], paths: [46, 92], mix: [92, 130], rule: [130, 156], end: [156, 170] };
      window.duration = 170;
      window.cues = [
        [1, 5, "שלוש תחזיות שנשמעות דומות ושונות מאוד."],
        [5, 7.5, "הנתונים כאן מומצאים, להדגמה."],
        [9, 17, "תחזית לפי הוראה 451: שיטה שנקבעה מראש."],
        [17, 26, "היא נועדה להשוות הצעות על בסיס זהה."],
        [26, 33, "תרחיש לחץ: מצב שאדם בחר, ״מה אם״."],
        [33, 40, "תחזית מקרו: דעה של גוף מחקר."],
        [40, 45, "אין ביניהן ״הנכונה״."],
        [47, 54, "הפריים בנתוני ההדגמה, ל־2026-09-03: שלוש דרכים."],
        [54, 64, `לפי 451 הוא עולה בהדרגה, עד ${fact("path.prime.forecast451")[9]}%.`],
        [64, 74, `בלחץ: קפיצה ל־${fact("path.prime.stress")[1]}% ושטוח.`],
        [74, 85, `במקרו: יורד ל־${fact("path.prime.macro")[2]}% ועולה.`],
        [85, 91, "אותה נקודת פתיחה, שלושה עתידים."],
        [93, 101, "התמהיל הראשוני של נועם ושירה, בשלושתם."],
        [101, 110, `החזר ראשון זהה: ${shek(fact("initial.forecast451.first"))}.`],
        [110, 120, `התשלום הגבוה ביותר: ${shek(fact("initial.forecast451.max"))} לפי 451.`],
        [120, 129, `בלחץ ${shek(fact("initial.stress.max"))}, במקרו ${shek(fact("initial.macro.max"))}.`],
        [131, 139, "ההחלטה: הצעה לפי 451 נשענת על קלטי 451."],
        [139, 148, "לחץ מוצג בנפרד, ומסומן כלחץ."],
        [148, 155, "לא מציגים מקרו כמספר של ההוראה."],
        [157, 163, "תרחיש לחץ אינו תקרה."],
        [163, 169, "מספר בלי שם התרחיש אינו מספר."],
      ];

      window.render = (t) => {
        svg.replaceChildren();
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 280, "שלוש תחזיות", 84, { w: 700, o });
          txt(640, 360, "שיטה · בחירה · דעה", 52, { w: 700, o: after(t, S.title, 1, o) });
          txt(640, 430, "נתונים מומצאים להמחשה: לא נתוני שוק, לא תחזית", 26, { fill: C.n600, o: after(t, S.title, 4, o) });
        }
        if (inScene(t, S.kinds)) {
          const o = vis(t, S.kinds);
          txt(640, 124, "מי קובע, ולשם מה", 40, { w: 700, o });
          const xs = [880, 520, 160];
          SIDS.forEach((sid, k) => {
            const oc = after(t, S.kinds, 1 + k * 8, o);
            box(xs[k], 180, 330, 270, oc);
            txt(xs[k] + 165, 232, NAME[sid], 28, { w: 700, o: oc });
            txt(xs[k] + 165, 300, KIND[sid], 56, { w: 700, fill: COL[sid] === C.tq2 ? C.teal : COL[sid], o: oc });
            txt(xs[k] + 165, 380, WHO[sid], 20, { fill: C.n600, o: oc });
          });
        }
        if (inScene(t, S.paths)) {
          const o = vis(t, S.paths);
          txt(640, 124, "הפריים בעשר השנים הבאות", 40, { w: 700, o });
          const G = { right: 1100, left: 260, base: 480, top: 230, lo: 4, hi: 7 };
          const X = (i) => G.right - (i / 9) * (G.right - G.left);
          const Y = (v) => G.base - ((v - G.lo) / (G.hi - G.lo)) * (G.base - G.top);
          el("line", { x1: G.left, x2: G.right, y1: G.base + 14, y2: G.base + 14, stroke: C.n300, opacity: o });
          [1, 5, 10].forEach((yr) => txt(X(yr - 1), G.base + 42, `שנה ${yr}`, 20, { fill: C.n600, o }));
          [4, 5, 6, 7].forEach((v) => { txt(G.left - 14, Y(v) + 6, `${v}%`, 18, { fill: C.n600, o, ltr: true, anchor: "end" }); el("line", { x1: G.left, x2: G.right, y1: Y(v), y2: Y(v), stroke: C.n200, opacity: o * 0.7 }); });
          SIDS.forEach((sid, k) => {
            const g = grow(t, S.paths, 8 + k * 10, 6);
            const pts = path(sid).map((v, i) => [X(i), Y(v)]);
            const upto = g * (pts.length - 1);
            const shown = pts.filter((_, i) => i <= Math.floor(upto));
            if (Math.floor(upto) < pts.length - 1) { const a = pts[Math.floor(upto)], b = pts[Math.floor(upto) + 1], fr = upto - Math.floor(upto); shown.push([a[0] + (b[0] - a[0]) * fr, a[1] + (b[1] - a[1]) * fr]); }
            if (shown.length > 1) el("polyline", { points: shown.map((p) => p.join(",")).join(" "), fill: "none", stroke: COL[sid], "stroke-width": 5, "stroke-dasharray": sid === "stress" ? "10 7" : "none", opacity: o });
            const ol = after(t, S.paths, 8 + k * 10, o);
            el("line", { x1: 1180 - k * 330, x2: 1130 - k * 330, y1: 184, y2: 184, stroke: COL[sid], "stroke-width": 5, "stroke-dasharray": sid === "stress" ? "10 7" : "none", opacity: ol });
            txt(1120 - k * 330, 192, NAME[sid], 24, { anchor: "start", w: 700, fill: COL[sid] === C.tq2 ? C.teal : COL[sid], o: ol });
          });
        }
        if (inScene(t, S.mix)) {
          const o = vis(t, S.mix);
          txt(640, 124, "אותו תמהיל, שלוש תוצאות", 40, { w: 700, o });
          const hx = [740, 420, 100];
          ["החזר ראשון", "הגבוה ביותר", "סך תשלומים"].forEach((h, k) => txt(hx[k] + 150, 190, h, 24, { fill: C.n600, w: 700, o }));
          SIDS.forEach((sid, r) => {
            const y = 250 + r * 90;
            const or = after(t, S.mix, 2 + r * 8, o);
            txt(1235, y, NAME[sid], 26, { anchor: "start", w: 700, o: or });
            ["first", "max", "total"].forEach((m, k) => txt(hx[k] + 150, y, shek(fact(`initial.${sid}.${m}`)), 28, { w: 700, ltr: true, fill: m === "max" ? C.teal : C.navy, o: or }));
          });
        }
        if (inScene(t, S.rule)) {
          const o = vis(t, S.rule);
          txt(640, 124, "מה הוחלט: לא מערבבים", 40, { w: 700, o });
          const rows = [["הצעה", "נשענת על קלטי הוראה 451"], ["לחץ", "מוצג בנפרד, ומסומן"], ["מקרו", "לא מוצג כמספר של ההוראה"]];
          rows.forEach(([a, b], k) => {
            const or = after(t, S.rule, 1 + k * 8, o);
            txt(1060, 250 + k * 90, a, 38, { anchor: "start", w: 700, o: or });
            txt(620, 250 + k * 90, b, 30, { anchor: "start", fill: C.teal, o: or });
          });
        }
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 290, "תרחיש לחץ אינו תקרה", 56, { w: 700, o });
          txt(640, 370, "מספר בלי שם התרחיש אינו מספר", 36, { fill: C.teal, o: after(t, S.end, 2, o) });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
