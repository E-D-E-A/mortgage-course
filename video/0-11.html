<!doctype html>
<!--
  Video scene for lesson 0.11 — "נדנדה של מחיר ותשואה".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t,
  so the same input always gives the same video.
  Every number comes from data/lessons/0-11.json. The subtitle cues (window.cues)
  carry the explanatory sentences — the script for narration, if it is ever added.
  No formula is shown: the video comes before the lesson's formula section.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 0.11 · אג״ח ותשואה</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/0-11.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      // "100 ₪" when whole, "97.33 ₪" otherwise; "4.76%" / "10%" for yields.
      const shek = (v) => `${nf2.format(Number(v))} ₪`.replace(".00 ₪", " ₪");
      const pc = (v) => `${Number(v)}%`;

      const V = {
        pay1: fact("one.payment"),
        p100: fact("one.price_100"), p105: fact("one.price_105"), p110: fact("one.price_110"),
        y100: fact("one.yield_100"), y105: fact("one.yield_105"), y110: fact("one.yield_110"),
        g100: fact("one.gain_100"), g105: fact("one.gain_105"),
        t4: fact("explain.table_4"), t5: fact("explain.table_5"), t6: fact("explain.table_6"),
        price4: fact("explain.price_4"), price5: fact("pred.price_5"), price6: fact("pred.price_6"),
        series: fact("video.series_3"),
      };
      const coupon = V.t5[0].payment; // the yearly payment, 5 ₪
      const face = fact("face");

      // Timeline (seconds). Each scene owns a window; render(t) draws whatever is on screen at t.
      const S = { title: [0, 12], one: [12, 52], multi: [52, 100], chart: [100, 134], end: [134, 152] };
      // Inside "one": the three prices, each with its own window.
      const ONE = [[19, 28, V.p100, V.y100, V.g100], [28, 38, V.p105, V.y105, V.g105], [38, 52, V.p110, V.y110, null]];
      // Inside "multi": the yield in force, and when it settles.
      const MULTI = [[52, 78, "5", V.t5, V.price5], [78, 88, "6", V.t6, V.price6], [88, 100, "4", V.t4, V.price4]];

      window.duration = 152;
      window.cues = [
        [1, 6, "אג״ח היא הלוואה עם תשלומים ידועים מראש."],
        [6, 11.5, "ואפשר למכור אותה למישהו אחר לפני הסוף."],
        [13, 19, `אג״ח עם תשלום אחד: ${shek(V.pay1)} בעוד שנה.`],
        [20, 27.5, `קונים ב־${shek(V.p100)}: רווח ${shek(V.g100)} מתוך ${shek(V.p100)} — ${pc(V.y100)}.`],
        [28.5, 37.5, `קונים ב־${shek(V.p105)}: רווח ${shek(V.g105)} מתוך ${shek(V.p105)} — ${pc(V.y105)}.`],
        [38.5, 45, `קונים ב־${shek(V.p110)}: אין רווח. תשואה: ${pc(V.y110)}.`],
        [45.5, 51, "המחיר עלה — התשואה ירדה."],
        [53, 61, `אג״ח של 3 שנים: ${shek(coupon)} בכל שנה, ובסוף גם ${shek(face)}.`],
        [61, 69, "המחיר הוא הערך הנוכחי של כל התשלומים יחד."],
        [70, 77, `בתשואה של ${pc(MULTI[0][2])}: המחיר ${shek(V.price5)} בדיוק.`],
        [78.5, 87.5, `תשואה של ${pc(MULTI[1][2])}: כל תשלום שווה פחות. ${shek(V.price6)}.`],
        [88.5, 99, `תשואה של ${pc(MULTI[2][2])}: המחיר עולה ל־${shek(V.price4)}.`],
        [101, 111, `כך זה נראה בכל תשואה, מ־${pc(V.series[0].yield)} עד ${pc(V.series[V.series.length - 1].yield)}.`],
        [111, 122, "ככל שהתשואה גבוהה יותר — המחיר נמוך יותר."],
        [122, 133, "התשלומים קבועים. רק המחיר זז."],
        [135, 142, "מחיר ותשואה הם שני צדדים של נדנדה אחת."],
        [142, 151, "בהמשך השיעור: מה קורה כשהתשלומים צמודים למדד."],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const at = (t, a, d = 0.6) => clamp((t - a) / d);

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n500: "var(--mogi-n500)", n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text, parent = svg) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        parent.appendChild(e);
        return e;
      };
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s, opts.parent);

      // The seesaw: pivot at (cx, cy), beam half-length L. Positive angle lifts the price end (the right).
      function seesaw(cx, cy, L, angle, priceLabel, yieldLabel, o) {
        el("polygon", { points: `${cx},${cy} ${cx - 30},${cy + 58} ${cx + 30},${cy + 58}`, fill: C.n300, opacity: o });
        const rad = (angle * Math.PI) / 180;
        const dx = L * Math.cos(rad), dy = L * Math.sin(rad);
        const right = [cx + dx, cy - dy], left = [cx - dx, cy + dy];
        el("line", { x1: left[0], y1: left[1], x2: right[0], y2: right[1], stroke: C.navy, "stroke-width": 14, "stroke-linecap": "round", opacity: o });
        el("circle", { cx: right[0], cy: right[1] - 34, r: 26, fill: C.teal, opacity: o });
        el("circle", { cx: left[0], cy: left[1] - 34, r: 26, fill: C.tq2, opacity: o });
        txt(right[0], right[1] - 78, "מחיר", 22, { w: 600, fill: C.n700, o });
        txt(left[0], left[1] - 78, "תשואה", 22, { w: 600, fill: C.n700, o });
        if (priceLabel) txt(right[0], right[1] + 46, priceLabel, 26, { w: 700, o, ltr: true });
        if (yieldLabel) txt(left[0], left[1] + 46, yieldLabel, 26, { w: 700, o, ltr: true });
      }

      // A card with a caption and a big number.
      function card(x, y, w, caption, value, o, accent = C.navy) {
        el("rect", { x, y, width: w, height: 104, rx: 14, fill: C.n0, stroke: C.n200, opacity: o });
        txt(x + w - 22, y + 36, caption, 20, { anchor: "start", fill: C.n600, o });
        txt(x + w - 22, y + 82, value, 38, { anchor: "end", w: 700, fill: accent, o, ltr: true });
      }

      window.render = (t) => {
        svg.replaceChildren();
        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 230, "אג״ח ותשואה", 84, { w: 700, o });
          txt(640, 290, "נדנדה של מחיר ותשואה", 34, { fill: C.n600, o });
          seesaw(640, 480, 170, 0, null, null, Math.min(o, at(t, 3, 0.8)));
        }
        // Scene 2 — one payment, three prices
        if (inScene(t, S.one)) {
          const o = vis(t, S.one);
          txt(640, 130, "אג״ח עם תשלום אחד", 40, { w: 700, o });
          el("rect", { x: 760, y: 170, width: 400, height: 80, rx: 14, fill: C.mint, opacity: o * 0.6 });
          txt(1140, 220, `בעוד שנה: ${shek(V.pay1)}`, 30, { anchor: "start", w: 700, o });
          // Which price is on screen, and how far the beam has moved toward it.
          let k = -1;
          for (let i = 0; i < ONE.length; i++) if (t >= ONE[i][0]) k = i;
          const angleOf = (price) => (Number(price) - 105) * 2.6;
          let angle = 0, oCards = 0;
          if (k >= 0) {
            const prev = k > 0 ? angleOf(ONE[k - 1][2]) : 0;
            angle = prev + (angleOf(ONE[k][2]) - prev) * ease((t - ONE[k][0]) / 1.4);
            oCards = Math.min(o, at(t, ONE[k][0] + 0.8));
          }
          seesaw(340, 440, 190, angle, k >= 0 && oCards > 0 ? shek(ONE[k][2]) : null, k >= 0 && oCards > 0 ? pc(ONE[k][3]) : null, o);
          if (k >= 0) {
            const [, , price, y, gain] = ONE[k];
            card(780, 290, 380, "המחיר ששילמתם", shek(price), oCards);
            card(780, 410, 380, gain ? `הרווח: ${shek(gain)}. התשואה:` : "אין רווח. התשואה:", pc(y), oCards, C.teal);
          }
          if (t >= 45.5) {
            const o5 = Math.min(o, at(t, 45.5));
            el("rect", { x: 100, y: 150, width: 480, height: 70, rx: 14, fill: C.n0, stroke: C.n200, opacity: o5 });
            txt(340, 196, "המחיר עלה — התשואה ירדה", 28, { w: 700, o: o5 });
          }
        }
        // Scene 3 — three payments, three yields
        if (inScene(t, S.multi)) {
          const o = vis(t, S.multi);
          txt(640, 130, "אג״ח של 3 שנים", 40, { w: 700, o });
          let k = 0;
          for (let i = 0; i < MULTI.length; i++) if (t >= MULTI[i][0]) k = i;
          const [start, , yieldPct, table, price] = MULTI[k];
          const prevTable = k > 0 ? MULTI[k - 1][3] : table;
          const g = k > 0 ? ease((t - start) / 1.6) : 1;
          // PV bars appear after the payments are shown (from 61s); before that, only payments.
          const showPv = at(t, 61, 1.2);
          const base = 520, scale = 2.4, w = 96, x0 = 1120;
          for (let i = 0; i < 3; i++) {
            const x = x0 - (i + 1) * 150;
            const pay = Number(table[i].payment);
            const pv = Number(prevTable[i].pv) + (Number(table[i].pv) - Number(prevTable[i].pv)) * g;
            el("rect", { x, y: base - pay * scale, width: w, height: pay * scale, fill: C.n300, rx: 4, opacity: o * at(t, 54 + i * 1.2) });
            el("rect", { x, y: base - pv * scale * showPv, width: w, height: pv * scale * showPv, fill: C.teal, rx: 4, opacity: o });
            txt(x + w / 2, base + 30, `שנה ${i + 1}`, 20, { fill: C.n600, o: o * at(t, 54 + i * 1.2) });
            const settled = k === 0 || t - start > 1.6;
            const lab = showPv > 0.9 && settled ? shek(table[i].pv) : shek(table[i].payment);
            txt(x + w / 2, base - Math.max(pay * scale, 14) - 12, lab, 20, { w: 600, o: o * at(t, 54 + i * 1.2), ltr: true, fill: showPv > 0.9 ? C.teal : C.n700 });
          }
          // Legend
          el("rect", { x: 1104, y: 168, width: 16, height: 16, rx: 3, fill: C.n300, opacity: o });
          txt(1094, 182, "התשלום", 18, { anchor: "start", fill: C.n700, o });
          el("rect", { x: 994, y: 168, width: 16, height: 16, rx: 3, fill: C.teal, opacity: o * showPv });
          txt(984, 182, "כמה הוא שווה היום", 18, { anchor: "start", fill: C.n700, o: o * showPv });
          // The seesaw and the price card on the left.
          const angleOf = (p) => (Number(p) - 100) * 4;
          const prevAngle = k > 0 ? angleOf(MULTI[k - 1][4]) : 0;
          const angle = prevAngle + (angleOf(price) - prevAngle) * g;
          const oNum = Math.min(o, at(t, 70) , k > 0 ? clamp((t - start - 1.4) / 0.5) : 1);
          seesaw(250, 470, 150, angle, oNum > 0 ? shek(price) : null, oNum > 0 ? pc(yieldPct) : null, o * at(t, 70));
          card(80, 180, 340, "התשואה בשוק", pc(yieldPct), Math.min(o, at(t, 70)), C.teal);
        }
        // Scene 4 — price at every yield
        if (inScene(t, S.chart)) {
          const o = vis(t, S.chart);
          txt(640, 130, "המחיר בכל תשואה", 40, { w: 700, o });
          const s = V.series;
          const left = 220, right = 1060, top = 180, bottom = 485;
          const minP = 85, maxP = 115;
          // Yield grows leftward, as Hebrew is read.
          const xOf = (i) => right - (i / (s.length - 1)) * (right - left);
          const yOf = (p) => bottom - ((Number(p) - minP) / (maxP - minP)) * (bottom - top);
          el("line", { x1: left, x2: right, y1: bottom, y2: bottom, stroke: C.n300, "stroke-width": 2, opacity: o });
          // The face, dashed: where the seesaw is level.
          el("line", { x1: left, x2: right, y1: yOf(face), y2: yOf(face), stroke: C.navy, "stroke-width": 2, "stroke-dasharray": "8 6", opacity: o * 0.7 });
          txt(left - 12, yOf(face) + 7, shek(face), 20, { anchor: "end", fill: C.n700, o, ltr: true });
          // Two more price ticks, so the vertical axis reads as price.
          for (const tick of [fact("video.tick_90"), fact("video.tick_110")]) {
            el("line", { x1: left, x2: right, y1: yOf(tick), y2: yOf(tick), stroke: C.n200, "stroke-width": 1, opacity: o });
            txt(left - 12, yOf(tick) + 7, shek(tick), 20, { anchor: "end", fill: C.n600, o, ltr: true });
          }
          txt(left - 12, top - 14, "מחיר", 20, { anchor: "end", w: 600, fill: C.n700, o, ltr: true });
          const shown = clamp((t - 102) / 8);
          const n = Math.max(1, Math.round(shown * (s.length - 1)));
          const d = s.slice(0, n + 1).map((r, i) => `${i ? "L" : "M"}${xOf(i)},${yOf(r.price)}`).join(" ");
          el("path", { d, fill: "none", stroke: C.teal, "stroke-width": 5, opacity: o });
          s.forEach((r, i) => {
            txt(xOf(i), bottom + 34, pc(r.yield), 20, { fill: C.n600, o, ltr: true });
            if (i <= n) el("circle", { cx: xOf(i), cy: yOf(r.price), r: 6, fill: C.teal, opacity: o });
          });
          txt(640, bottom + 72, "התשואה בשוק (עולה מימין לשמאל)", 20, { fill: C.n600, o });
          // A dot that travels the line, with its price.
          if (t >= 111) {
            const u = clamp((t - 111) / 10);
            const pos = u * (s.length - 1);
            const i = Math.min(s.length - 2, Math.floor(pos)), f = pos - i;
            const x = xOf(i) + (xOf(i + 1) - xOf(i)) * f;
            const y = yOf(s[i].price) + (yOf(s[i + 1].price) - yOf(s[i].price)) * f;
            el("circle", { cx: x, cy: y, r: 14, fill: C.tq2, stroke: C.navy, "stroke-width": 2, opacity: o });
          }
          const oEnds = Math.min(o, at(t, 110));
          txt(xOf(0) + 10, yOf(s[0].price) - 20, shek(s[0].price), 22, { anchor: "end", w: 700, o: oEnds, ltr: true });
          txt(xOf(s.length - 1) - 10, yOf(s[s.length - 1].price) - 20, shek(s[s.length - 1].price), 22, { anchor: "start", w: 700, o: oEnds, ltr: true });
        }
        // Scene 5 — takeaway
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 190, "מחיר עולה — תשואה יורדת.", 50, { w: 700, o });
          txt(640, 260, "מחיר יורד — תשואה עולה.", 50, { w: 700, o: Math.min(o, at(t, 136.5)) });
          seesaw(640, 480, 170, 8 * Math.sin((t - 134) * 0.9), null, null, Math.min(o, at(t, 137)));
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
