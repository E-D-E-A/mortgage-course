<!doctype html>
<!--
  Video scene for lesson 4.4 — "ארבעה איסורים וקו הון".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t.
  Every number comes from data/lessons/4-4.json. The five lines of Directive 329 were read from the official text (version 02/2026) on 2026-10-19.
  The subtitle cues (window.cues) carry the explanatory sentences — the narration script.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 4.4 · הוראה 329</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/4-4.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf0 = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 2 });
      const shek = (v) => `${nf0.format(Number(v))} ₪`;
      const num = (v) => nf0.format(Number(v));

      const chk = fact("ch.check");
      const L = Object.fromEntries(chk.map((r) => [r.id, r]));
      const V = {
        c75: fact("ceiling.only_home"), c70: fact("ceiling.replacement"), c50: fact("ceiling.investment"),
        pti: fact("pti.limit"), thr: fact("pti.threshold"), years: fact("term.years"), months: fact("term.months"),
        loan: fact("ch.loan"), value: fact("ch.value"), payment: fact("ch.payment"), income: fact("ch.income"),
        variable: fact("ch.variable"), maxVar: fact("ch.max_var"), varOver: fact("ch.var_over"),
        ltv: fact("ch.ltv"), ratio: fact("ch.ratio"), varShare: fact("ch.var_share"), termYears: fact("ch.term_years"),
      };


      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, from, o, d = 0.6) => Math.min(o, clamp((t - sc[0] - from) / d));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n50: "var(--mogi-n50)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n500: "var(--mogi-n500)", n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
        danger: "var(--mogi-danger)", dangerBg: "var(--mogi-danger-bg)", warning: "var(--mogi-warning)", warningBg: "var(--mogi-warning-bg)",
        success: "var(--mogi-success)", successBg: "var(--mogi-success-bg)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);


      const S = { title: [0, 10], lines: [10, 74], family: [74, 134], end: [134, 152] };
      window.duration = 152;
      window.cues = [
        [1, 6, "הוראה אחת של בנק ישראל, וחמישה קווים."],
        [6, 9.5, "ארבעה מהם איסור; אחד — קו של הון."],
        [11, 20, `קו 1: שיעור המימון. עד ${V.c75}%, ${V.c70}% או ${V.c50}%.`],
        [20, 30, "התקרה תלויה בסוג העסקה, ולא בבנק."],
        [31, 40, `קו 2: יחס ההחזר. עד ${V.pti}% מההכנסה הפנויה.`],
        [40, 50, `קו 3 שונה: מעל ${V.thr}% מותר, אבל הבנק מחזיק יותר הון.`],
        [51, 61, "קו 4: לכל היותר שני שלישים בריבית שיכולה להשתנות."],
        [61, 68, "כלומר: לפחות שליש בריבית קבועה."],
        [68, 73, `קו 5: עד ${V.years} שנה לתשלום האחרון.`],
        [75, 83, `תיק לדוגמה: הלוואה של ${shek(V.loan)} על ${shek(V.value)}.`],
        [83, 92, `שיעור המימון ${V.ltv}%: בתוך התקרה של ${V.c75}%.`],
        [92, 103, `יחס ההחזר ${V.ratio}%: מתחת ל־${V.pti}%, מעל ${V.thr}%.`],
        [103, 114, `החלק המשתנה ${V.varShare}%: מעל שני שלישים.`],
        [114, 123, `עודף של ${shek(V.varOver)}. זה איסור שנחצה.`],
        [123, 133, `התקופה: ${V.termYears} שנה. בדיוק על הקו.`],
        [135, 144, "מתקנים קו אחד, ובודקים שוב את כולם."],
        [144, 151, "הכול נקרא מהנוסח הרשמי של בנק ישראל."],
      ];

      const ROWS = [
        { id: "ltv", label: "שיעור מימון", lim: `עד ${V.c75}% בדירה יחידה`, kind: "ban" },
        { id: "pti", label: "יחס החזר", lim: `עד ${V.pti}%`, kind: "ban" },
        { id: "capital", label: "קו ההון", lim: `מעל ${V.thr}% — מותר`, kind: "thr" },
        { id: "variable", label: "ריבית משתנה", lim: "עד שני שלישים", kind: "ban" },
        { id: "term", label: "תקופה", lim: `עד ${V.years} שנה`, kind: "ban" },
      ];
      const RY = (i) => 168 + i * 82;
      const TX = 1190; // right edge of the labels

      // The bar for one row: the case's number against the line. Scale: a bit beyond the line.
      function bar(r, i, o, grow) {
        const row = L[r.id];
        const lim = Number(row.limit), act = Number(row.actual);
        const max = Math.max(lim * 1.25, act * 1.05);
        const x0 = 330, w = 520, y = RY(i) - 12;
        el("rect", { x: x0, y, width: w, height: 22, rx: 5, fill: C.n300, opacity: o * 0.45 });
        el("rect", { x: x0, y, width: (act / max) * w * ease(grow), height: 22, rx: 5, fill: C.teal, opacity: o });
        const lx = x0 + (lim / max) * w;
        el("line", { x1: lx, x2: lx, y1: y - 12, y2: y + 34, stroke: r.kind === "thr" ? C.warning : C.navy, "stroke-width": 4, "stroke-dasharray": "7 5", opacity: o });
      }

      window.render = (t) => {
        svg.replaceChildren();
        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 290, "ארבעה איסורים וקו הון", 80, { w: 700, o });
          txt(640, 365, "הוראה 329 של בנק ישראל", 36, { fill: C.n600, o });
          txt(640, 430, "נקרא מהנוסח הרשמי · גרסת 06/2026", 24, { fill: C.n500, o: after(t, S.title, 5, o, 0.8) });
        }
        // Scene 2 — the five lines
        if (inScene(t, S.lines)) {
          const o = vis(t, S.lines);
          txt(640, 96, "חמישה קווים: ארבעה איסורים וקו הון", 40, { w: 700, o });
          const starts = [1, 21, 30, 41, 58];
          ROWS.forEach((r, i) => {
            const oi = after(t, S.lines, starts[i], o);
            if (oi <= 0) return;
            const y = RY(i);
            txt(TX, y + 8, `${i + 1}. ${r.label}`, 30, { anchor: "start", w: 700, o: oi });
            txt(TX, y + 42, r.lim, 24, { anchor: "start", fill: r.kind === "thr" ? C.n700 : C.n700, o: oi });
            const tag = r.kind === "thr" ? "מותר · יותר הון" : "אסור לחצות";
            const col = r.kind === "thr" ? C.warningBg : C.dangerBg;
            el("rect", { x: 70, y: y - 22, width: 230, height: 46, rx: 23, fill: col, opacity: oi });
            txt(185, y + 9, tag, 21, { fill: C.navy, o: oi, w: 600 });
          });
          txt(640, 560, "קו ההון (40%): יותר הון לבנק, לא איסור", 20, { fill: C.n500, o: after(t, S.lines, 32, o) });
        }
        // Scene 3 — a family against the five lines
        if (inScene(t, S.family)) {
          const o = vis(t, S.family);
          txt(640, 96, `תיק לדוגמה: ${shek(V.loan)} על ${shek(V.value)}`, 38, { w: 700, o });
          const starts = [3, 13, 13, 27, 48];
          const shown = {
            ltv: `${V.ltv}%`, pti: `${V.ratio}%`, capital: `${V.ratio}%`, variable: `${V.varShare}%`, term: `${V.termYears} שנה`,
          };
          ROWS.forEach((r, i) => {
            const oi = after(t, S.family, starts[i], o);
            if (oi <= 0) return;
            const row = L[r.id];
            const y = RY(i);
            txt(TX, y + 8, r.label, 30, { anchor: "start", w: 700, o: oi });
            txt(TX, y + 42, `בתיק: ${shown[r.id]} · ${r.lim}`, 22, { anchor: "start", fill: C.n700, o: oi });
            bar(r, i, oi, (t - S.family[0] - starts[i]) / 2.5);
            const over = row.status === "over", above = row.status === "above";
            const col = over ? C.dangerBg : above ? C.warningBg : C.successBg;
            const label = over ? "נחצה" : above ? "מעל הקו" : "בתוך הקו";
            el("rect", { x: 70, y: y - 22, width: 200, height: 46, rx: 23, fill: col, opacity: oi });
            txt(170, y + 9, label, 24, { fill: C.navy, o: oi, w: 700 });
          });
        }
        // Scene 4 — close
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 250, "ארבעה איסורים, וקו אחד של הון", 52, { w: 700, o });
          txt(640, 340, "מתקנים קו אחד — ובודקים שוב את כולם", 34, { fill: C.n700, o: after(t, S.end, 1.5, o) });
          txt(640, 470, "נקרא מהנוסח הרשמי של בנק ישראל, הוראה 329, גרסת 06/2026.", 22, { fill: C.n500, o: after(t, S.end, 8, o) });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
