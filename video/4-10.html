<!doctype html>
<!--
  Video scene for lesson 4.10 — "תשעה כרטיסים על הלקוח".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t.
  Every number comes from data/lessons/4-10.json (the payment-to-income card's
  example and the count of open questions per card). The 40% and 50% lines are
  the team's transcription of Directive 329 and search summaries, not read in the
  source, so the scene marks them "לא אומת". The cue lines (window.cues) are the
  narration script, one line each.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 4.10 · כרטיסי הגורמים, א׳: הלקוח</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/4-10.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 2 });
      const shekels = (id) => `${nf.format(Number(fact(id)))} ₪`;

      const V = {
        disposable: shekels("card.pti.disposable"), payment: shekels("card.pti.payment"),
        ratio: fact("card.pti.ratio"), cap: fact("card.pti.cap"), capital: fact("card.pti.capital"),
        maxCap: shekels("card.pti.max_cap"), maxCapital: shekels("card.pti.max_capital"),
      };
      const CARDS = [
        ["pti", "יחס החזר"], ["equity", "הון עצמי"], ["income_source", "מקור ההכנסה"],
        ["obligations", "התחייבויות"], ["credit_history", "היסטוריית אשראי"], ["account_conduct", "התנהלות החשבון"],
        ["borrowers", "הרכב הלווים"], ["family", "מצב משפחתי"], ["residency", "תושבות ומס זר"],
      ].map(([id, title]) => ({ id, title, open: Number(fact(`grid.${id}.open`)) }));

      const S = { title: [0, 10], questions: [10, 42], pti: [42, 92], labels: [92, 128], grid: [128, 158], end: [158, 172] };
      window.duration = 172;
      window.cues = [
        [1, 5, "לכל גורם שהבנק בודק יש כרטיס."],
        [5, 9.5, "בכל כרטיס אותן שמונה שאלות."],
        [11, 18, "מה הגורם, ולמה הבנק מתעניין בו?"],
        [18, 25, "איך הוא משפיע על האישור ועל המחיר?"],
        [25, 33, "איפה הספים, ומאיזה מקור? זו השאלה החשובה."],
        [33, 41, "ואז: מה אפשר לשנות, כמה זה עולה, ודוגמה."],
        [43, 50, `משפחה עם הכנסה פנויה של ${V.disposable}.`],
        [50, 57, `תשלום חדש של ${V.payment}: יחס החזר ${V.ratio}%.`],
        [57, 66, `${V.capital}%: סף הון. מעליו הבנק מחזיק יותר הון.`],
        [66, 74, `${V.cap}%: תקרה. מעליה אין אישור. שניהם: לא אומת.`],
        [74, 83, "ומה זה עושה לריבית שמקבלים? לא ידוע."],
        [83, 91, "כרטיס טוב אומר גם את זה."],
        [93, 101, "לכל סף יש סימון של סוג המקור."],
        [101, 109, "לא אומת: כלל רשמי שעוד לא נקרא במקור."],
        [109, 117, "ידע מהשטח: מה שאיש מקצוע אמר, עם שם ותאריך."],
        [117, 127, "ושאלה פתוחה: מה שאף מקור לא נתן."],
        [129, 137, "תשעה כרטיסים על הלקוח."],
        [137, 147, "בחלקם יש שאלה פתוחה, ובחלקם לא."],
        [147, 157, "כל כרטיס הוא גם צומת במפה הכוללת."],
        [159, 165, "כרטיס שמודה במה שלא ידוע,"],
        [165, 171, "עדיף על מספר שהומצא."],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, from, o, d = 0.6) => Math.min(o, clamp((t - sc[0] - from) / d));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n500: "var(--mogi-n500)", n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)", warn: "var(--mogi-warning-bg)",
      };
      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);

      const QUESTIONS = [
        "מה הגורם?", "למה הבנק או הרגולטור מתעניינים בו?", "איך הוא משפיע על האישור ועל המחיר?", "איפה הספים, ומאיזה מקור?",
        "מה הלקוח באמת יכול לשנות בו?", "כמה השינוי עולה ללקוח?", "דוגמה מספרית", "איך האלגוריתם משתמש בו?",
      ];
      const KINDS = [
        { name: "לא אומת", ex: "כלל רשמי שהועתק או נקרא בתקציר", c: C.n300 },
        { name: "ידע מהשטח", ex: "איש מקצוע אמר, עם שם ותאריך", c: C.tq2 },
        { name: "החלטה של Mogi", ex: "הצוות הכריע, עם מי ומתי", c: C.teal },
        { name: "הנחת חישוב", ex: "מספר להמחשה, לא נתון", c: C.n200 },
        { name: "שאלה פתוחה", ex: "אף מקור לא נתן את זה", c: C.warn },
      ];

      window.render = (t) => {
        svg.replaceChildren();
        // 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 290, "תשעה כרטיסים על הלקוח", 76, { w: 700, o });
          txt(640, 360, "אותן שמונה שאלות לכל גורם", 32, { fill: C.n600, o });
          const o2 = after(t, S.title, 4, o, 0.8);
          for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) el("rect", { x: 580 + j * 48, y: 420 + i * 36, width: 40, height: 28, rx: 5, fill: C.tq2, opacity: o2 * 0.9 });
        }
        // 2 — the eight questions
        if (inScene(t, S.questions)) {
          const o = vis(t, S.questions);
          txt(640, 100, "שמונה שאלות בכל כרטיס", 40, { w: 700, o });
          QUESTIONS.forEach((q, i) => {
            const oi = after(t, S.questions, 1 + i * 3, o);
            const y = 160 + i * 50;
            const hot = i === 3 ? clamp((t - S.questions[0] - 22) / 1.2) : 0;
            if (i === 3) el("rect", { x: 380, y: y - 33, width: 760, height: 46, rx: 10, fill: C.mint, opacity: oi * 0.8 * hot });
            el("circle", { cx: 1120, cy: y - 10, r: 19, fill: i === 3 && hot > 0.5 ? C.teal : C.n200, opacity: oi });
            txt(1120, y - 2, String(i + 1), 22, { w: 700, o: oi, fill: i === 3 && hot > 0.5 ? C.n0 : C.navy, ltr: true });
            txt(1085, y, q, 28, { anchor: "start", o: oi, w: i === 3 ? 700 : 400 });
          });
        }
        // 3 — one card: payment to income, with its two lines
        if (inScene(t, S.pti)) {
          const o = vis(t, S.pti);
          txt(640, 110, "כרטיס 1: יחס החזר", 40, { w: 700, o });
          const o1 = after(t, S.pti, 1, o);
          el("rect", { x: 300, y: 150, width: 680, height: 74, rx: 14, fill: C.mint, opacity: o1 * 0.6 });
          txt(640, 200, `${V.payment} ÷ ${V.disposable} × 100 = ${V.ratio}%`, 36, { w: 700, o: o1, ltr: true });
          const X = (p) => 1080 - p * 15;
          const Y = 330, H = 60;
          const o2 = after(t, S.pti, 6, o);
          el("rect", { x: X(Number(V.capital)), y: Y, width: X(0) - X(Number(V.capital)), height: H, fill: C.teal, opacity: o2 });
          el("rect", { x: X(Number(V.cap)), y: Y, width: X(Number(V.capital)) - X(Number(V.cap)), height: H, fill: C.tq2, opacity: o2 });
          el("rect", { x: X(60), y: Y, width: X(Number(V.cap)) - X(60), height: H, fill: "none", stroke: C.navy, "stroke-width": 3, "stroke-dasharray": "10 7", opacity: o2 });
          txt(X(Number(V.capital) / 2), Y + 38, "מתחת לסף", 24, { fill: C.n0, o: o2, w: 600 });
          txt(X((Number(V.capital) + Number(V.cap)) / 2), Y + 38, "בין הקווים", 22, { fill: C.navy, o: o2, w: 600 });
          txt(X((Number(V.cap) + 60) / 2), Y + 38, "אסור", 22, { fill: C.navy, o: o2, w: 600 });
          const o3 = after(t, S.pti, 15, o);
          el("line", { x1: X(Number(V.capital)), x2: X(Number(V.capital)), y1: Y - 62, y2: Y + H + 10, stroke: C.navy, "stroke-width": 3, opacity: o3 });
          txt(X(Number(V.capital)), Y - 70, `סף הון ${V.capital}%`, 24, { w: 700, o: o3, fill: C.navy });
          txt(X(Number(V.capital)), Y + H + 34, "לא אומת", 20, { o: o3, fill: C.n600 });
          const o4 = after(t, S.pti, 23, o);
          el("line", { x1: X(Number(V.cap)), x2: X(Number(V.cap)), y1: Y - 62, y2: Y + H + 10, stroke: C.navy, "stroke-width": 3, opacity: o4 });
          txt(X(Number(V.cap)), Y - 70, `תקרה ${V.cap}%`, 24, { w: 700, o: o4, fill: C.navy });
          txt(X(Number(V.cap)), Y + H + 34, "לא אומת", 20, { o: o4, fill: C.n600 });
          // The family's point
          const o5 = after(t, S.pti, 9, o);
          const px = X(Number(V.ratio));
          el("polygon", { points: `${px - 12},${Y - 20} ${px + 12},${Y - 20} ${px},${Y - 2}`, fill: C.navy, opacity: o5 });
          txt(px - 6, Y - 28, `${V.ratio}%`, 26, { w: 700, o: o5, ltr: true });
          const o6 = after(t, S.pti, 31, o);
          el("rect", { x: 250, y: 488, width: 780, height: 64, rx: 14, fill: C.warn, opacity: o6 });
          txt(640, 530, "ואם זה מגיע לריבית? שאלה פתוחה: לא ידוע", 32, { w: 700, o: o6 });
          txt(640, 462, `התשלום הגבוה ביותר: מתחת לסף ${V.maxCapital}, מתחת לתקרה ${V.maxCap}`, 22, { fill: C.n700, o: after(t, S.pti, 18, o) });
        }
        // 4 — the labels of a source
        if (inScene(t, S.labels)) {
          const o = vis(t, S.labels);
          txt(640, 105, "לכל סף: סימון של סוג המקור", 40, { w: 700, o });
          KINDS.forEach((k, i) => {
            const oi = after(t, S.labels, 1 + i * 6, o);
            const y = 160 + i * 78;
            el("rect", { x: 900, y, width: 280, height: 56, rx: 28, fill: k.c, opacity: oi, stroke: C.n300 });
            txt(1040, y + 38, k.name, 28, { w: 700, o: oi, fill: i === 2 ? C.n0 : C.navy });
            txt(870, y + 38, k.ex, 28, { anchor: "start", o: oi, fill: C.n700 });
          });
        }
        // 5 — the nine cards
        if (inScene(t, S.grid)) {
          const o = vis(t, S.grid);
          txt(640, 105, "תשעת כרטיסי הלקוח", 40, { w: 700, o });
          CARDS.forEach((c, i) => {
            const row = Math.floor(i / 3), col = i % 3;
            const x = 940 - col * 360, y = 150 + row * 130;
            const oi = after(t, S.grid, 0.5 + i * 0.5, o);
            el("rect", { x, y, width: 330, height: 108, rx: 14, fill: C.n0, stroke: c.open ? C.navy : C.n200, "stroke-width": c.open ? 3 : 1, opacity: oi });
            txt(x + 165, y + 55, c.title, 28, { w: 700, o: oi });
            if (c.open) {
              const oo = after(t, S.grid, 6, oi);
              el("rect", { x: x + 100, y: y + 68, width: 130, height: 28, rx: 14, fill: C.warn, opacity: oo });
              txt(x + 165, y + 89, "שאלה פתוחה", 18, { w: 600, o: oo });
            }
          });
        }
        // 6 — closing
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 280, "כרטיס שמודה במה שלא ידוע", 52, { w: 700, o });
          txt(640, 360, "עדיף על מספר שהומצא", 52, { w: 700, o, fill: C.teal });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
