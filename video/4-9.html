<!doctype html>
<!--
  Video scene for lesson 4.9 — "שלוש שאלות על הדירה".
  Rendered frame by frame by scripts/render-video.mjs: window.render(t) is a pure
  function of t. Every number comes from data/lessons/4-9.json (case B: the price, the
  invented appraisal, the loan, the two financing ratios, the 75% ceiling for a single
  home as the team transcribed it, the balances for the life cover, and the insurance
  rules of Directive 451 section 11 as the team transcribed them). The scene does no
  arithmetic; bar lengths are geometry from the data's own numbers. window.cues carry
  the explanatory sentences.

  Script (one idea: the bank asks three questions about the collateral):
  1. Title.
  2. How much is it worth: the appraisal against the price, the financing ratio against
     the lower of the two (a search summary of a Bank of Israel document; not verified).
  3. Whose is it, and can the bank be registered on it: where the rights are registered,
     what is registered for the bank; where files get stuck (one banker; not verified).
  4. What if a borrower dies or the building is damaged: two insurances, the bank as
     irrevocable beneficiary; the life cover follows the balance.
  5. The rules as transcribed (the bank may require; outside insurance is allowed; 14 days
     for an outside policy; none under 30,000 shekels): all "לא אומת".
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 4.9 · הבטוחה</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/4-9.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const numW = (v) => new Intl.NumberFormat("he-IL", { maximumFractionDigits: 0 }).format(Number(v));
      const V = {
        price: fact("case.price"), appraisal: fact("case.appraisal"), loan: fact("case.loan"),
        ltvP: fact("case.ltv_price"), ltvA: fact("case.ltv_appraisal"), ceil: fact("rule.ceiling_single"),
        b60: fact("life.after_60"), b120: fact("life.after_120"), b240: fact("life.after_240"),
        policyDays: fact("rule.policy_answer_days"), below: fact("rule.no_insurance_below"),
      };

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      // Opacity of something that appears at absolute time `start`, inside a scene of opacity o.
      const at = (t, start, o, d = 0.6) => Math.min(o, clamp((t - start) / d));
      const num = (v) => new Intl.NumberFormat("he-IL").format(Number(v));
      const shekel = (v) => `${num(v)} ₪`;

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)", warn: "var(--mogi-warning)", warnBg: "var(--mogi-warning-bg)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: "start" puts the text's right edge at x. LTR runs (numbers, equations, no
      // Hebrew) use ltr: true, laid out strictly left to right so "2 × 2 = 4" never flips.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": opts.ltr ? "bidi-override" : "isolate" }, s);
      const box = (x, y, w, h, o, opts = {}) =>
        el("rect", { x, y, width: w, height: h, rx: opts.rx ?? 14, fill: opts.fill ?? C.n0, stroke: opts.stroke ?? C.n200, "stroke-width": opts.sw ?? 1.5, "stroke-dasharray": opts.dash ?? "none", opacity: o });

      
      const S = { title: [0, 10], value: [10, 60], rights: [60, 85], insure: [85, 128], rules: [128, 158] };
      window.duration = 158;
      window.cues = [
        [1, 5, "הבנק מלווה סכום גדול, והדירה היא הבטוחה שלו."],
        [5, 9.5, "שלוש שאלות: כמה היא שווה, של מי היא, ומה אם…"],
        [11, 19, `אבי קונה דירה ב־${num(V.price)} ₪ ומבקש ${num(V.loan)} ₪.`],
        [19, 28, `השמאי מעריך: ${num(V.appraisal)} ₪. פחות מהמחיר.`],
        [28, 37, `מול המחיר, שיעור המימון הוא ${V.ltvP}%.`],
        [37, 46, `מול השמאות, ${V.ltvA}%.`],
        [46, 55, `התקרה לדירה יחידה: ${V.ceil}% (לא אומת).`],
        [55, 59.5, "השווי לחישוב: הנמוך מבין השניים, לפי תקציר."],
        [61, 69, "הזכויות רשומות בטאבו, ברמ״י או בחברה משכנת."],
        [69, 77, "הבנק רושם שטר משכנתא או משכון זכויות."],
        [77, 84.5, "טובי זמיר: כאן תיקים נתקעים. מקור יחיד."],
        [86, 94, "שני ביטוחים: ביטוח חיים וביטוח מבנה."],
        [94, 103, "בשניהם הבנק רשום כמוטב בלתי חוזר."],
        [103, 112, "ביטוח החיים הולך אחרי יתרת החוב."],
        [112, 127, `אחרי 10 שנים היתרה היא ${numW(V.b120)} ₪.`],
        [129, 137, "הבנק רשאי לדרוש ביטוח. לא חייב."],
        [137, 145, "מותר לבטח מחוץ לבנק."],
        [145, 152, `${V.policyDays} יום לבדוק פוליסה חיצונית; עד ${num(V.below)} ₪ בלי ביטוח.`],
        [152, 157.5, "הכללים לפי תעתיק של הצוות; לא אומת."],
      ];

      window.render = (t) => {
        svg.replaceChildren();

        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 290, "שלוש שאלות על הדירה", 68, { w: 700, o });
          txt(640, 360, "הבטוחה: שווי, רישום וביטוח", 36, { fill: C.n600, o });
        }

        // Scene 2 — the appraisal against the price
        if (inScene(t, S.value)) {
          const o = vis(t, S.value);
          txt(640, 112, "1. כמה היא שווה?", 40, { w: 700, o });
          const right = 1120, scale = 0.00046; // px per shekel, bars grow to the left
          const bar = (y, label, v, colour, start) => {
            const oi = at(t, start, o);
            const w = Number(v) * scale;
            el("rect", { x: right - w, y, width: w, height: 38, rx: 8, fill: colour, opacity: oi });
            txt(right - 14, y + 27, label, 22, { w: 600, anchor: "start", fill: C.n0, o: oi });
            txt(right - w - 12, y + 28, num(v), 24, { w: 700, ltr: true, anchor: "end", o: oi });
          };
          bar(170, "המחיר בחוזה", V.price, C.teal, 11);
          bar(222, "השמאות", V.appraisal, C.navy, 19);
          bar(274, "ההלוואה", V.loan, C.tq2, 11);
          // The financing ratio on a 0-100% axis, 0 at the right.
          const unit = 8, y = 430, X = (p) => right - Number(p) * unit;
          el("line", { x1: X(100), x2: right + 10, y1: y, y2: y, stroke: C.n300, "stroke-width": 4, opacity: at(t, 28, o) });
          [0, 25, 50, 75, 100].forEach((p) => {
            el("line", { x1: X(p), x2: X(p), y1: y - 8, y2: y + 8, stroke: C.n300, "stroke-width": 2, opacity: at(t, 28, o) });
            txt(X(p), y + 34, `${p}%`, 18, { fill: C.n600, ltr: true, o: at(t, 28, o) });
          });
          txt(1160, y - 6, "שיעור מימון", 20, { w: 600, fill: C.n600, anchor: "start", o: at(t, 28, o) });
          const oP = at(t, 28, o);
          el("circle", { cx: X(V.ltvP), cy: y, r: 12, fill: C.teal, opacity: oP });
          txt(X(V.ltvP) + 44, y - 58, "מול המחיר", 21, { w: 600, o: oP });
          txt(X(V.ltvP) + 44, y - 28, `${V.ltvP}%`, 24, { w: 700, ltr: true, o: oP });
          const oA = at(t, 37, o);
          el("circle", { cx: X(V.ltvA), cy: y, r: 12, fill: C.navy, opacity: oA });
          txt(X(V.ltvA), y + 72, "מול השמאות", 21, { w: 600, o: oA });
          txt(X(V.ltvA), y + 102, `${V.ltvA}%`, 24, { w: 700, ltr: true, o: oA });
          const oC = at(t, 46, o);
          el("line", { x1: X(V.ceil), x2: X(V.ceil), y1: y - 84, y2: y + 14, stroke: C.warn, "stroke-width": 3, "stroke-dasharray": "8 6", opacity: oC });
          txt(X(V.ceil), y - 96, `תקרה ${V.ceil}%`, 21, { w: 700, fill: C.warn, o: oC });
          txt(640, 575, "לפי תקציר של מקור רשמי (2026-10-10; לא אומת): השווי לחישוב הוא הנמוך מבין השמאות למחיר. דוגמה לימודית.", 17, { fill: C.n600, o: at(t, 55, o) });
        }

        // Scene 3 — whose is it, and the registration
        if (inScene(t, S.rights)) {
          const o = vis(t, S.rights);
          txt(640, 112, "2. של מי היא, ואפשר לרשום עליה?", 40, { w: 700, o });
          const places = ["הטאבו", "רשות מקרקעי ישראל", "חברה משכנת"];
          places.forEach((name, i) => {
            const oi = at(t, 61 + i * 2, o);
            const x = 1020 - i * 360;
            box(x - 150, 160, 300, 80, oi, { stroke: C.teal, sw: 2.5 });
            txt(x, 210, name, 26, { w: 700, o: oi });
          });
          txt(640, 275, "כך רשומות הזכויות בדירה, לפי המקום", 20, { fill: C.n600, o: at(t, 66, o) });
          const oR = at(t, 69, o);
          box(640, 305, 500, 100, oR, { stroke: C.navy, sw: 2.5 });
          txt(890, 345, "הזכויות רשומות בטאבו על שם הקונים", 21, { fill: C.n700, o: oR });
          txt(890, 383, "שטר משכנתא", 28, { w: 700, o: oR });
          const oM = at(t, 72, o);
          box(100, 305, 500, 100, oM, { stroke: C.navy, sw: 2.5 });
          txt(350, 345, "עוד לא רשומות שם", 21, { fill: C.n700, o: oM });
          txt(350, 383, "משכון זכויות", 28, { w: 700, o: oM });
          const oW = at(t, 74, o);
          box(240, 430, 800, 60, oW, { fill: C.mint, stroke: C.mint });
          txt(640, 469, "ולפני שהכסף עובר: הערת אזהרה לטובת הבנק", 25, { w: 700, o: oW });
          const oT = at(t, 77, o);
          txt(640, 535, "״תיקים נופלים על הבטוחות״ — טובי זמיר, בנקאי מחוץ לצוות, 2026-08-05 (מקור יחיד).", 19, { fill: C.n700, o: oT });
          txt(640, 563, "ידע מהשטח, ממתין לאישור אילון. מסמכי הרישום: לפי מחקר הצוות; לא אומת.", 17, { fill: C.n600, o: oT });
        }

        // Scene 4 — the two insurances, and the life cover that follows the balance
        if (inScene(t, S.insure)) {
          const o = vis(t, S.insure);
          txt(640, 112, "3. ומה אם קורה משהו?", 40, { w: 700, o });
          const cards = [
            ["ביטוח חיים", "משלם את יתרת החוב אם לווה נפטר", 86],
            ["ביטוח מבנה", "מכסה את המבנה: רעידת אדמה, נזקי מים", 88],
          ];
          cards.forEach(([name, sub, start], i) => {
            const oi = at(t, start, o);
            const x = 900 - i * 560;
            box(x - 255, 150, 510, 110, oi, { stroke: C.teal, sw: 2.5 });
            txt(x, 198, name, 28, { w: 700, o: oi });
            txt(x, 238, sub, 20, { fill: C.n700, o: oi });
          });
          const oB = at(t, 94, o);
          box(290, 280, 700, 50, oB, { fill: C.mint, stroke: C.mint });
          txt(640, 313, "בשניהם הבנק רשום כמוטב בלתי חוזר", 24, { w: 700, o: oB });
          // The balance the life cover follows: 0, 60, 120 and 240 payments.
          const base = 510, scale = 0.00012; // px per shekel
          const bars = [["ההתחלה", V.loan, 103, 1040], ["אחרי 5 שנים", V.b60, 105, 800], ["אחרי 10 שנים", V.b120, 108, 560], ["אחרי 20 שנה", V.b240, 111, 320]];
          el("line", { x1: 150, x2: 1180, y1: base, y2: base, stroke: C.n300, "stroke-width": 3, opacity: at(t, 103, o) });
          bars.forEach(([label, v, start, x]) => {
            const oi = at(t, start, o);
            const h = Number(v) * scale;
            el("rect", { x: x - 70, y: base - h, width: 140, height: h, rx: 8, fill: C.teal, opacity: oi * 0.9 });
            txt(x, base - h + 32, numW(v), 22, { w: 700, ltr: true, fill: C.n0, o: oi });
            txt(x, base + 28, label, 20, { fill: C.n700, o: oi });
          });
          txt(150, 370, "יתרת החוב, שני המסלולים", 20, { w: 600, anchor: "end", fill: C.n700, o: at(t, 103, o) });
        }

        // Scene 5 — the rules as the team transcribed them
        if (inScene(t, S.rules)) {
          const o = vis(t, S.rules);
          txt(640, 112, "מה כתוב על הביטוחים", 40, { w: 700, o });
          const rules = [
            ["הבנק רשאי לדרוש", "לא חייב", 129],
            ["מותר לבטח מחוץ לבנק", "והבנק חייב לומר את זה באותיות גדולות", 137],
            [`${V.policyDays} יום`, "לבנק, לבדוק פוליסה חיצונית", 145],
            [`${num(V.below)} ₪`, "הלוואה או יתרה עד הסכום: בלי ביטוח", 147],
          ];
          rules.forEach(([title, sub, start], i) => {
            const oi = at(t, start, o);
            const x = 900 - (i % 2) * 560, y = 170 + Math.floor(i / 2) * 170;
            box(x - 255, y, 510, 140, oi, { stroke: C.teal, sw: 2.5 });
            txt(x, y + 60, title, 30, { w: 700, ltr: i >= 3 || false, o: oi });
            txt(x, y + 100, sub, 20, { fill: C.n700, o: oi });
          });
          txt(640, 540, "לפי תעתיק של הוראת בנק ישראל 451, סעיף 11, בצוות (אוגוסט 2026); לא אומת.", 19, { fill: C.n600, o: at(t, 152, o) });
        }
      };
      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
