<!doctype html>
<!--
  Video scene for lesson 8.14 - a grid search and shrinking the space. Pure function of t; numbers from data/lessons/8-14.json.
  Script: (1) title; (2) the loop: cheap check, engine, constraints, score; (3) the full grid: how many are rejected; (4) skip before calculating; (5) coarse then fine; (6) takeaway.
  ILLUSTRATION: the grid, weights, client limits and the fictional bank are for illustration.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      .tag { position: absolute; top: 36px; left: 40px; font-size: 16px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 8.14 · חיפוש על רשת</div>
      <div class="tag">נתונים סינתטיים · להדגמה</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/8-14.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const num = (v) => nf2.format(Number(v)).replace(/\.00$/, "");
      const shek = (v) => `${num(v)} ₪`;
      const pl = (v) => String(v).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      // LTR isolate for a number (the number only; a sign stays outside).
      const lr = (s) => `\u2066${s}\u2069`;

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, s, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6));
      const grow = (t, sc, s, d) => clamp((t - sc[0] - s) / d);

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)", n400: "var(--mogi-n400)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: anchor "start" puts its right edge at x. LTR runs (numbers) take ltr: true.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);
      const box = (x, y, w, h, o, fill = C.n0) => el("rect", { x, y, width: w, height: h, rx: 14, fill, stroke: fill === C.n0 ? C.n200 : "none", opacity: o });
      const bar = (x, y, w, h, fill, o = 1) => el("rect", { x, y, width: Math.max(0, w), height: h, rx: 6, fill, opacity: o });

      const full = fact("full"), pruned = fact("pruned"), s20 = fact("s20"), c2f = fact("c2f");
      const KIND = { "ק": "קבועה", "פ": "פריים", "מ": "משתנה" };
      const descP = (id) => [...id.matchAll(/([קפמ]+)(\d+)\/(\d+)/g)].map((m) => `${KIND[m[1]]} ${m[2]}%`).join(" · ") + ` · ${[...id.matchAll(/\/(\d+)/g)][0][1]} שנה`;
      const desc = (id) => [...id.matchAll(/([קפמ]+)(\d+)\/(\d+)/g)].map((m) => `${KIND[m[1]]} ${lr(m[2] + "%")}`).join(" · ") + ` · ${lr([...id.matchAll(/\/(\d+)/g)][0][1])} שנה`;
      const S = { title: [0, 8], loop: [8, 44], full: [44, 80], prune: [80, 112], c2f: [112, 148], end: [148, 164] };
      window.duration = 164;
      window.cues = [
        [1, 5, "חיפוש על רשת: לעבור על הכול, ולשמור את הטוב."],
        [5, 7.5, "הכול להדגמה: הרשת, המשקולות והריביות."],
        [9, 18, "לכל תמהיל ברשת: בדיקה זולה, מנוע, אילוצים, ציון."],
        [18, 28, "בדיקה זולה: חלק משתנה מעל שני שלישים?"],
        [28, 37, "רק מה שנשאר מגיע למנוע, החלק היקר."],
        [37, 43, "בסוף מנרמלים, נותנים ציון, ומדרגים."],
        [45, 53, `רשת של ${full.size} תמהילים, כולם נבדקו.`],
        [53, 62, `${full.rejected} נפסלו, ו־${full.feasible} עוברים.`],
        [62, 71, "רוב הרשת נפסלת: המגבלות של נועם ושירה."],
        [71, 79, `הטוב ביותר: ${descP(full.best)}.`],
        [81, 89, "קיצור דרך אחד: לדלג לפני שמחשבים."],
        [89, 98, `${pruned.pruned} תמהילים לא הגיעו למנוע.`],
        [98, 106, `קריאות למנוע: ${pruned.engine_calls} במקום ${full.engine_calls}.`],
        [106, 111, "אותו מנצח, אותו ציון."],
        [113, 121, "קיצור דרך שני: גס ואז עדין."],
        [121, 130, `רשת של 20%: ${s20.size} תמהילים, ${s20.engine_calls} קריאות.`],
        [130, 140, `ואז רק סביב הטוב: עוד ${c2f.fine_calls} קריאות.`],
        [140, 147, `סך הכול ${c2f.engine_calls} קריאות, אותו מנצח.`],
        [149, 156, "אבל גס ואז עדין לא מבטיח אותו מנצח."],
        [156, 163, "הטוב ביותר ברשת, בלי יותר מזה."],
      ];

      window.render = (t) => {
        svg.replaceChildren();
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 280, "חיפוש על רשת", 84, { w: 700, o });
          txt(640, 360, "וצמצום המרחב", 52, { w: 700, o: after(t, S.title, 1, o) });
          txt(640, 430, "המחשה של הקורס · נתונים סינתטיים · בנק א׳ בדוי", 26, { fill: C.n600, o: after(t, S.title, 4, o) });
        }
        if (inScene(t, S.loop)) {
          const o = vis(t, S.loop);
          txt(640, 124, "הלולאה", 40, { w: 700, o });
          const steps = [["א", "בדיקה זולה", "בלי חישוב: חלק משתנה, תקופה"], ["ב", "המנוע", "תזרים ומדדים בשני תרחישים"], ["ג", "אילוצים", "כל הסיבות לפסילה"], ["ד", "ציון משוקלל", "רק לעוברים, ובסוף דירוג"]];
          steps.forEach(([l, a, b], k) => {
            const y = 180 + k * 92;
            const oc = after(t, S.loop, 2 + k * 8, o);
            box(240, y, 800, 76, oc);
            txt(1000, y + 50, l, 40, { anchor: "start", w: 700, fill: C.teal, o: oc });
            txt(930, y + 50, a, 30, { anchor: "start", w: 700, o: oc });
            txt(560, y + 48, b, 22, { anchor: "start", fill: C.n600, o: oc });
          });
        }
        if (inScene(t, S.full)) {
          const o = vis(t, S.full);
          txt(640, 124, "כל הרשת, בלי דילוג", 40, { w: 700, o });
          const total = Number(full.size);
          const parts = [["נפסלו", Number(full.rejected), C.n300], ["עוברים", Number(full.feasible), C.teal]];
          const W = 900;
          let x = 1090;
          parts.forEach(([label, v, color], k) => {
            const w = Math.max(10, (v / total) * W) * grow(t, S.full, 4 + k * 4, 2);
            el("rect", { x: x - w, y: 220, width: w, height: 80, rx: 10, fill: color, opacity: o });
            x -= w;
          });
          txt(1090, 350, `נפסלו ${lr(full.rejected)}`, 30, { anchor: "start", w: 700, o: after(t, S.full, 8, o) });
          txt(190, 350, `עוברים ${lr(full.feasible)}`, 30, { anchor: "end", w: 700, fill: C.teal, o: after(t, S.full, 12, o) });
          txt(640, 450, `הטוב ביותר: ${desc(full.best)}`, 34, { w: 700, o: after(t, S.full, 24, o) });
        }
        if (inScene(t, S.prune)) {
          const o = vis(t, S.prune);
          txt(640, 124, "לדלג לפני שמחשבים", 40, { w: 700, o });
          const rows = [["בלי דילוג", full.engine_calls, C.n300], ["עם דילוג", pruned.engine_calls, C.teal]];
          rows.forEach(([a, v, color], k) => {
            const y = 220 + k * 110;
            const g = grow(t, S.prune, 4 + k * 6, 3);
            txt(1230, y + 46, a, 30, { anchor: "start", w: 700, o });
            const w = (v / Number(full.engine_calls)) * 700 * g;
            bar(1000 - w, y, w, 70, color, o);
            if (g > 0.95) txt(1000 - w - 14, y + 50, `${lr(v)} קריאות`, 28, { anchor: "end", w: 700, o });
          });
          txt(640, 480, `אותו מנצח, אותו ציון ${lr(pruned.best_score)}`, 30, { fill: C.n700, o: after(t, S.prune, 20, o) });
        }
        if (inScene(t, S.c2f)) {
          const o = vis(t, S.c2f);
          txt(640, 124, "גס ואז עדין", 40, { w: 700, o });
          const rows = [["רשת גסה (20%)", s20.engine_calls, C.tq2], ["+ עדין סביב הטוב", c2f.fine_calls, C.teal], ["סך הכול", c2f.engine_calls, C.navy]];
          rows.forEach(([a, v, color], k) => {
            const y = 210 + k * 96;
            const g = grow(t, S.c2f, 3 + k * 6, 3);
            txt(1230, y + 40, a, 28, { anchor: "start", w: 700, o });
            const w = (v / Number(full.engine_calls)) * 700 * g;
            bar(1000 - w, y, w, 60, color, o);
            if (g > 0.95) txt(1000 - w - 14, y + 44, `${v}`, 28, { anchor: "end", w: 700, o, ltr: true });
          });
          txt(640, 520, `מול ${lr(full.engine_calls)} בחיפוש המלא · אותו מנצח הפעם`, 28, { fill: C.n700, o: after(t, S.c2f, 22, o) });
        }
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 290, "הטוב ביותר ברשת", 56, { w: 700, o });
          txt(640, 370, "במשקולות האלה, באילוצים האלה", 34, { fill: C.teal, o: after(t, S.end, 2, o) });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
