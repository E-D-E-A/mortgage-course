<!doctype html>
<!--
  Video scene for lesson 1.2 — "עוגה של דירה".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t,
  so the same input always gives the same video.
  Every number comes from data/lessons/1-2.json. The ceilings (75 / 70 / 50) are the
  team's Brain transcription of the Bank of Israel's rule, not yet checked against the
  source, so the scene marks them "לא אומת" with the date. The subtitle cues
  (window.cues) carry the explanatory sentences — the script for narration, if it is
  ever added.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 1.2 · הון עצמי ושיעור מימון</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/1-2.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf0 = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 2 });
      const shek = (v) => `${nf0.format(Number(v))} ₪`;
      const num = (v) => nf0.format(Number(v));

      const limits = fact("limits.table");
      const V = {
        price: fact("explain.price"), equity: fact("explain.equity"), loan: fact("explain.loan"),
        ltv: fact("explain.ltv"), own: fact("explain.equity_share"),
        c75: fact("ceiling.only_home"), c70: fact("ceiling.replacement"), c50: fact("ceiling.investment"),
      };
      const kinds = [
        { row: limits[0], name: "אין לכם דירה אחרת" },
        { row: limits[1], name: "מחליפים דירה" },
        { row: limits[2], name: "דירה להשקעה" },
      ];

      // Timeline (seconds). Each scene owns a window; render(t) draws whatever is on screen at t.
      const S = { title: [0, 12], cake: [12, 50], ratio: [50, 85], limits: [85, 129], end: [129, 150] };
      window.duration = 150;
      window.cues = [
        [1, 6, "דירה עולה הרבה כסף. מאיפה הוא מגיע?"],
        [6, 11.5, "משני מקורות: הכסף שלכם, וההלוואה."],
        [13, 21, `דירה ב־${shek(V.price)}. זו כל העוגה.`],
        [21, 30, `${shek(V.equity)} אתם מביאים משלכם: ההון העצמי.`],
        [30, 39, `את ${shek(V.loan)} הנותרים מממנת ההלוואה.`],
        [39, 49, "מחיר הדירה = הון עצמי + הלוואה."],
        [51, 60, "שיעור המימון: איזה חלק מהעוגה ממומן בהלוואה."],
        [60, 70, `${num(V.loan)} מתוך ${num(V.price)}: שיעור מימון של ${V.ltv}%.`],
        [70, 78, `ה־${V.own}% הנותרים הם החלק שלכם — ההון העצמי.`],
        [78, 84, "שיעור המימון מדבר על ההלוואה, לא על הכסף שלכם."],
        [86, 95, "כמה גדולה יכולה להיות ההלוואה? יש תקרה."],
        [95, 104, `קונים דירה ואין לכם אחרת: עד ${V.c75}% מימון.`],
        [104, 113, `מחליפים דירה ומוכרים את הקודמת: עד ${V.c70}%.`],
        [113, 121, `דירה להשקעה: עד ${V.c50}%.`],
        [121, 128, "התקרות לפי תעתיק של הצוות; עוד לא אומתו."],
        [130, 139, `לאותה דירה: ${num(limits[0].min_equity)}, ${num(limits[1].min_equity)} או ${num(limits[2].min_equity)} ₪ משלכם.`],
        [139, 149, "ככל שהתקרה נמוכה יותר — צריך יותר הון עצמי."],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, from, o, d = 0.6) => Math.min(o, clamp((t - sc[0] - from) / d));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n500: "var(--mogi-n500)", n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);

      // A slice of a cake from fraction a to fraction b (0 = top, clockwise).
      function slice(cx, cy, r, a, b, fill, o) {
        if (b - a <= 0.0005) return;
        if (b - a >= 0.9995) { el("circle", { cx, cy, r, fill, opacity: o }); return; }
        const pt = (f) => [cx + r * Math.sin(2 * Math.PI * f), cy - r * Math.cos(2 * Math.PI * f)];
        const [x1, y1] = pt(a), [x2, y2] = pt(b);
        el("path", { d: `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${b - a > 0.5 ? 1 : 0} 1 ${x2} ${y2} Z`, fill, opacity: o, stroke: C.n0, "stroke-width": 3 });
      }
      // The cake: the equity slice first (from the top), then the loan.
      function cake(cx, cy, r, equityShare, grow, o) {
        el("circle", { cx, cy, r, fill: C.n300, opacity: o * 0.5 });
        const e = equityShare * clamp(grow * 2);
        const l = (1 - equityShare) * clamp(grow * 2 - 1);
        slice(cx, cy, r, 0, e, C.tq2, o);
        slice(cx, cy, r, equityShare, equityShare + l, C.teal, o);
      }
      function legendRow(x, y, color, label, value, o) {
        el("rect", { x: x - 26, y: y - 20, width: 26, height: 26, rx: 5, fill: color, opacity: o });
        txt(x - 40, y, label, 28, { anchor: "start", fill: C.n700, o });
        // An LTR run: "end" puts its right edge at x, under the label.
        txt(x - 40, y + 40, value, 34, { anchor: "end", w: 700, o, ltr: true });
      }
      // The buyer's part of the cake, as a fraction of the price — geometry only, from the data's own amounts.
      const share = (row) => Number(row.min_equity) / Number(V.price);

      window.render = (t) => {
        svg.replaceChildren();
        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 300, "עוגה של דירה", 84, { w: 700, o });
          txt(640, 370, "מאיפה מגיע הכסף לדירה", 34, { fill: C.n600, o });
          const o2 = after(t, S.title, 6.5, o, 0.8);
          cake(640, 470, 50, Number(V.own) / 100, 1, o2);
        }
        // Scene 2 — the cake: price = equity + loan
        if (inScene(t, S.cake)) {
          const o = vis(t, S.cake);
          txt(640, 120, "מחיר הדירה", 40, { w: 700, o });
          const grow = clamp((t - S.cake[0] - 8) / 20);
          cake(400, 340, 180, Number(V.own) / 100, grow, o);
          txt(400, 346, shek(V.price), 34, { w: 700, o: o * (1 - clamp(grow * 3)), ltr: true });
          const x = 1140;
          txt(x, 210, `כל העוגה: ${shek(V.price)}`, 30, { anchor: "start", w: 600, o: after(t, S.cake, 1.5, o) });
          legendRow(x, 290, C.tq2, "הון עצמי — הכסף שלכם", shek(V.equity), after(t, S.cake, 9, o));
          legendRow(x, 400, C.teal, "הלוואה", shek(V.loan), after(t, S.cake, 18, o));
          const o4 = after(t, S.cake, 27, o);
          el("rect", { x: 650, y: 488, width: 500, height: 60, rx: 12, fill: C.mint, opacity: o4 * 0.6 });
          txt(900, 528, "מחיר = הון עצמי + הלוואה", 30, { w: 700, o: o4 });
        }
        // Scene 3 — the financing ratio
        if (inScene(t, S.ratio)) {
          const o = vis(t, S.ratio);
          txt(640, 120, "שיעור מימון", 40, { w: 700, o });
          cake(400, 340, 180, Number(V.own) / 100, 1, o);
          // A navy ring marks the loan's part of the cake.
          const o2 = after(t, S.ratio, 8, o);
          const r = 196, own = Number(V.own) / 100;
          const pt = (f) => [400 + r * Math.sin(2 * Math.PI * f), 340 - r * Math.cos(2 * Math.PI * f)];
          const [x1, y1] = pt(own), [x2, y2] = pt(0.9999);
          el("path", { d: `M ${x1} ${y1} A ${r} ${r} 0 1 1 ${x2} ${y2}`, fill: "none", stroke: C.navy, "stroke-width": 6, opacity: o2, "stroke-linecap": "round" });
          txt(900, 250, `${num(V.loan)} מתוך ${num(V.price)}`, 36, { w: 600, o: o2 });
          const o3 = after(t, S.ratio, 12, o);
          el("rect", { x: 720, y: 285, width: 360, height: 110, rx: 14, fill: C.n0, stroke: C.n200, opacity: o3 });
          txt(900, 358, `${V.ltv}%`, 64, { w: 700, o: o3, ltr: true });
          txt(900, 430, "שיעור המימון", 26, { fill: C.n700, o: o3 });
          const o4 = after(t, S.ratio, 20, o);
          txt(900, 500, `ההון העצמי: ${V.own}%`, 28, { fill: C.n700, o: o4 });
        }
        // Scene 4 — the three ceilings
        if (inScene(t, S.limits)) {
          const o = vis(t, S.limits);
          txt(640, 110, `תקרות לשיעור המימון · דירה ב־${shek(V.price)}`, 34, { w: 700, o });
          const xs = [1020, 640, 260];
          kinds.forEach((k, i) => {
            const oi = after(t, S.limits, 9 + i * 9, o);
            const x = xs[i];
            txt(x, 172, `עד ${k.row.ceiling}%`, 34, { w: 700, o: oi });
            cake(x, 290, 100, share(k.row), clamp((t - S.limits[0] - 9 - i * 9) / 4), oi);
            txt(x, 432, k.name, 26, { fill: C.n700, o: oi });
            txt(x, 470, `הלוואה עד ${shek(k.row.max_loan)}`, 22, { fill: C.n700, o: oi });
            txt(x, 502, `משלכם לפחות ${shek(k.row.min_equity)}`, 22, { w: 600, o: oi });
          });
          // No Latin word next to the dates, so the line keeps its order right to left.
          txt(640, 552, "לא אומת: לפי תעתיק של הצוות מ־2026-10-08; ממתין לבדיקה מול המקור. נכון ל־2026-10-09.", 18, { fill: C.n500, o: after(t, S.limits, 33, o) });
        }
        // Scene 5 — takeaway: a lower ceiling needs more equity
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 130, "הון עצמי מינימלי, לאותה דירה", 40, { w: 700, o });
          const right = 1060, full = 760, max = Number(V.price);
          kinds.forEach((k, i) => {
            const oi = after(t, S.end, 1 + i * 2, o);
            const y = 200 + i * 100;
            const w = (Number(k.row.min_equity) / max) * full * clamp((t - S.end[0] - 1 - i * 2) / 2);
            el("rect", { x: right - full, y, width: full, height: 56, rx: 6, fill: C.n300, opacity: oi * 0.4 });
            el("rect", { x: right - w, y, width: w, height: 56, rx: 6, fill: C.tq2, opacity: oi });
            txt(right + 20, y + 37, `עד ${k.row.ceiling}%`, 26, { anchor: "end", w: 700, o: oi });
            txt(right - 16, y + 38, shek(k.row.min_equity), 26, { anchor: "end", w: 700, o: oi, ltr: true });
          });
          const o2 = after(t, S.end, 10, o, 0.8);
          txt(640, 540, "ככל שהתקרה נמוכה יותר — צריך יותר הון עצמי.", 32, { w: 700, o: o2 });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
