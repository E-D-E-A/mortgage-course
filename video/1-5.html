<!doctype html>
<!--
  Video scene for lesson 1.5 — "איזו עסקה זו".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t,
  so the same input always gives the same video.
  Numbers: the count of loan purposes on the advisor app's deal screen comes from
  data/lessons/1-5.json; the three financing ceilings are lesson 1.2's, read from
  data/lessons/1-2.json (the team's Brain transcription, not verified — the scene
  says so, with its date). The scene does no arithmetic. The subtitle cues
  (window.cues) carry the explanatory sentences — the script for narration, if it
  is ever added.

  Script (one idea: a deal is described by several answers, and the deciding one
  is how many homes you own):
  1. Title. The bank does not ask "which deal is this?" in one question.
  2. The deal screen's questions: the loan's purpose (9 options), how many homes
     you have and what happens to them, whom you buy from, and Mehir LaMishtaken.
  3. Buying: no other home = single; have one and sell it = replacement (home
     upgraders); have one and keep it = additional. What decides is how many homes
     you own, not which one you live in. The financing ceiling depends on it.
  4. Not buying: self-build, an any-purpose loan against a property you own, and
     refinancing — at the same bank (internal) or another (external).
  5. A client type (home upgraders) is not a deal type (replacement home): the
     form asks about the deal, not about who you are.
  Claim labels: the ceilings are "לא אומת" with the transcription date, as in 1.2.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 1.5 · סוגי עסקאות ולקוחות</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/1-5.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      // The financing ceilings are lesson 1.2's numbers, from its own data file.
      const data12 = await (await fetch("/data/lessons/1-2.json")).json();
      const limits = data12.facts.find((f) => f.id === "limits.table").value;

      const V = { purposes: fact("purposes.count") };

      // Timeline (seconds). Each scene owns a window; render(t) draws whatever is on screen at t.
      const S = { title: [0, 12], form: [12, 44], homes: [44, 96], other: [96, 132], end: [132, 150] };
      window.duration = 150;
      window.cues = [
        [1, 6, "״איזו עסקה זו?״ — הבנק לא שואל את זה בשאלה אחת."],
        [6, 11.5, "הוא שואל כמה שאלות, ומהתשובות יוצא סוג העסקה."],
        [13, 21, `מטרת ההלוואה: ${V.purposes} אפשרויות במסך ״העסקה״.`],
        [21, 28, "למשל רכישת דירה, בנייה עצמית, מחזור או שיפוץ."],
        [28, 36, "כמה דירות כבר יש לכם, ומה יקרה להן?"],
        [36, 43, "ממי קונים: קבלן או מוכר פרטי. ומקבלן — מחיר למשתכן?"],
        [45, 53, "אין לכם דירה אחרת? הדירה החדשה היא דירה יחידה."],
        [53, 61, "יש לכם דירה, ותמכרו אותה? זו דירה חליפית."],
        [61, 68, "כך קונים בדרך כלל משפרי דיור."],
        [68, 76, "יש לכם דירה, ותשאירו אותה? זו דירה נוספת."],
        [76, 86, "הקובע: כמה דירות בבעלותכם — לא באיזו מהן תגורו."],
        [86, 95, "ולמה זה חשוב? כי תקרת המימון תלויה בתשובה."],
        [97, 105, "ויש עסקאות שלא קונים בהן דירה."],
        [105, 113, "בנייה עצמית: הבית נבנה בכסף של ההלוואה."],
        [113, 121, "הלוואה לכל מטרה: כנגד נכס שכבר שלכם, לכל צורך."],
        [121, 131, "מחזור: מחליפים משכנתא קיימת, באותו בנק או בבנק אחר."],
        [133, 141, "״משפרי דיור״ הוא סוג לקוח. ״דירה חליפית״ — סוג עסקה."],
        [141, 149, "הטופס לא שואל מי אתם. הוא שואל מה העסקה."],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      // Opacity of something that appears at absolute time `start`, inside a scene of opacity o.
      const at = (t, start, o, d = 0.6) => Math.min(o, clamp((t - start) / d));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: "start" puts the text's right edge at x. LTR runs (numbers, equations, no
      // Hebrew) use ltr: true, laid out strictly left to right so "2 × 2 = 4" never flips.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": opts.ltr ? "bidi-override" : "isolate" }, s);
      const box = (x, y, w, h, o, opts = {}) =>
        el("rect", { x, y, width: w, height: h, rx: opts.rx ?? 14, fill: opts.fill ?? C.n0, stroke: opts.stroke ?? C.n200, "stroke-width": opts.sw ?? 1.5, "stroke-dasharray": opts.dash ?? "none", opacity: o });

      function house(cx, cy, s, o, opts = {}) {
        const fill = opts.fill ?? C.teal;
        if (opts.outline) {
          el("path", { d: `M ${cx - 40 * s} ${cy - 6 * s} L ${cx} ${cy - 40 * s} L ${cx + 40 * s} ${cy - 6 * s} M ${cx - 30 * s} ${cy - 6 * s} L ${cx - 30 * s} ${cy + 34 * s} L ${cx + 30 * s} ${cy + 34 * s} L ${cx + 30 * s} ${cy - 6 * s}`, fill: "none", stroke: fill, "stroke-width": 3, "stroke-dasharray": "6 5", opacity: o });
          return;
        }
        el("polygon", { points: `${cx - 40 * s},${cy - 6 * s} ${cx},${cy - 40 * s} ${cx + 40 * s},${cy - 6 * s}`, fill, opacity: o });
        el("rect", { x: cx - 30 * s, y: cy - 6 * s, width: 60 * s, height: 40 * s, fill, opacity: o });
        el("rect", { x: cx - 8 * s, y: cy + 12 * s, width: 16 * s, height: 22 * s, fill: C.n0, opacity: o });
      }
      // A cross over something that will be sold.
      const cross = (cx, cy, o) => {
        el("line", { x1: cx - 34, y1: cy - 34, x2: cx + 34, y2: cy + 30, stroke: C.navy, "stroke-width": 4, opacity: o });
        el("line", { x1: cx + 34, y1: cy - 34, x2: cx - 34, y2: cy + 30, stroke: C.navy, "stroke-width": 4, opacity: o });
      };

      const HOMES = [
        { name: "דירה יחידה", q: "אין לכם דירה אחרת", start: 45, now: [], ceiling: limits[0].ceiling },
        { name: "דירה חליפית", q: "יש לכם דירה, ותמכרו אותה", start: 53, now: ["sell"], ceiling: limits[1].ceiling },
        { name: "דירה נוספת", q: "יש לכם דירה, ותשאירו אותה", start: 68, now: ["keep"], ceiling: limits[2].ceiling },
      ];

      window.render = (t) => {
        svg.replaceChildren();

        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 290, "איזו עסקה זו?", 84, { w: 700, o });
          txt(640, 360, "סוגי עסקאות ולקוחות", 34, { fill: C.n600, o });
        }

        // Scene 2 — the deal screen asks several questions
        if (inScene(t, S.form)) {
          const o = vis(t, S.form);
          txt(640, 112, "המסך ״העסקה״ שואל כמה שאלות", 38, { w: 700, o });
          box(190, 150, 900, 410, o);
          const rows = [
            ["מטרת ההלוואה", `${V.purposes} אפשרויות`, 13, ["רכישת דירה", "בנייה עצמית", "מחזור", "שיפוץ", "…"]],
            ["דירה יחידה / חליפית / נוספת", "כמה דירות כבר יש לכם?", 28, []],
            ["ממי קונים", "קבלן · מוכר פרטי", 36, []],
            ["מחיר למשתכן", "רק כשקונים מקבלן: כן · לא", 39.5, []],
          ];
          rows.forEach(([label, hint, start, chips], i) => {
            const oi = at(t, start, o);
            const y = 180 + i * 98;
            txt(1060, y + 30, label, 26, { anchor: "start", w: 700, o: oi });
            box(230, y, 470, 50, oi, { rx: 10, fill: C.n100, stroke: C.n300 });
            txt(680, y + 33, hint, 22, { anchor: "start", fill: C.n700, o: oi });
            if (chips.length) {
              const oc = at(t, 21, o);
              let x = 1060;
              chips.forEach((c) => {
                const cw = 24 + c.length * 11;
                box(x - cw, y + 54, cw, 32, oc, { rx: 16, fill: C.mint, stroke: C.mint });
                txt(x - cw / 2, y + 76, c, 18, { w: 600, o: oc });
                x -= cw + 12;
              });
            }
          });
        }

        // Scene 3 — buying: how many homes you already own
        if (inScene(t, S.homes)) {
          const o = vis(t, S.homes);
          txt(640, 112, "קונים דירה: מה כבר יש לכם?", 38, { w: 700, o });
          HOMES.forEach((h, i) => {
            const oi = at(t, h.start, o);
            const cx = 1000 - i * 360;
            box(cx - 165, 150, 330, 270, oi, { stroke: i === 1 && t >= 53 && t < 68 ? C.teal : C.n200, sw: i === 1 && t >= 53 && t < 68 ? 3 : 1.5 });
            txt(cx, 192, h.q, 22, { fill: C.n700, o: oi });
            // Now (right) → after the deal (left).
            if (h.now.length) house(cx + 80, 262, 0.9, oi, { fill: C.n600 });
            else house(cx + 80, 262, 0.9, oi, { fill: C.n300, outline: true });
            txt(cx + 20, 270, "←", 30, { w: 700, fill: C.n600, o: oi });
            if (h.now.length) {
              // After: the new home, and the old one — sold (crossed out) or kept.
              house(cx - 40, 262, 0.75, oi);
              house(cx - 112, 266, 0.65, oi, { fill: C.n600 });
              if (h.now[0] === "sell") cross(cx - 112, 266, oi);
            } else {
              house(cx - 70, 262, 0.9, oi);
            }
            txt(cx + 80, 318, "היום", 18, { fill: C.n600, o: oi });
            txt(cx - 76, 318, "אחרי הקנייה", 18, { fill: C.n600, o: oi });
            box(cx - 120, 340, 240, 54, oi, { rx: 27, fill: C.mint, stroke: C.mint });
            txt(cx, 376, h.name, 26, { w: 700, o: oi });
            if (i === 1) {
              const oU = at(t, 61, o);
              txt(cx, 448, "״משפרי דיור״", 24, { w: 700, fill: C.teal, o: oU });
            }
            const oC = at(t, 86, o);
            txt(cx, 486, `תקרת מימון: עד ${h.ceiling}%`, 24, { w: 600, o: oC });
          });
          const oK = at(t, 76, o);
          if (t < 85.6) {
            const ok = Math.min(oK, clamp((85.6 - t) / 0.6));
            box(240, 488, 800, 60, ok, { fill: C.navy, stroke: C.navy });
            txt(640, 527, "הקובע: כמה דירות בבעלותכם — לא באיזו מהן תגורו", 26, { w: 700, fill: C.n0, o: ok });
          }
          const oN = at(t, 86, o);
          txt(640, 540, "התקרות משיעור 1.2. לא אומת: לפי תעתיק של הצוות מ־2026-10-08; ממתין לבדיקה מול המקור.", 18, { fill: C.n600, o: oN });
        }

        // Scene 4 — deals without buying a home
        if (inScene(t, S.other)) {
          const o = vis(t, S.other);
          txt(640, 112, "עסקאות בלי קניית דירה", 38, { w: 700, o });
          const cards = [
            ["בנייה עצמית", ["ביום ההלוואה הבית עוד לא קיים:", "הוא נבנה בכסף של ההלוואה"], 105],
            ["הלוואה לכל מטרה", ["נכס שכבר שלכם הוא הבטוחה,", "והכסף לא משמש לקנות אותו"], 113],
            ["מחזור", ["מחליפים משכנתא קיימת בחדשה:", "באותו בנק — מחזור פנימי", "בבנק אחר — מחזור חיצוני"], 121],
          ];
          cards.forEach(([name, lines, start], i) => {
            const oi = at(t, start, o);
            const cx = 1000 - i * 360;
            box(cx - 165, 160, 330, 300, oi);
            if (i === 0) house(cx, 250, 1.1, oi, { outline: true });
            if (i === 1) { house(cx, 250, 1.1, oi); txt(cx + 62, 270, "₪", 40, { w: 700, fill: C.teal, o: oi }); }
            if (i === 2) {
              // The old mortgage (right) is replaced by a new one (left).
              box(cx + 20, 220, 70, 56, oi, { rx: 8, fill: C.n300, stroke: C.n300 });
              txt(cx, 258, "←", 30, { w: 700, fill: C.n600, o: oi });
              box(cx - 90, 220, 70, 56, oi, { rx: 8, fill: C.teal, stroke: C.teal });
            }
            txt(cx, 336, name, 28, { w: 700, o: oi });
            lines.forEach((l, j) => txt(cx, 378 + j * 30, l, 20, { fill: C.n700, o: oi }));
          });
          const oF = at(t, 97, o);
          txt(640, 520, "גם שיפוץ, הרחבת נכס ובניית ממ״ד הן מטרות נפרדות במסך ״העסקה״.", 20, { fill: C.n600, o: oF });
        }

        // Scene 5 — a client type is not a deal type
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 112, "סוג לקוח מול סוג עסקה", 40, { w: 700, o });
          const oA = at(t, 133, o);
          box(680, 160, 420, 250, oA);
          txt(890, 206, "סוג לקוח", 30, { w: 700, o: oA });
          txt(890, 236, "כך מדברים עליו", 20, { fill: C.n600, o: oA });
          ["משפרי דיור", "קונים דירה ראשונה", "ממחזרים"].forEach((c, j) => txt(890, 290 + j * 40, c, 24, { w: 600, o: oA }));
          const oB = at(t, 136, o);
          box(180, 160, 420, 250, oB, { stroke: C.teal, sw: 3 });
          txt(390, 206, "סוג עסקה", 30, { w: 700, o: oB });
          txt(390, 236, "מה שהטופס שואל", 20, { fill: C.n600, o: oB });
          ["מטרת ההלוואה", "דירה יחידה / חליפית / נוספת", "ממי קונים"].forEach((c, j) => txt(390, 290 + j * 40, c, 24, { w: 600, o: oB }));
          const oE = at(t, 141, o, 0.8);
          box(240, 460, 800, 64, oE, { fill: C.mint, stroke: C.mint });
          txt(640, 502, "הטופס לא שואל מי אתם. הוא שואל מה העסקה.", 28, { w: 700, o: oE });
        }
      };
      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
