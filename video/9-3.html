<!doctype html>
<!--
  Video scene for lesson 9.3 (stage 9, author B). Rendered frame by frame by scripts/render-video.mjs:
  window.render(t) depends only on t. Every number is read from /data/lessons/9-3.json (computed in code, rechecked in Python).
  One idea: from twelve candidates to one recommendation, the negotiation plan and the checks before the money moves (case A, synthetic, fictional banks).
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .mark { position: absolute; top: 40px; left: 40px; font-size: 16px; font-weight: 600; color: var(--mogi-n600); }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="mark">דוגמה לימודית: נתונים להמחשה בלבד</div>
      <div class="kicker">שיעור 9.3 · המלצה, משא ומתן ובדיקות</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/9-3.json")).json();
      const V = (k) => String(data.facts.find((f) => f.id === k).value);
      const lr = (x) => `⁦${x}⁩`;
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const vis = (t, sc) => Math.min(clamp((t - sc[0]) / 0.6), clamp((sc[1] - t) / 0.6));
      const after = (t, sc, from, o, d = 0.6) => Math.min(o, clamp((t - sc[0] - from) / d));
      const C = { navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)", n500: "var(--mogi-n500)", n600: "var(--mogi-n600)", n700: "var(--mogi-n700)", teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", warningBg: "var(--mogi-warning-bg)", successBg: "var(--mogi-success-bg)", infoBg: "var(--mogi-info-bg)", dangerBg: "var(--mogi-danger-bg)", danger: "var(--mogi-danger)" };
      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const txt = (x, y, s, size, o = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": o.w ?? 400, fill: o.fill ?? C.navy, "text-anchor": o.anchor ?? "middle", opacity: o.o ?? 1, direction: o.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);
      const card = (x, y, w, h, o, fill = C.n0) => el("rect", { x, y, width: w, height: h, rx: 20, fill, stroke: C.n200, "stroke-width": 2, opacity: o });

      const SCENES = [
        { type: "title", at: [0, 9], title: "המלצה, משא ומתן ובדיקות", sub: "התיק של נועם ושירה", foot: "תיק סינתטי, בנקים בדויים. אומדנים במחירון התרגיל." },
        { type: "cards", at: [9, 46], title: "משתים עשרה אפשרויות לאחת", cards: [
          { h: "צירופים", s: "חלופה ובנק", big: { k: "fn.pairs" }, from: 1.5 },
          { h: "הבנק מאשר", s: "בנק ד׳ מסרב", big: { k: "fn.approved" }, from: 11 },
          { h: "התקציב מחזיק", s: "בחמש השנים הראשונות", big: { k: "fn.ok" }, from: 21 },
          { h: "קבועה בלבד", s: "מתוכן", big: { k: "fn.ok.exposure" }, from: 31 },
        ], foot: "אחר כך שואלים מה חשוב למשפחה", footAt: 31 },
        { type: "bars", at: [46, 76], title: "העלייה בלחץ, אצל בנק ב׳", fmt: "ils", bars: [
          { k: "g.payment.b.rise", label: "צמוד, שליש קבועה", from: 4 },
          { k: "g.total.b.rise", label: "25 שנה", from: 9 },
          { k: "g.exposure.b.rise", label: "קבועה בלבד", hl: true, from: 14 },
        ], foot: "בהנחת התרגיל: החזר שאפשר לסמוך עליו", footAt: 18 },
        { type: "cards", at: [76, 106], title: "ההמלצה: קבועה בלבד, בנק ב׳", cards: [
          { h: "החזר חודשי קבוע", s: "ללא עלייה", big: { k: "g.exposure.b.first", fmt: "ils" }, from: 1.5 },
          { h: "סך התשלומים", s: "תרחיש בסיס", big: { k: "g.exposure.b.total", fmt: "ils" }, from: 8 },
          { h: "מעל תקציב המחיה", s: "בחודש", big: { k: "g.exposure.b.margin60", fmt: "ils" }, from: 15 },
        ], foot: "הוודאות עולה בסך התשלומים מול 25 שנה", footAt: 22 },
        { type: "cards", at: [106, 131], title: "משא ומתן קטן, עם קו עצירה", cards: [
          { h: "סבב ראשון", s: "חיסכון בסך התשלומים", big: { k: "r1.total", fmt: "ils" }, from: 1.5 },
          { h: "סבב שני", s: "חיסכון בסך התשלומים", big: { k: "r2.total", fmt: "ils" }, from: 8 },
          { h: "קו עצירה", s: "מתחתיו לא ממשיכים", big: { k: "o.threshold", fmt: "ils" }, from: 15 },
        ], foot: "אין הצעה זולה יותר, ולכן אין כמעט מנוף", footAt: 19 },
        { type: "cards", at: [131, 161], title: "שמאות נמוכה משנה את התיק", cards: [
          { h: "השווי בתקרה", s: "ההלוואה בדיוק על התקרה", big: { k: "ap.break_even", fmt: "ils" }, from: 1.5 },
          { h: "שמאות נמוכה", s: "ערך הדירה", big: { k: "ap.2100000.value", fmt: "ils" }, from: 9 },
          { h: "חסר", s: "גם אחרי כל החסכונות", big: { k: "ap.2100000.short", fmt: "ils" }, from: 17 },
        ], foot: "מה הבנק עושה בפועל: לא ידוע", footAt: 24 },
        { type: "cards", at: [161, 173], title: "לפני שהכסף עובר", cards: [{ h: "הצעה בכתב, שמאות, תוקף", s: "מסמכים תואמים למה שנמסר", s2: "הלקוח קורא וחותם בעצמו" }], foot: "מחשבים מחדש על ההצעה הסופית", footAt: 5 },
      ];
      window.duration = 173;
      window.cues = [[1,5,"בוחרים חלופה אחת ובנק אחד, ומסבירים למה."],[5,8.5,"התיק בדוי, והבנקים בדויים."],[10,20,"שלוש חלופות וארבעה בנקים: שתים עשרה אפשרויות."],[20,30,"בנק שמסרב יוצא. בנק ד׳ מסרב לכולן."],[30,40,"תקציב שנשבר בחמש השנים הראשונות יוצא."],[40,45,"נשארות שמונה, ושלוש מהן קבועה בלבד."],[47,58,"עכשיו שואלים מה חשוב למשפחה."],[58,68,"בהנחת התרגיל: החזר שאפשר לסמוך עליו."],[68,75,"הקבועה בלבד לא עולה בלחץ."],[77,90,"ההחזר החודשי קבוע, והמרווח מהתקציב דק."],[90,101,"הוודאות עולה בסך התשלומים מול 25 שנה."],[101,105,"עדיפות אחרת מצדיקה בחירה אחרת."],[107,118,"אין הצעה זולה יותר שאפשר להראות לבנק ב׳."],[118,128,"עוצרים כשהחיסכון נמוך מהקו או שאין זמן."],[128,130,"וההצעה בכתב, על התמהיל המדויק."],[132,143,"שמאות נמוכה משנה את שיעור המימון."],[143,153,"ההלוואה חורגת מהתקרה, וצריך הון נוסף."],[153,160,"מה הבנק יעשה בפועל: לא ידוע."],[162,172,"רשימה לפני ההעמדה, וקוראים לפני שחותמים."]];
      const ils = (x) => Number(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₪";
      const bigOf = (b) => (b ? lr(b.fmt === "ils" ? ils(V(b.k)) : (b.pre ?? "") + V(b.k) + (b.suf ?? "")) : "");

      window.render = (t) => {
        svg.replaceChildren();
        for (const sc of SCENES) {
          const range = sc.at;
          if (!inScene(t, range)) continue;
          const o = vis(t, range);
          if (sc.type === "title") {
            txt(640, 270, sc.title, 70, { w: 700, o });
            txt(640, 350, sc.sub, 38, { fill: C.n600, o });
            if (sc.foot) txt(640, 430, sc.foot, 24, { fill: C.n500, o: after(t, range, 3, o, 0.8) });
          } else if (sc.type === "cards") {
            txt(640, 110, sc.title, 46, { w: 700, o });
            const n = sc.cards.length;
            const w = n === 1 ? 700 : n === 2 ? 480 : n === 3 ? 340 : 270;
            const gap = 30;
            const total = n * w + (n - 1) * gap;
            const x0 = 640 + total / 2;
            sc.cards.forEach((c, i) => {
              const oi = after(t, range, c.from ?? 1.5 + i * 3.5, o);
              if (oi <= 0) return;
              const right = x0 - i * (w + gap);
              const left = right - w;
              card(left, 170, w, 290, oi, c.fill ? C[c.fill] : C.n0);
              el("rect", { x: right - 14, y: 170, width: 14, height: 290, rx: 7, fill: c.bar ? C[c.bar] : C.teal, opacity: oi });
              txt((left + right) / 2 - 7, 235, c.h, n > 3 ? 30 : 34, { w: 700, o: oi });
              if (c.s) txt((left + right) / 2 - 7, 285, c.s, n > 3 ? 22 : 26, { fill: C.n700, o: oi });
              if (c.s2) txt((left + right) / 2 - 7, 322, c.s2, n > 3 ? 22 : 26, { fill: C.n700, o: oi });
              if (c.big) txt((left + right) / 2 - 7, 405, bigOf(c.big), bigOf(c.big).length > 11 ? 38 : 60, { w: 700, fill: C.teal, ltr: true, o: oi });
              if (c.big && c.bigLabel) txt((left + right) / 2 - 7, 440, c.bigLabel, 22, { fill: C.n600, o: oi });
            });
            if (sc.foot) txt(640, 540, sc.foot, 30, { w: 600, fill: C.n700, o: after(t, range, sc.footAt ?? 8, o) });
            if (sc.foot2) txt(640, 580, sc.foot2, 22, { fill: C.n500, o: after(t, range, (sc.footAt ?? 8) + 2, o) });
          } else if (sc.type === "bars") {
            txt(640, 110, sc.title, 46, { w: 700, o });
            const vals = sc.bars.map((b) => Number(V(b.k)));
            const max = Math.max(...vals) * 1.05;
            sc.bars.forEach((b, i) => {
              const oi = after(t, range, b.from ?? 1.5 + i * 3, o);
              if (oi <= 0) return;
              const y = 180 + i * 80;
              const w = 560 * (vals[i] / max) * clamp((t - range[0] - (b.from ?? 1.5 + i * 3)) / 1.2);
              txt(1140, y + 38, b.label, 28, { anchor: "start", fill: C.n700, o: oi });
              el("rect", { x: 920 - w, y, width: Math.max(w, 2), height: 56, rx: 10, fill: b.hl ? C.teal : C.tq2, opacity: oi });
              txt(920 - w - 14, y + 40, lr(sc.fmt === "ils" ? ils(V(b.k)) : V(b.k) + (sc.suf ?? "")), 30, { anchor: "end", w: 700, ltr: true, o: oi });
            });
            if (sc.foot) txt(640, 560, sc.foot, 30, { w: 600, fill: C.n700, o: after(t, range, sc.footAt ?? 8, o) });
            if (sc.foot2) txt(640, 598, sc.foot2, 22, { fill: C.n500, o: after(t, range, (sc.footAt ?? 8) + 2, o) });
          }
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
