<!doctype html>
<!--
  Video scene for lesson 5.3 — "שלושה מדדים, ארבעה תנאים".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t.
  Every number comes from data/lessons/5-3.json. The subtitle cues (window.cues)
  carry the explanatory sentences — the script for narration, if it is ever added.

  Script (one idea: an offer shows three measures, and they can be compared only on the
  same amount, mix, month and forecast — per the team's transcription of Directive 451,
  not checked against the directive; the forecasts are invented for teaching):
  1. Title.
  2. The three measures of one offer (bank א׳, basket 3): the expected total rate, the
     total expected payments, the highest expected payment.
  3. The expected total rate is lesson 3.10's actual cost of credit: the monthly IRR
     compounded to a year.
  4. The four things that must be the same: amount, mix, month, forecast.
  5. Break one at a time: bank א׳'s rate and who is lowest change (a different forecast
     turns the lowest into the highest; a smaller amount lowers the total, not the price).
  6. An up-front fee raises the expected total rate; which charges count is open.
  7. Takeaway: check the basis first.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 5.3 · מדדי ההשוואה לפי הוראה 451</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
        <script type="module">
      const data = await (await fetch("/data/lessons/5-3.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      // Money with agorot when there are any: "1,493.74", "2,400".
      const num = (v) => nf2.format(Number(v)).replace(/\.00$/, "");
      const shek = (v) => `${num(v)} ₪`;
      // A count, a rate or a factor as written in the data, without trailing zeros: "0.50" → "0.5".
      const pl = (v) => String(v).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      const dm = (iso) => new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "long" }).format(new Date(`${iso}T12:00:00Z`));

      const bankIds = ["a", "b", "c"], bankNames = { a: "בנק א׳", b: "בנק ב׳", c: "בנק ג׳" };
      const g = (id) => fact(id);
      const V = {
        loan: num(g("explain.loan")),
        years: String(g("explain.years")),
        aRate: Number(g("base.a.rate")).toFixed(2), aTotal: num(g("base.a.total")), aHigh: num(g("base.a.highest")), aFirst: num(g("base.a.first")),
        irr: pl(g("base.a.irr")), rate4: pl(g("base.a.rate4")),
        fcRate: Number(g("fc.a.rate")).toFixed(2), moRate: Number(g("mo.a.rate")).toFixed(2), amTotal: num(g("am.a.total")), amRate: Number(g("am.a.rate")).toFixed(2), mxRate: Number(g("mx.a.rate")).toFixed(2),
        fee: num(g("fee.amount")), cRate: Number(g("base.c.rate")).toFixed(2), cFeeRate: Number(g("fee.c.rate")).toFixed(2),
      };
      const lowestBase = g("base.lowest_rate");
      const lowFc = g("fc.lowest_rate");

      // Timeline (seconds). Each scene owns a window; render(t) draws whatever is on screen at t.
      const S = { title: [0, 10], three: [10, 56], year: [56, 84], four: [84, 128], broke: [128, 182], fee: [182, 204], end: [204, 216] };
      window.duration = 216;
      window.cues = [
        [1, 5, "שלושה מדדים, ארבעה תנאים"],
        [5, 9.5, "מה מודדים, ומתי מותר להשוות."],
        [11, 18, `סל אחיד 3 אצל בנק א׳: ${V.loan} ₪, ${V.years} שנה.`],
        [18, 26, `ריבית כוללת חזויה: ${V.aRate}% לשנה.`],
        [26, 34, `סך תשלומים חזוי: ${V.aTotal} ₪.`],
        [34, 42, `החזר מרבי חזוי: ${V.aHigh} ₪, בחודש ${g("base.a.highest_month")}.`],
        [42, 55, "כל מספר עונה על שאלה אחרת. אף אחד לא קובע לבדו."],
        [57, 64, "הריבית הכוללת היא העלות הממשית של האשראי."],
        [64, 72, `ריבית חודשית אחת, ${V.irr}%, מסבירה את כל התשלומים.`],
        [72, 83, `בחזקת 12 היא ${V.rate4}% לשנה.`],
        [85, 92, "מתי מותר להשוות הצעות? כשארבעה דברים זהים."],
        [92, 101, "הסכום: אותה הלוואה."],
        [101, 110, "התמהיל: אותם מסלולים, חלוקה ותקופות."],
        [110, 119, "החודש: מחשבים כאילו ההלוואה ניתנה בתחילתו."],
        [119, 127, "התחזית: אותה תחזית לכל ההצעות."],
        [129, 137, "נשבור תנאי אחד, ונראה מה קורה לבנק א׳."],
        [137, 146, `תחזית אחרת: מ־${V.aRate}% ל־${V.fcRate}%, בלי שינוי בריביות.`],
        [146, 154, "בנק א׳ הפך מנמוך לגבוה, ולא בגלל המחיר."],
        [154, 163, `סכום קטן יותר: סך התשלומים ${V.amTotal} ₪, והריבית ${V.amRate}%.`],
        [163, 172, `חודש אחר: ${V.moRate}%. תמהיל אחר: ${V.mxRate}%.`],
        [172, 181, "בכל שורה המספר נכון, וההשוואה לא."],
        [183, 191, `בנק ג׳ גובה עמלה של ${V.fee} ₪ ביום ההעמדה.`],
        [191, 198, `הריבית הכוללת שלו עולה מ־${V.cRate}% ל־${V.cFeeRate}%.`],
        [198, 203, "אילו עמלות נכנסות לחישוב: שאלה משפטית פתוחה."],
        [205, 210, "קודם בודקים שהבסיס זהה: סכום, תמהיל, חודש, תחזית."],
        [210, 215, "ורק אז ההפרש הוא של הבנקים."],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, s, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6));
      // Visible only between two moments of a scene.
      const during = (t, sc, s, e, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6), clamp((sc[0] + e - t) / 0.6));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: anchor "start" puts its right edge at x. LTR runs (numbers) take ltr: true.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);
      // An equation, left to right. Parts are strings, or [base, exponent] pairs.
      function eqn(x, y, parts, size, opts = {}) {
        const e = el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 600, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: "ltr", "unicode-bidi": "bidi-override" });
        const ns = "http://www.w3.org/2000/svg";
        for (const p of typeof parts === "string" ? [parts] : parts) {
          if (typeof p === "string") {
            const s = document.createElementNS(ns, "tspan");
            s.textContent = p;
            e.appendChild(s);
          } else {
            const b = document.createElementNS(ns, "tspan");
            b.textContent = p[0];
            e.appendChild(b);
            const sup = document.createElementNS(ns, "tspan");
            sup.setAttribute("dy", String(-size * 0.42));
            sup.setAttribute("font-size", String(Math.round(size * 0.62)));
            sup.textContent = p[1];
            e.appendChild(sup);
            const back = document.createElementNS(ns, "tspan");
            back.setAttribute("dy", String(size * 0.42));
            back.textContent = " ";
            e.appendChild(back);
          }
        }
        return e;
      }
      const box = (x, y, w, h, o, fill = C.n0) => el("rect", { x, y, width: w, height: h, rx: 14, fill, stroke: fill === C.n0 ? C.n200 : "none", opacity: o });

      const four = ["הסכום", "התמהיל", "החודש", "התחזית"];
      window.render = (t) => {
        svg.replaceChildren();
        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 280, "שלושה מדדים,", 72, { w: 700, o });
          txt(640, 360, "ארבעה תנאים", 72, { w: 700, o });
          txt(640, 420, "ריבית כוללת חזויה · סך תשלומים חזוי · החזר מרבי חזוי", 26, { fill: C.n600, o: after(t, S.title, 4, o) });
        }
        // Scene 2 — three numbers
        if (inScene(t, S.three)) {
          const o = vis(t, S.three);
          const at = (s) => after(t, S.three, s, o);
          txt(640, 126, `בנק א׳ · סל 3 · ${V.loan} ₪ · ${V.years} שנה`, 34, { w: 700, o });
          const cards = [
            { x: 800, label: "ריבית כוללת חזויה", v: `${V.aRate}%`, note: "אחוז לשנה", from: 1 },
            { x: 440, label: "סך תשלומים חזוי", v: `${V.aTotal} ₪`, note: "סכום כל התשלומים", from: 8, small: true },
            { x: 80, label: "החזר מרבי חזוי", v: `${V.aHigh} ₪`, note: `חודש ${g("base.a.highest_month")}, לפי התחזית`, from: 16, small: true },
          ];
          for (const c of cards) {
            const oc = at(c.from);
            box(c.x, 180, 340, 190, oc);
            txt(c.x + 170, 224, c.label, 22, { fill: C.n600, o: oc });
            txt(c.x + 170, 296, c.v, c.small ? 34 : 50, { w: 700, o: oc, ltr: true });
            txt(c.x + 170, 340, c.note, 17, { fill: C.n600, o: oc });
          }
          const ob = at(26);
          box(180, 410, 920, 110, ob * 0.6, C.mint);
          txt(640, 454, "שלוש שאלות: כמה עולה כל שקל? כמה שקלים בסך הכול?", 24, { w: 600, o: ob });
          txt(640, 494, "וכמה כבד החודש הכבד ביותר?", 24, { w: 600, o: ob });
        }
        // Scene 3 — one rate behind all the payments
        if (inScene(t, S.year)) {
          const o = vis(t, S.year);
          const at = (s) => after(t, S.year, s, o);
          txt(640, 130, "העלות הממשית של האשראי", 42, { w: 700, o });
          box(190, 190, 900, 130, at(1));
          txt(640, 240, "ה־IRR של כל התשלומים החזויים, מול מה שקיבלתם בפועל", 24, { w: 600, o: at(1) });
          txt(640, 284, "(ההלוואה פחות מה שנגבה ביום ההעמדה)", 19, { fill: C.n600, o: at(1) });
          box(250, 350, 360, 120, at(8));
          txt(430, 392, "לחודש", 20, { fill: C.n600, o: at(8) });
          txt(430, 444, `${V.irr}%`, 44, { w: 700, o: at(8), ltr: true });
          box(670, 350, 360, 120, at(15));
          txt(850, 392, "לשנה, בחזקת 12", 20, { fill: C.n600, o: at(15) });
          txt(850, 444, `${V.rate4}%`, 44, { w: 700, fill: C.teal, o: at(15), ltr: true });
          txt(640, 520, "בקורס: לפי תעתיק של הצוות מהוראה 451, לא נבדק מול ההוראה", 17, { fill: C.n600, o: at(18) });
        }
        // Scene 4 — four conditions
        if (inScene(t, S.four)) {
          const o = vis(t, S.four);
          const at = (s) => after(t, S.four, s, o);
          txt(640, 130, "ארבעה דברים שחייבים להיות זהים", 42, { w: 700, o });
          const notes = ["אותה הלוואה", "אותם מסלולים, חלוקה ותקופות", "אותו חודש חישוב", "אותה תחזית"];
          const from = [7, 16, 25, 33];
          four.forEach((s, i) => {
            const x = 1070 - i * 270;
            const op = at(from[i]);
            box(x - 120, 210, 240, 220, op, i === 3 ? C.mint : C.n0);
            txt(x, 270, String(i + 1), 40, { w: 700, fill: C.teal, o: op });
            txt(x, 330, s, 32, { w: 700, o: op });
            txt(x, 382, notes[i], 17, { fill: C.n700, o: op });
          });
          txt(640, 500, "הסלים האחידים מסדרים אחד מהם: התמהיל", 22, { fill: C.teal, w: 700, o: at(36) });
        }
        // Scene 5 — break one at a time
        if (inScene(t, S.broke)) {
          const o = vis(t, S.broke);
          const at = (s) => after(t, S.broke, s, o);
          txt(640, 118, "שוברים תנאי אחד, ובנק א׳ משתנה", 38, { w: 700, o });
          box(160, 160, 960, 360, at(1));
          const cols = [{ x: 1090, label: "מה שונה" }, { x: 640, label: "ריבית של א׳" }, { x: 400, label: "נמוך בריבית" }];
          for (const c of cols) txt(c.x, 200, c.label, 18, { anchor: "start", fill: C.n600, w: 600, o: at(1) });
          const rows = [
            { y: 252, label: "אותו בסיס", rate: V.aRate, low: lowestBase.join(" ו"), from: 2 },
            { y: 308, label: "תחזית אחרת", rate: V.fcRate, low: lowFc.join(" ו"), from: 10 },
            { y: 364, label: "סכום אחר", rate: V.amRate, low: g("am.lowest_rate").join(" ו"), from: 21, note: `סך תשלומים: ${V.amTotal} ₪` },
            { y: 420, label: "חודש אחר", rate: V.moRate, low: g("mo.lowest_rate").join(" ו"), from: 30 },
            { y: 476, label: "תמהיל אחר", rate: V.mxRate, low: g("mx.lowest_rate").join(" ו"), from: 37 },
          ];
          for (const r of rows) {
            const or = at(r.from);
            txt(1090, r.y, r.label, 24, { anchor: "start", w: 600, o: or });
            txt(640, r.y, `${r.rate}%`, 28, { anchor: "start", w: 700, fill: C.teal, o: or, ltr: true });
            txt(400, r.y, r.low, 22, { anchor: "start", o: or });
          }
          txt(640, 560, "המספר נכון. ההשוואה לא", 22, { fill: C.n700, w: 700, o: at(44) });
        }
        // Scene 6 — a fee on the day of the loan
        if (inScene(t, S.fee)) {
          const o = vis(t, S.fee);
          const at = (s) => after(t, S.fee, s, o);
          txt(640, 140, `עמלה של ${V.fee} ₪ ביום ההעמדה`, 40, { w: 700, o });
          box(240, 200, 380, 150, at(1));
          txt(430, 244, "בלי עמלה", 22, { fill: C.n600, o: at(1) });
          txt(430, 314, `${V.cRate}%`, 52, { w: 700, o: at(1), ltr: true });
          box(660, 200, 380, 150, at(7));
          txt(850, 244, "עם עמלה", 22, { fill: C.n600, o: at(7) });
          txt(850, 314, `${V.cFeeRate}%`, 52, { w: 700, fill: C.teal, o: at(7), ltr: true });
          txt(640, 410, "אותם תשלומים, פחות כסף שהגיע אליכם", 24, { fill: C.n700, o: at(10) });
          txt(640, 450, "אילו עמלות נכנסות: שאלה משפטית פתוחה", 20, { fill: C.n600, o: at(15) });
        }
        // Scene 7 — takeaway
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 250, "קודם הבסיס:", 44, { w: 700, o });
          txt(640, 320, "סכום · תמהיל · חודש · תחזית", 44, { w: 700, fill: C.teal, o: after(t, S.end, 2, o) });
          txt(640, 400, "ורק אז ההפרש הוא של הבנקים", 38, { w: 600, fill: C.n700, o: after(t, S.end, 5, o) });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
