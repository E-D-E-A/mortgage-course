<!doctype html>
<!--
  Video scene for lesson 8.12 - when a probability may be attached. Pure function of t; numbers from data/lessons/8-12.json.
  Script: (1) title; (2) four assumptions, four answers; (3) the simulation's error versus the assumptions' error; (4) three conditions for 'the chance is';
  (5) sample size: 75% of 20, 200, 2000 (synthetic); (6) how to word it; (7) takeaway. ILLUSTRATION: invented assumptions, synthetic counts.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      .tag { position: absolute; top: 36px; left: 40px; font-size: 16px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 8.12 · מתי מותר לייחס הסתברות</div>
      <div class="tag">נתונים סינתטיים · להדגמה</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/8-12.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const num = (v) => nf2.format(Number(v)).replace(/\.00$/, "");
      const shek = (v) => `${num(v)} ₪`;
      const pl = (v) => String(v).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      // LTR isolate for a number (the number only; a sign stays outside).
      const lr = (s) => `\u2066${s}\u2069`;

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, s, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6));
      const grow = (t, sc, s, d) => clamp((t - sc[0] - s) / d);

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)", n400: "var(--mogi-n400)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: anchor "start" puts its right edge at x. LTR runs (numbers) take ltr: true.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);
      const box = (x, y, w, h, o, fill = C.n0) => el("rect", { x, y, width: w, height: h, rx: 14, fill, stroke: fill === C.n0 ? C.n200 : "none", opacity: o });
      const bar = (x, y, w, h, fill, o = 1) => el("rect", { x, y, width: Math.max(0, w), height: h, rx: 6, fill, opacity: o });

      const MODELS = [["calm", "רגוע"], ["normal", "רגיל"], ["wild", "סוער"], ["up", "נוטה למעלה"]];
      const pp = (id) => Number(fact(`m.${id}.p_pct`));
      const S = { title: [0, 8], models: [8, 52], se: [52, 78], cond: [78, 112], size: [112, 142], say: [142, 168], end: [168, 180] };
      window.duration = 180;
      window.cues = [
        [1, 5, "מתי מותר לומר ״הסיכוי הוא״?"],
        [5, 7.5, "הנחות מומצאות, נתונים בדויים."],
        [9, 17, `אותה שאלה: יעבור התשלום ${shek(fact("t.threshold"))}?`],
        [17, 26, "אותו מסלול, אלף עתידים. ארבע הנחות."],
        [26, 36, `רגוע: ${fact("m.calm.p_pct")}%. רגיל: ${fact("m.normal.p_pct")}%.`],
        [36, 46, `סוער: ${fact("m.wild.p_pct")}%. נוטה למעלה: ${fact("m.up.p_pct")}%.`],
        [46, 51, "אותה סימולציה, תשובות רחוקות."],
        [53, 61, "הטעות של ההגרלה: נקודת אחוז או שתיים."],
        [61, 70, "ההבדל בין ההנחות: עשרות נקודות."],
        [70, 77, "עוד הגרלות לא מתקנות הנחה."],
        [79, 87, "שלושה תנאים ל״הסיכוי הוא״."],
        [87, 95, "תהליך שחוזר, עם הרבה מקרים דומים."],
        [95, 103, "נתונים שנמדדו, לא הנחות."],
        [103, 111, "עתיד שדומה לעבר."],
        [113, 121, "גם שכיחות אמיתית יש לה טעות."],
        [121, 131, `75%: ${"±"}${fact("apr.small").se_pct} ב־20 מקרים.`],
        [131, 141, `${"±"}${fact("apr.large").se_pct} ב־200, ${"±"}${fact("apr.huge").se_pct} ב־2,000.`],
        [143, 152, "נתיב ריבית הוא אירוע חד־פעמי."],
        [152, 160, "אז אומרים: אם הפריים נע כך, אז כך."],
        [160, 167, "ואת הטווח בין ההנחות."],
        [169, 175, "סימולציה לא הופכת הנחה לעובדה."],
        [175, 179, "זו הנחה, לא עובדה."],
      ];

      window.render = (t) => {
        svg.replaceChildren();
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 280, "מתי מותר", 84, { w: 700, o });
          txt(640, 360, "לומר ״הסיכוי הוא״", 52, { w: 700, o: after(t, S.title, 1, o) });
          txt(640, 430, "נתונים סינתטיים · הנחות מומצאות להדגמה", 26, { fill: C.n600, o: after(t, S.title, 4, o) });
        }
        if (inScene(t, S.models)) {
          const o = vis(t, S.models);
          txt(640, 124, `אחוז העתידים שעברו ${lr(shek(fact("t.threshold")))}`, 38, { w: 700, o });
          MODELS.forEach(([id, label], k) => {
            const y = 190 + k * 80;
            const g = grow(t, S.models, 9 + k * 9, 3);
            txt(1230, y + 38, label, 28, { anchor: "start", w: 700, o });
            const w = (pp(id) / 100) * 800 * g;
            bar(1000 - w, y, w, 56, id === "normal" ? C.teal : C.tq2, o);
            if (g > 0.95) txt(1000 - w - 14, y + 40, `${fact(`m.${id}.p_pct`)}%`, 28, { anchor: "end", w: 700, o, ltr: true });
          });
        }
        if (inScene(t, S.se)) {
          const o = vis(t, S.se);
          txt(640, 124, "שתי טעויות שונות", 40, { w: 700, o });
          const o1 = after(t, S.se, 1, o);
          box(700, 200, 440, 190, o1);
          txt(1110, 250, "טעות ההגרלה", 28, { anchor: "start", w: 700, o: o1 });
          txt(920, 340, `±${lr(fact("m.normal.se_pct"))} נקודות`, 44, { w: 700, fill: C.teal, o: o1 });
          const o2 = after(t, S.se, 9, o);
          box(140, 200, 440, 190, o2);
          txt(550, 250, "טעות ההנחות", 28, { anchor: "start", w: 700, o: o2 });
          txt(360, 340, `${lr(fact("m.calm.p_pct") + "%")} עד ${lr(fact("m.up.p_pct") + "%")}`, 44, { w: 700, fill: C.navy, o: o2 });
          txt(640, 480, "עוד הגרלות מקטינות רק את הראשונה", 28, { fill: C.n700, o: after(t, S.se, 16, o) });
        }
        if (inScene(t, S.cond)) {
          const o = vis(t, S.cond);
          txt(640, 124, "מתי מותר: שלושה תנאים", 40, { w: 700, o });
          [["1", "תהליך שחוזר", "הרבה מקרים דומים"], ["2", "נתונים שנמדדו", "ספירה ולא הנחה"], ["3", "עתיד דומה לעבר", "המשטר לא השתנה"]].forEach(([n_, a, b], k) => {
            const y = 200 + k * 100;
            const oc = after(t, S.cond, 1 + k * 8, o);
            box(240, y, 800, 80, oc);
            txt(1000, y + 52, n_, 40, { w: 700, fill: C.teal, o: oc, anchor: "start" });
            txt(940, y + 52, a, 32, { w: 700, o: oc, anchor: "start" });
            txt(420, y + 50, b, 24, { fill: C.n600, o: oc, anchor: "start" });
          });
        }
        if (inScene(t, S.size)) {
          const o = vis(t, S.size);
          txt(640, 124, "75% אושרו: כמה מקרים?", 40, { w: 700, o });
          [["20", "apr.small"], ["200", "apr.large"], ["2,000", "apr.huge"]].forEach(([n_, id], k) => {
            const y = 210 + k * 100;
            const oc = after(t, S.size, 2 + k * 8, o);
            txt(1100, y + 40, `${lr(n_)} מקרים`, 32, { anchor: "start", w: 700, o: oc });
            txt(600, y + 42, `${fact(id).p_pct}% ± ${fact(id).se_pct}`, 40, { w: 700, fill: C.teal, o: oc, ltr: true });
          });
          txt(640, 530, "נתוני האישורים בדויים · אין היום נתוני אישורים אמיתיים בקורס", 22, { fill: C.n600, o: after(t, S.size, 18, o) });
        }
        if (inScene(t, S.say)) {
          const o = vis(t, S.say);
          txt(640, 124, "איך מנסחים ללקוח", 40, { w: 700, o });
          const o1 = after(t, S.say, 1, o);
          txt(640, 250, "״אם הפריים נע כך, אז כך.״", 40, { w: 700, fill: C.teal, o: o1 });
          txt(640, 330, "ולצדו: מה קורה בהנחות אחרות", 32, { o: after(t, S.say, 8, o) });
          txt(640, 430, `${lr(fact("m.calm.p_pct") + "%")} עד ${lr(fact("m.up.p_pct") + "%")}, ולא מספר אחד`, 36, { w: 700, fill: C.navy, o: after(t, S.say, 16, o) });
        }
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 290, "סימולציה לא הופכת הנחה לעובדה", 52, { w: 700, o });
          txt(640, 370, "זו הנחה, לא עובדה", 38, { fill: C.teal, o: after(t, S.end, 2, o) });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
