<!doctype html>
<!--
  Video scene for lesson 8.8 - weights and 'optimal'. Rendered by scripts/render-video.mjs: window.render(t) is a pure function of t;
  every number comes from data/lessons/8-8.json. Script: (1) title; (2) the three winners of lesson 5.6; (3) normalising one goal;
  (4) a weighted score for three mixes; (5) other weights, other winners; (6) dropping a loser changes the winner; (7) feasible vs optimal.
  ILLUSTRATION: weights are for illustration, not a Mogi decision and not a bank's policy.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      .tag { position: absolute; top: 36px; left: 40px; font-size: 16px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 8.8 · משקולות ופתרון מיטבי</div>
      <div class="tag">נתונים סינתטיים · להדגמה</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/8-8.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const num = (v) => nf2.format(Number(v)).replace(/\.00$/, "");
      const shek = (v) => `${num(v)} ₪`;
      const pl = (v) => String(v).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      // LTR isolate for a number (the number only; a sign stays outside).
      const lr = (s) => `\u2066${s}\u2069`;

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, s, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6));
      const grow = (t, sc, s, d) => clamp((t - sc[0] - s) / d);

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)", n400: "var(--mogi-n400)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: anchor "start" puts its right edge at x. LTR runs (numbers) take ltr: true.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);
      const box = (x, y, w, h, o, fill = C.n0) => el("rect", { x, y, width: w, height: h, rx: 14, fill, stroke: fill === C.n0 ? C.n200 : "none", opacity: o });
      const bar = (x, y, w, h, fill, o = 1) => el("rect", { x, y, width: Math.max(0, w), height: h, rx: 6, fill, opacity: o });

      const NAME = { initial: "הראשוני", half: "חצי־חצי", fixed: "קבועה בלבד", linked: "צמוד", short: "25 שנה", linked_heavy: "צמוד, בעיקר משתנה", fixed_20: "קבועה ל־20 שנה" };
      const T = Object.fromEntries(fact("cand.table").map((r) => [r.id, r]));
      const tbl = (id) => Object.fromEntries(fact(id).map((r) => [r.id, r]));
      const win = (id) => fact(id).find((r) => r.rank === 1).id;
      const three3 = tbl("tbl.three");
      const THREE = ["half", "linked", "short"];
      const normFirst = fact("norm.first");
      const nDistinct = fact("lat.10").n_distinct;

      const S = { title: [0, 8], pull: [8, 38], norm: [38, 80], score: [80, 118], sets: [118, 148], drop: [148, 178], end: [178, 192] };
      window.duration = 192;
      window.cues = [
        [1, 5, "משקולות: איך מחברים כמה יעדים למספר אחד."],
        [5, 7.5, "זה המחשה, לא החלטה של Mogi."],
        [9, 16, "בשיעור 5.6 כל יעד ניצח תמהיל אחר."],
        [16, 24, "אילו שלושה? לפי מי שמקבל משקל גדול."],
        [24, 31, "החזר ראשון: צמוד. סך תשלומים: 25 שנה."],
        [31, 37, "יציבות: קבועה בלבד."],
        [39, 47, "אי אפשר לחבר שקלים לחודש עם שקלים לכל ההלוואה."],
        [47, 56, "לכן מנרמלים: הטוב בקבוצה מקבל 0, הגרוע מקבל 1."],
        [56, 66, `החזר ראשון: ${shek(T.linked.first)} מול ${shek(T.short.first)}.`],
        [66, 79, `״חצי־חצי״ באמצע, בערך ${pl(normFirst[0])}.`],
        [81, 89, "משקולות: כמה כל יעד חשוב. כאן 40, 30, 30."],
        [89, 98, "ציון = ממוצע משוקלל של שלושת הערכים המנורמלים."],
        [98, 108, `״חצי־חצי״ מנצח, בציון ${pl(three3.half.score)}.`],
        [108, 117, "הוא לא ניצח אף יעד לבד, אבל בינוני בכולם."],
        [119, 127, "משקולות אחרות, מנצח אחר."],
        [127, 138, "70 להחזר ראשון: צמוד. 70 לסך: 25 שנה."],
        [138, 147, "70 ליציבות: קבועה בלבד."],
        [149, 157, "מורידים תמהיל שלא ניצח: ״צמוד״."],
        [157, 168, "הסולם של הנרמול משתנה."],
        [168, 177, "והמנצח במשקולות 40, 30, 30 מתחלף."],
        [179, 185, "אפשרי: עובר את האילוצים. מיטבי: הציון הטוב בקבוצה."],
        [185, 191, "תמיד ביחס למשקולות ולמי שנבדק."],
      ];

      window.render = (t) => {
        svg.replaceChildren();
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 280, "משקולות", 84, { w: 700, o });
          txt(640, 360, "ופתרון מיטבי", 54, { w: 700, o: after(t, S.title, 1, o) });
          txt(640, 430, "המשקולות להדגמה: לא החלטה של Mogi ולא מדיניות של בנק", 26, { fill: C.n600, o: after(t, S.title, 4, o) });
        }
        if (inScene(t, S.pull)) {
          const o = vis(t, S.pull);
          txt(640, 128, "שלושה יעדים, שלושה מנצחים", 40, { w: 700, o });
          const cols = [
            { x: 880, head: "החזר ראשון", id: win("tbl.pay"), val: shek(T[win("tbl.pay")].first), from: 14 },
            { x: 520, head: "סך תשלומים", id: win("tbl.tot"), val: shek(T[win("tbl.tot")].total), from: 20 },
            { x: 160, head: "חשיפה", id: win("tbl.stab"), val: shek(T[win("tbl.stab")].rise), from: 26 },
          ];
          for (const c of cols) {
            const oc = after(t, S.pull, c.from - 8, o);
            box(c.x, 190, 320, 220, oc);
            txt(c.x + 300, 238, c.head, 26, { anchor: "start", w: 700, o: oc, fill: C.n600 });
            txt(c.x + 160, 312, NAME[c.id], 40, { w: 700, o: oc });
            txt(c.x + 160, 372, c.val, 28, { o: oc, ltr: true, fill: C.teal, w: 700 });
          }
          txt(640, 480, "אין תמהיל אחד שמנצח בכולם. אז איך בוחרים?", 28, { fill: C.n700, o: after(t, S.pull, 22, o) });
        }
        if (inScene(t, S.norm)) {
          const o = vis(t, S.norm);
          txt(640, 124, "נרמול: כל יעד לסקאלה בין 0 ל־1", 38, { w: 700, o });
          txt(640, 166, "החזר ראשון, שלושה תמהילים", 24, { fill: C.n600, o });
          THREE.forEach((id, k) => {
            const y = 215 + k * 82;
            txt(1230, y + 36, NAME[id], 26, { anchor: "start", w: 700, o });
            const v = Number(T[id].first);
            const w = ((v - 6000) / 3200) * 620 * grow(t, S.norm, 2 + k * 1.3, 2);
            bar(1000 - w, y, w, 52, id === "linked" ? C.teal : C.tq2, o);
            if (grow(t, S.norm, 2 + k * 1.3, 2) > 0.95) txt(1000 - w - 14, y + 38, shek(T[id].first), 24, { anchor: "end", w: 700, o, ltr: true });
          });
          const o2 = after(t, S.norm, 20, o);
          box(100, 470, 1080, 70, o2 * 0.9, C.mint);
          const nrm = [["half", normFirst[0]], ["linked", normFirst[1]], ["short", normFirst[2]]];
          txt(1140, 515, "אחרי נרמול:", 24, { anchor: "start", w: 700, o: o2 });
          nrm.forEach(([id, v], k) => txt(890 - k * 280, 515, `${NAME[id]} ${lr(pl(v))}`, 26, { w: 700, o: after(t, S.norm, 22 + k * 3, o) }));
        }
        if (inScene(t, S.score)) {
          const o = vis(t, S.score);
          txt(640, 124, "משקולות 40 · 30 · 30", 40, { w: 700, o });
          txt(640, 166, "ציון נמוך מנצח", 24, { fill: C.n600, o });
          THREE.forEach((id, k) => {
            const y = 215 + k * 92;
            const sc = Number(three3[id].score);
            txt(1230, y + 40, NAME[id], 28, { anchor: "start", w: 700, o });
            const w = sc * 900 * grow(t, S.score, 4 + k * 2, 2.5);
            const best = three3[id].rank === 1;
            bar(1000 - w, y, w, 56, best ? C.teal : C.n300, o);
            if (grow(t, S.score, 4 + k * 2, 2.5) > 0.95) txt(1000 - w - 14, y + 42, three3[id].score, 26, { anchor: "end", w: 700, o, ltr: true });
          });
          txt(640, 530, "המנצח הוא מי שהכי מאוזן, לא מי שהכי טוב ביעד אחד", 26, { fill: C.n700, o: after(t, S.score, 24, o) });
        }
        if (inScene(t, S.sets)) {
          const o = vis(t, S.sets);
          txt(640, 124, "משקולות אחרות, מנצח אחר", 40, { w: 700, o });
          const sets = [["70 · 15 · 15", "tbl.pay", "החזר ראשון"], ["15 · 70 · 15", "tbl.tot", "סך תשלומים"], ["15 · 15 · 70", "tbl.stab", "יציבות"]];
          sets.forEach(([w, id, label], k) => {
            const y = 190 + k * 110;
            const oc = after(t, S.sets, 2 + k * 9, o);
            box(160, y, 960, 90, oc);
            txt(1090, y + 40, label, 24, { anchor: "start", fill: C.n600, o: oc });
            txt(1090, y + 76, w, 28, { anchor: "start", w: 700, o: oc, ltr: true });
            txt(600, y + 58, `מנצח: ${NAME[win(id)]}`, 34, { anchor: "start", w: 700, fill: C.teal, o: oc });
          });
          txt(640, 560, `על כל שילוב של 10%: ${nDistinct} מנצחים שונים`, 24, { fill: C.n700, o: after(t, S.sets, 22, o) });
        }
        if (inScene(t, S.drop)) {
          const o = vis(t, S.drop);
          txt(640, 124, "גם מי שלא ניצח משנה את התוצאה", 38, { w: 700, o });
          const b = win("tbl.bal"), d = win("tbl.bal_drop");
          const o1 = after(t, S.drop, 1, o);
          box(700, 200, 440, 150, o1);
          txt(1110, 248, "חמישה תמהילים", 24, { anchor: "start", fill: C.n600, o: o1 });
          txt(920, 318, NAME[b], 40, { w: 700, fill: C.teal, o: o1 });
          const o2 = after(t, S.drop, 14, o);
          box(140, 200, 440, 150, o2);
          txt(550, 248, "בלי ״צמוד״", 24, { anchor: "start", fill: C.n600, o: o2 });
          txt(360, 318, NAME[d], 40, { w: 700, fill: C.teal, o: o2 });
          txt(640, 290, "←", 56, { fill: C.n600, o: o2 });
          txt(640, 450, "הנרמול משתמש בגדול ובקטן בקבוצה", 26, { fill: C.n700, o: after(t, S.drop, 20, o) });
        }
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          const rows = [{ y: 270, a: "אפשרי", b: "עובר את האילוצים", from: 0.5 }, { y: 350, a: "מיטבי", b: "הציון הטוב בין מי שנבדק", from: 3 }, { y: 430, a: "תמיד", b: "ביחס למשקולות ולקבוצה", from: 5 }];
          for (const r of rows) {
            const or = after(t, S.end, r.from, o);
            txt(1060, r.y, r.a, 40, { anchor: "start", w: 700, o: or });
            txt(620, r.y, r.b, 32, { anchor: "start", fill: C.teal, o: or });
          }
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
