<!doctype html>
<!--
  Video scene for lesson 8.4 (stage 8). Generated from a scene spec: window.render(t) is a pure function of time; every number is read from /data/lessons/8-4.json.
  Script and labelling: one idea: an expectation is a long-run average that need not be a possible outcome, and it depends on the probabilities assumed. General maths; the die is a toy, not a forecast of the rate.
-->


<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 8.4 · הסתברות ותוחלת</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
                
    <script type="module">
      const SPEC = {"kicker": "שיעור 8.4 · הסתברות ותוחלת", "script": "one idea: an expectation is a long-run average that need not be a possible outcome, and it depends on the probabilities assumed. General maths; the die is a toy, not a forecast of the rate.", "duration": 130, "scenes": [{"t": [0, 9], "type": "title", "title": "הסתברות ותוחלת", "sub": "ממוצע לטווח ארוך", "note": "מתמטיקה כללית · הקובייה היא משל, לא תחזית"}, {"t": [9, 38], "type": "cards", "title": "קובייה הוגנת", "cards": [{"head": "להטיל 6", "big": "{q:one.p}", "note": "1 מתוך 6", "ltr": true}, {"head": "5 או 6", "big": "{q:one.p_ge5}", "note": "2 מתוך 6", "ltr": true}, {"head": "תוחלת", "big": "{p:one.exp}", "note": "אין פאה כזו", "hot": true, "ltr": true}], "foot": "תוחלת = כל תוצאה כפול ההסתברות שלה, ומחברים"}, {"t": [38, 80], "type": "bars", "title": "ההחזר אחרי הטלה: חוב {m:t.balance} ₪", "bars": [{"label": "פאה 1 · {l:−1}", "v": "t.pay1", "show": "{m:t.pay1} ₪"}, {"label": "פאה 2 · {l:−0.5}", "v": "t.pay2", "show": "{m:t.pay2} ₪"}, {"label": "פאה 3 · {l:0}", "v": "t.pay3", "show": "{m:t.pay3} ₪"}, {"label": "פאה 4 · {l:+0.5}", "v": "t.pay4", "show": "{m:t.pay4} ₪"}, {"label": "פאה 5 · {l:+1}", "v": "t.pay5", "show": "{m:t.pay5} ₪"}, {"label": "פאה 6 · {l:+1.5}", "v": "t.pay6", "show": "{m:t.pay6} ₪", "hot": true}], "foot": "כל פאה היא שינוי בריבית, וכל שינוי הוא החזר"}, {"t": [80, 112], "type": "cards", "title": "ההחזר המצופה", "cards": [{"head": "קובייה נמוכה", "big": "{m:t.exp_low} ₪", "note": "מוטה לריביות נמוכות"}, {"head": "הוגנת", "big": "{m:t.exp_fair} ₪", "note": "גבוה מהיום ב־{m:t.exp_minus_now} ₪", "hot": true}, {"head": "קובייה גבוהה", "big": "{m:t.exp_high} ₪", "note": "מוטה לריביות גבוהות"}], "foot": "הסתברויות אחרות, תוחלת אחרת"}, {"t": [112, 130], "type": "lines", "title": "קובייה היא לא שוק", "lines": ["בקובייה ההסתברויות ידועות מהמבנה", "בשוק כל הסתברות היא הנחה", {"text": "זו הנחה, לא עובדה", "big": true}]}], "cues": [[1, 4.5, "הסתברות ותוחלת"], [4.5, 8.5, "ממוצע לטווח ארוך."], [10, 20, "קובייה הוגנת: לכל פאה {q:one.p}."], [20, 29, "5 או 6: שניים מתוך שישה."], [29, 37, "התוחלת {p:one.exp}: אין פאה כזו."], [39, 52, "עכשיו כל פאה מזיזה את הריבית בעדכון."], [52, 66, "וכל שינוי הוא החזר חודשי אחר."], [66, 79, "מ־{m:t.pay1} ₪ עד {m:t.pay6} ₪."], [81, 93, "בקובייה הוגנת ההחזר המצופה {m:t.exp_fair} ₪."], [93, 103, "הוא גבוה מההחזר היום, ואינו אחד האפשריים."], [103, 111, "קובייה אחרת, הסתברויות אחרות, תוחלת אחרת."], [113, 122, "בקובייה ההסתברויות ידועות."], [122, 129, "בשוק זו הנחה, לא עובדה."]]};
      const data = await (await fetch("/data/lessons/8-4.json")).json();
      const fact = (id) => { const f = data.facts.find((x) => x.id === id); if (!f) throw new Error("no fact " + id); return f.value; };
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const num = (v) => nf2.format(Number(v)).replace(/\.00$/, "");
      const pl = (v) => String(v).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      const lr = (x) => `⁦${x}⁩`;
      // {m:id} money, {p:id} plain, {n:id} money without isolate marks (for widths), {l:text} a typed LTR run.
      const sub = (s) => String(s).replace(/\{([mplq]):([^}]+)\}/g, (_, k, id) => (k === "m" ? lr(num(fact(id))) : k === "p" ? lr(pl(fact(id))) : k === "q" ? lr(pl(fact(id)) + "%") : lr(id)));
      const val = (id) => Number(fact(id));
      window.duration = SPEC.duration;
      window.cues = SPEC.cues.map(([a, b, t]) => [a, b, sub(t)]);
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const vis = (t, sc, d = 0.6) => Math.min(clamp((t - sc[0]) / d), clamp((sc[1] - t) / d));
      const C = { navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)", n600: "var(--mogi-n600)", n700: "var(--mogi-n700)", teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)" };
      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text !== undefined) e.textContent = text; svg.appendChild(e); return e; };
      const txt = (x, y, s, size, o = {}) => el("text", { x, y, "font-size": size, "font-weight": o.w ?? 400, fill: o.fill ?? C.navy, "text-anchor": o.anchor ?? "middle", opacity: o.o ?? 1, direction: o.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);
      const box = (x, y, w, h, o, fill = C.n0) => el("rect", { x, y, width: w, height: h, rx: 14, fill, stroke: fill === C.n0 ? C.n200 : "none", opacity: o });
      const COL = { teal: C.teal, navy: C.navy, grey: C.n600 };
      const P = (v) => (v && v.map ? v.map(sub) : sub(v ?? ""));

      // Each item of a scene appears one after the other, spread over the scene.
      const appear = (t, sc, k, n, o) => { const span = Math.max(2, sc.t[1] - sc.t[0] - 4); const start = sc.t[0] + 1 + (span * k) / Math.max(1, n); return Math.min(o, clamp((t - start) / 0.6)); };

      const draw = {
        title(t, sc, o) {
          txt(640, 290, sub(sc.title), 70, { w: 700, o });
          txt(640, 370, sub(sc.sub ?? ""), 44, { w: 700, fill: C.teal, o: appear(t, sc, 1, 3, o) });
          if (sc.note) txt(640, 430, sub(sc.note), 22, { fill: C.n600, o: appear(t, sc, 2, 3, o) });
        },
        cards(t, sc, o) {
          txt(640, 118, sub(sc.title), 42, { w: 700, o });
          const n = sc.cards.length; const w = n > 3 ? 280 : 380; const gap = 30; const total = n * w + (n - 1) * gap; const x0 = 640 + total / 2 - w;
          sc.cards.forEach((c, k) => {
            const oc = appear(t, sc, k, n + (sc.foot ? 1 : 0), o); const x = x0 - k * (w + gap) + w / 2;
            box(x - w / 2, 170, w, 270, oc, c.hot ? C.mint : C.n0);
            txt(x, 220, sub(c.head), 28, { w: 700, fill: C.teal, o: oc });
            { const L = sub(c.big).length; txt(x, 315, sub(c.big), L > 14 ? 28 : L > 9 ? 36 : n > 3 ? 40 : 50, { w: 700, o: oc, ltr: !!c.ltr }); }
            if (c.note) txt(x, 360, sub(c.note), 22, { fill: C.n700, o: oc });
            if (c.sub) txt(x, 405, sub(c.sub), 20, { fill: C.n600, o: oc });
          });
          if (sc.foot) txt(640, 500, sub(sc.foot), 26, { w: 600, fill: C.n700, o: appear(t, sc, n, n + 1, o) });
        },
        chain(t, sc, o) {
          txt(640, 118, sub(sc.title), 42, { w: 700, o });
          const n = sc.boxes.length; const w = 250; const gap = (1100 - n * w) / Math.max(1, n - 1);
          sc.boxes.forEach((b, k) => {
            const oc = appear(t, sc, k, n + 1, o); const x = 1190 - w - k * (w + gap);
            box(x, 200, w, 170, oc);
            txt(x + w / 2, 245, sub(b.head), 22, { fill: C.n600, o: oc });
            { const L = sub(b.big).length; txt(x + w / 2, 315, sub(b.big), L > 16 ? 22 : L > 10 ? 28 : 36, { w: 700, o: oc, fill: b.hot ? C.teal : C.navy }); }
            if (k < n - 1 && sc.arrows) txt(x - gap / 2, 292, sub(sc.arrows[k] ?? "←"), 20, { fill: C.n600, o: oc });
          });
          if (sc.foot) txt(640, 470, sub(sc.foot), 26, { w: 600, fill: C.n700, o: appear(t, sc, n, n + 1, o) });
        },
        bars(t, sc, o) {
          txt(640, 118, sub(sc.title), 42, { w: 700, o });
          const max = Math.max(...sc.bars.map((b) => val(b.v))); const n = sc.bars.length; const rowH = Math.min(70, 330 / n);
          sc.bars.forEach((b, k) => {
            const oc = appear(t, sc, k, n + 1, o); const y = 175 + k * (rowH + 12); const wmax = 600;
            txt(1240, y + rowH * 0.65, sub(b.label), 24, { anchor: "start", o: oc });
            const wd = (val(b.v) / max) * wmax;
            el("rect", { x: 960 - wd, y, width: wd, height: rowH, rx: 8, fill: b.hot ? C.teal : C.tq2, opacity: oc });
            txt(960 - wd - 10, y + rowH * 0.65, sub(b.show), 24, { w: 700, anchor: "end", ltr: true, o: oc });
          });
          if (sc.foot) txt(640, 175 + n * (rowH + 12) + 40, sub(sc.foot), 26, { w: 600, fill: C.n700, o: appear(t, sc, n, n + 1, o) });
        },
        lines(t, sc, o) {
          txt(640, 130, sub(sc.title), 44, { w: 700, o });
          sc.lines.forEach((l, k) => {
            const oc = appear(t, sc, k, sc.lines.length, o); const hot = typeof l === "object";
            txt(640, 230 + k * 62, sub(hot ? l.text : l), hot && l.big ? 40 : 30, { w: hot ? 700 : 400, fill: hot ? C.teal : C.navy, o: oc });
          });
        },
        dots(t, sc, o) {
          // a strip of dots: sc.points = [{v: factId or number, label}], drawn on a number line from sc.lo to sc.hi; sc.marks = [{v, label, hot}]
          txt(640, 118, sub(sc.title), 42, { w: 700, o });
          const X = (v) => 140 + ((v - sc.lo) / (sc.hi - sc.lo)) * 1000;
          el("line", { x1: 140, x2: 1140, y1: 330, y2: 330, stroke: C.n300, "stroke-width": 4, opacity: o });
          (sc.points ?? []).forEach((p, k) => {
            const oc = appear(t, sc, k, (sc.points.length + (sc.marks ?? []).length) || 1, o);
            el("circle", { cx: X(p), cy: 330 - 0, r: 11, fill: C.tq2, stroke: C.navy, opacity: oc });
          });
          (sc.marks ?? []).forEach((m, k) => {
            const oc = appear(t, sc, (sc.points ?? []).length + k, (sc.points.length + sc.marks.length) || 1, o);
            const v = typeof m.v === "string" ? val(m.v) : m.v;
            el("line", { x1: X(v), x2: X(v), y1: 290, y2: 370, stroke: m.hot ? C.teal : C.navy, "stroke-width": 5, opacity: oc });
            txt(X(v), m.up ? 270 : 410, sub(m.show), 28, { w: 700, fill: m.hot ? C.teal : C.navy, ltr: true, o: oc });
            txt(X(v), m.up ? 235 : 448, sub(m.label), 20, { fill: C.n700, o: oc });
          });
          if (sc.foot) txt(640, 520, sub(sc.foot), 26, { w: 600, fill: C.n700, o });
        },
      };

      window.render = (t) => {
        svg.replaceChildren();
        for (const sc of SPEC.scenes) if (inScene(t, sc.t)) draw[sc.type](t, sc, vis(t, sc.t));
      };
      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
