<!doctype html>
<!--
  Video scene for lesson 4.3 — "התשלום מחולק בהכנסה הפנויה" (the payment-to-income ratio).
  Rendered frame by frame by scripts/render-video.mjs.
  Every number comes from data/lessons/4-3.json: case B's payment under the course's
  calculation assumption (not an offer), its declared and recognised income and the two
  ratios; the grace and bullet payments of the 3.8-style examples; the same-property
  example. No arithmetic in the scene; bar lengths are geometry from the data's own amounts.

  Script (one idea: the ratio is the payment over the disposable income, and what goes
  into each side decides it):
  1. Title.
  2. Case B: one payment, two incomes: the ratio against what was declared and against
     what is recognised.
  3. Which payment goes in: ordinary = first payment on the full amount; grace = the
     payment after it; bullet = the monthly interest.
  4. The same-property rule: an existing mortgage on the same property joins the payment.
  5. Closing: the lines are the next lesson.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 4.3 · יחס החזר</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/4-3.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 2 });
      const shek = (v) => `${nf.format(Number(v))} ₪`;
      const num = (v) => nf.format(Number(v));
      const pct = (v) => `${nf.format(Number(v))}%`;

      const V = {
        pay: fact("b.payment"), decl: fact("b.declared"), rec: fact("b.recognised"), rDecl: fact("b.ratio_declared"), rRec: fact("b.ratio_recognised"),
        gAfter: fact("grace.after"), gDuring: fact("grace.during"), bullet: fact("bullet.interest"),
        sNew: fact("same.new"), sOld: fact("same.existing"), sDisp: fact("same.disposable"), sPay: fact("same.payment"), sNo: fact("same.ratio_new_only"), sYes: fact("same.ratio"),
      };

      window.duration = 146;
      window.cues = [
        [1, 6, "כמה מההכנסה הפנויה הולך לתשלום?"],
        [6, 9.5, "זה יחס ההחזר."],
        [11, 18, `אבי ומיכל: התשלום על ההלוואה ${shek(V.pay)}.`],
        [18, 26, `אילו ההכנסה הפנויה ${shek(V.decl)}: ${pct(V.rDecl)}.`],
        [26, 34, "זה מה שהצהירו. אבל הבנק מחלק במה שהוא מכיר."],
        [34, 43, `ההכנסה המוכרת ${shek(V.rec)}: ${pct(V.rRec)}.`],
        [43, 52, "אותו תשלום, אותה הלוואה, יחס אחר."],
        [53, 58.5, "אין התחייבויות שנספרות: הפנויה שווה למוכרת."],
        [61, 68, "איזה תשלום נכנס? תלוי במבנה ההלוואה."],
        [68, 76, "הלוואה רגילה: ההחזר הראשון על כל הסכום."],
        [76, 86, `עם גרייס: ${shek(V.gAfter)} אחריה, לא ${shek(V.gDuring)}.`],
        [86, 95, `בוליט: הריבית החודשית, ${shek(V.bullet)}.`],
        [95, 100, "בלי זעזוע ריבית, ובלי החזר מרבי חזוי."],
        [102, 109, "תוספת על דירה שיש עליה משכנתא."],
        [109, 117, `התשלום החדש ${shek(V.sNew)}, ההכנסה הפנויה ${shek(V.sDisp)}.`],
        [117, 125, `בלי הכלל: ${pct(V.sNo)}. הכלל מוסיף ${shek(V.sOld)} לתשלום.`],
        [125, 132, `אותו נכס: ${pct(V.sYes)}.`],
        [132.5, 135, "הכללים נקראו מהנוסח הרשמי של בנק ישראל."],
        [135, 141, "ומה היחס הזה מאפשר? בשיעור הבא."],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      // Opacity of something that appears at absolute time `start`, inside a scene of opacity o.
      const at = (t, start, o, d = 0.6) => Math.min(o, clamp((t - start) / d));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: "start" puts the text's right edge at x. LTR runs (numbers, equations, no
      // Hebrew) use ltr: true, laid out strictly left to right so "2 × 2 = 4" never flips.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": opts.ltr ? "bidi-override" : "isolate" }, s);
      const box = (x, y, w, h, o, opts = {}) =>
        el("rect", { x, y, width: w, height: h, rx: opts.rx ?? 14, fill: opts.fill ?? C.n0, stroke: opts.stroke ?? C.n200, "stroke-width": opts.sw ?? 1.5, "stroke-dasharray": opts.dash ?? "none", opacity: o });
      const bar = (x, y, w, h, o, fill, opts = {}) =>
        el("rect", { x, y, width: Math.max(0, w), height: h, rx: opts.rx ?? 6, fill, stroke: opts.stroke ?? "none", "stroke-width": opts.sw ?? 0, "stroke-dasharray": opts.dash ?? "none", opacity: o });

      const S = { title: [0, 10], two: [10, 60], pay: [60, 101], same: [101, 134], end: [134, 146] };
      window.render = (t) => {
        svg.replaceChildren();
        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 280, "התשלום, מחולק", 76, { w: 700, o });
          txt(640, 360, "בהכנסה הפנויה", 76, { w: 700, o });
          txt(640, 430, "יחס החזר", 32, { fill: C.n600, o });
        }

        // Scene 2 — one payment, two incomes
        if (inScene(t, S.two)) {
          const o = vis(t, S.two);
          txt(640, 112, "אבי ומיכל: אותו תשלום, שתי הכנסות", 38, { w: 700, o });
          const R = 1050, W = 700, px = (v) => (Number(v) / Number(V.decl)) * W;
          const o1 = at(t, 11, o);
          txt(1240, 232, "התשלום", 24, { anchor: "start", w: 600, o: o1 });
          bar(R - px(V.pay), 200, px(V.pay), 48, o1, C.teal);
          txt(R - px(V.pay) / 2, 233, shek(V.pay), 22, { w: 700, fill: C.n0, o: o1, ltr: true });
          const rows = [
            ["הצהרה", V.decl, 18, C.n0, V.rDecl, 280, true],
            ["הכנסה מוכרת", V.rec, 34, C.mint, V.rRec, 390, false],
          ];
          rows.forEach(([label, income, start, fill, ratio, y, dashed]) => {
            const oi = at(t, start, o);
            txt(1240, y + 36, label, 24, { anchor: "start", w: 600, o: oi });
            bar(R - px(income), y, px(income), 56, oi, fill, dashed ? { stroke: C.navy, sw: 2.5, dash: "8 6" } : {});
            bar(R - px(V.pay), y, px(V.pay), 56, oi, C.teal);
            txt(R - px(income) / 2 - 80, y + 38, shek(income), 26, { w: 700, o: oi, ltr: true });
            const or = at(t, start + 2, o);
            txt(R - px(income) - 20, y + 40, pct(ratio), 36, { anchor: "end", w: 700, o: or, ltr: true });
          });
          if (t >= 43) txt(640, 520, "אותו תשלום, אותה הלוואה — יחס אחר.", 28, { w: 700, o: at(t, 43, o) });
        }

        // Scene 3 — which payment goes in
        if (inScene(t, S.pay)) {
          const o = vis(t, S.pay);
          txt(640, 112, "איזה תשלום נכנס ליחס", 38, { w: 700, o });
          const cards = [
            [68, "הלוואה רגילה", "ההחזר הראשון", "על כל הסכום", null],
            [76, "עם גרייס", "התשלום אחרי הגרייס", `לא ${shek(V.gDuring)} בגרייס`, V.gAfter],
            [86, "בוליט ובלון", "הריבית החודשית", "גם אם לא משלמים אותה", V.bullet],
          ];
          cards.forEach(([start, head, l1, l2, v], i) => {
            const oi = at(t, start, o);
            const x = 860 - i * 340;
            box(x, 190, 320, 250, oi, { stroke: C.teal, sw: 2.5, fill: i === 1 ? C.mint : C.n0 });
            txt(x + 160, 246, head, 28, { w: 700, o: oi });
            txt(x + 160, 300, l1, 24, { fill: C.n700, o: oi });
            if (v !== null) txt(x + 160, 364, shek(v), 36, { w: 700, o: oi, ltr: true });
            txt(x + 160, 412, l2, 20, { fill: C.n600, o: oi });
          });
          if (t >= 95) txt(640, 520, "בלי זעזוע ריבית, ובלי ההחזר המרבי החזוי.", 26, { w: 700, o: at(t, 95, o) });
        }

        // Scene 4 — the same-property rule
        if (inScene(t, S.same)) {
          const o = vis(t, S.same);
          txt(640, 112, "כלל ״אותו נכס״", 38, { w: 700, o });
          const R = 990, W = 680, px = (v) => (Number(v) / Number(V.sDisp)) * W;
          const o1 = at(t, 102, o);
          txt(1240, 196, "ההכנסה הפנויה", 24, { anchor: "start", w: 600, o: o1 });
          bar(R - W, 160, W, 56, o1, C.n100, { stroke: C.n300, sw: 1.5 });
          txt(R - W / 2, 198, shek(V.sDisp), 26, { w: 700, o: o1, ltr: true });
          const o2 = at(t, 109, o);
          txt(1240, 312, "ההלוואה החדשה", 24, { anchor: "start", w: 600, o: o2 });
          bar(R - px(V.sNew), 276, px(V.sNew), 56, o2, C.teal);
          txt(R - px(V.sNew) - 16, 314, `${shek(V.sNew)} · ${pct(V.sNo)}`, 24, { anchor: "end", w: 700, o: at(t, 117, o), ltr: true });
          const o3 = at(t, 117, o);
          txt(1240, 422, "עם המשכנתא הקיימת", 24, { anchor: "start", w: 600, o: o3 });
          bar(R - px(V.sNew), 386, px(V.sNew), 56, o3, C.teal);
          bar(R - px(V.sNew) - px(V.sOld), 386, px(V.sOld), 56, o3, C.n0, { stroke: C.navy, sw: 2.5, dash: "6 4" });
          txt(R - px(V.sNew) - px(V.sOld) - 16, 424, `${shek(V.sPay)} · ${pct(V.sYes)}`, 28, { anchor: "end", w: 700, o: at(t, 125, o), ltr: true });
        }

        // Scene 5 — end
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 230, "אותו תשלום,", 56, { w: 700, o });
          txt(640, 302, "יחס אחר", 56, { w: 700, o });
          txt(640, 400, "לפי איך סופרים את ההכנסה, ומה יושב על הנכס", 28, { fill: C.n700, o: at(t, 136, o) });
          txt(640, 556, "אבי ומיכל וגלעד ונוי בדויים; הריביות הן הנחת קורס, לא הצעת בנק.", 18, { fill: C.n600, o });
        }
      };
      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
