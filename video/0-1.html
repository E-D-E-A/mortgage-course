<!doctype html>
<!--
  Video scene for lesson 0.1 — "מאה ריבועים".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t,
  so the same input always gives the same video.
  Every number comes from data/lessons/0-1.json. The subtitle cues (window.cues)
  carry the explanatory sentences — the script for narration, if it is ever added.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 0.1 · אחוז</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/0-1.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const shek = (v) => `${nf2.format(Number(v))} ₪`.replace(".00 ₪", " ₪");

      const V = {
        start: fact("pred.start"), up: fact("pred.up"), after: fact("pred.after"),
        rise: fact("pred.rise"), drop: fact("pred.drop"), sq220: fact("video.square_220"),
        sq200: fact("explain.one_of_200"), three200: fact("explain.three_of_200"),
        sq5000: fact("explain.one_of_5000"), three5000: fact("explain.three_of_5000"),
        rel: fact("pp.relative"),
      };

      // Timeline (seconds). Each scene owns a window; render(t) draws whatever is on screen at t.
      const S = { title: [0, 12], squares: [12, 40], of: [40, 70], updown: [70, 110], points: [110, 146], end: [146, 158] };
      window.duration = 158;
      window.cues = [
        [1, 6, "אחוז: חלק אחד ממאה."],
        [6, 11.5, "השיעור הראשון: מאה ריבועים קטנים."],
        [13, 20, "דמיינו סכום כלשהו, מחולק ל־100 ריבועים שווים."],
        [20, 28, "כל ריבוע הוא חלק אחד ממאה: אחוז אחד, 1%."],
        [28, 39, "3% הם שלושה ריבועים. 100% הם כל הריבועים."],
        [41, 48, `עכשיו כל הריבועים יחד שווים ${shek(V.start)}.`],
        [48, 55, `כל ריבוע: 200 חלקי 100, כלומר ${shek(V.sq200)}. ו־3% הם ${shek(V.three200)}.`],
        [56, 63, `ואם הכול 5,000 ₪? אז ריבוע שווה ${shek(V.sq5000)}.`],
        [63, 69, `ו־3% הם ${shek(V.three5000)}. אותו אחוז, סכום אחר.`],
        [71, 78, `מחיר של ${shek(V.start)} עולה ב־10%.`],
        [78, 87, `10% מ־${shek(V.start)} הם ${shek(V.rise)}. המחיר: ${shek(V.up)}.`],
        [88, 95, "עכשיו המחיר יורד ב־10%. אבל 10% ממה?"],
        [95, 102, `מ־${shek(V.up)}: ריבוע שווה ${shek(V.sq220)}, ו־10% הם ${shek(V.drop)}.`],
        [102, 109, `המחיר: ${shek(V.after)}. הוא לא חוזר ל־${shek(V.start)}.`],
        [111, 118, "ומה אם משהו שנמדד באחוזים משתנה?"],
        [118, 125, "נניח ששיעור המס על מוצר עלה מ־4% ל־5%."],
        [125, 133, "נוסף ריבוע אחד: עלייה של נקודת אחוז אחת."],
        [133, 140, `אבל ביחס ל־4 הריבועים שהיו, זו עלייה של ${V.rel}%.`],
        [140, 145.5, "שתי דרכים נכונות לתאר אותו שינוי."],
        [147, 152, "אחוז הוא חלק אחד ממאה."],
        [152, 157.5, "ובכל אחוז שואלים: אחוז ממה?"],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, s, o, d = 0.6) => Math.min(o, clamp((t - sc[0] - s) / d));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n500: "var(--mogi-n500)", n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);

      // A 10×10 grid with its right edge at xr. Square i fills right to left, top to bottom, as Hebrew is read.
      // style(i) → "empty" | "teal" | "tq2" | "out" (outlined: taken away).
      function grid(xr, y0, cell, gap, style, o = 1) {
        for (let i = 0; i < 100; i++) {
          const row = Math.floor(i / 10), col = i % 10;
          const x = xr - (col + 1) * cell - col * gap, y = y0 + row * (cell + gap);
          const s = style(i);
          if (s === "out") el("rect", { x: x + 1.5, y: y + 1.5, width: cell - 3, height: cell - 3, rx: 3, fill: C.n0, stroke: C.teal, "stroke-width": 3, opacity: o });
          else el("rect", { x, y, width: cell, height: cell, rx: 3, fill: s === "teal" ? C.teal : s === "tq2" ? C.tq2 : C.n200, opacity: o });
        }
        return 10 * cell + 9 * gap;
      }
      const card = (cx, cy, w, h, o, fill = C.n0) => el("rect", { x: cx - w / 2, y: cy - h / 2, width: w, height: h, rx: 14, fill, stroke: C.n200, opacity: o });

      window.render = (t) => {
        svg.replaceChildren();
        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 300, "אחוז", 96, { w: 700, o });
          txt(640, 372, "חלק אחד ממאה", 36, { fill: C.n600, o });
          const o2 = after(t, S.title, 5, o, 0.8);
          grid(700, 420, 10, 2, (i) => (i < 3 ? "teal" : "empty"), o2);
        }
        // Scene 2 — a hundred squares, one is one percent
        if (inScene(t, S.squares)) {
          const o = vis(t, S.squares);
          const filled = t - S.squares[0] < 8 ? 0 : t - S.squares[0] < 16 ? 1 : 3;
          grid(1110, 130, 34, 4, (i) => (i < filled ? "teal" : "empty"), o);
          txt(380, 200, "100 ריבועים = הכול = 100%", 36, { w: 700, o: after(t, S.squares, 1.5, o) });
          if (filled >= 1) {
            const o2 = after(t, S.squares, 8, o);
            card(380, 310, 360, 90, o2);
            txt(380, 322, "ריבוע אחד = 1%", 36, { w: 700, fill: C.teal, o: o2 });
          }
          if (filled >= 3) {
            const o3 = after(t, S.squares, 16, o);
            card(380, 430, 360, 90, o3);
            txt(380, 442, "3 ריבועים = 3%", 36, { w: 700, fill: C.teal, o: o3 });
          }
        }
        // Scene 3 — 3% of 200 ₪, then of 5,000 ₪
        if (inScene(t, S.of)) {
          const o = vis(t, S.of);
          const big = t - S.of[0] >= 16;
          const whole = big ? "5,000 ₪" : shek(V.start);
          const sq = big ? V.sq5000 : V.sq200;
          const res = big ? V.three5000 : V.three200;
          const step = big ? 16 : 0;
          grid(1110, 150, 34, 4, (i) => (i < 3 ? "teal" : "empty"), o);
          txt(1110 - 189, 130, `הכול: ${whole}`, 28, { w: 700, o });
          const o2 = after(t, S.of, step + 4, o);
          card(380, 250, 420, 100, o2);
          txt(380, 236, "ריבוע אחד (1%)", 24, { fill: C.n600, o: o2 });
          txt(380, 278, shek(sq), 40, { w: 700, o: o2, ltr: true });
          const o3 = after(t, S.of, step + 9, o);
          card(380, 390, 420, 100, o3, C.mint);
          txt(380, 376, "3 ריבועים (3%)", 24, { fill: C.n700, o: o3 });
          txt(380, 418, shek(res), 40, { w: 700, fill: C.teal, o: o3, ltr: true });
        }
        // Scene 4 — up 10%, then down 10%
        if (inScene(t, S.updown)) {
          const o = vis(t, S.updown);
          const k = t - S.updown[0];
          // The price cards, right to left: 200 → 220 → 198
          card(1030, 170, 220, 84, o);
          txt(1030, 184, shek(V.start), 38, { w: 700, o, ltr: true });
          const oUp = after(t, S.updown, 8, o);
          txt(830, 145, `+10% = ${shek(V.rise)}`, 22, { fill: C.teal, w: 600, o: oUp, ltr: true });
          el("line", { x1: 905, y1: 172, x2: 760, y2: 172, stroke: C.navy, "stroke-width": 2, opacity: oUp });
          card(640, 170, 220, 84, oUp);
          txt(640, 184, shek(V.up), 38, { w: 700, o: oUp, ltr: true });
          const oDown = after(t, S.updown, 25, o);
          txt(440, 145, `−10% = ${shek(V.drop)}`, 22, { fill: C.teal, w: 600, o: oDown, ltr: true });
          el("line", { x1: 515, y1: 172, x2: 370, y2: 172, stroke: C.navy, "stroke-width": 2, opacity: oDown });
          card(250, 170, 220, 84, oDown, C.mint);
          txt(250, 184, shek(V.after), 38, { w: 700, o: oDown, ltr: true });
          // The grid of the amount the change is measured from
          const second = k >= 18;
          const og = second ? Math.min(after(t, S.updown, 18.3, o), clamp((32 - k) / 0.6)) : Math.min(after(t, S.updown, 1, o), clamp((18 - k) / 0.6));
          if (k < 32) {
            grid(1100, 260, 26, 3, (i) => (i < 90 ? "teal" : second ? "out" : "tq2"), og);
            txt(1100 - 145, 248, `הכול: ${second ? shek(V.up) : shek(V.start)}`, 22, { w: 700, o: og });
            txt(440, 330, "10 ריבועים = 10%", 30, { w: 700, o: og });
            txt(440, 380, `כל ריבוע: ${shek(second ? V.sq220 : V.sq200)}`, 26, { fill: C.n700, o: og });
            txt(440, 440, `10% = ${shek(second ? V.drop : V.rise)}`, 36, { w: 700, fill: C.teal, o: og, ltr: true });
          } else {
            const oe = after(t, S.updown, 32, o);
            txt(640, 360, `${shek(V.after)}, לא ${shek(V.start)}`, 46, { w: 700, o: oe });
            txt(640, 420, "הירידה נמדדת מסכום גדול יותר — ולכן היא גדולה יותר.", 28, { fill: C.n700, o: oe });
          }
        }
        // Scene 5 — percentage points against percent
        if (inScene(t, S.points)) {
          const o = vis(t, S.points);
          const oTitle = Math.min(o, clamp((S.points[0] + 7 - t) / 0.6));
          txt(640, 300, "נקודת אחוז מול אחוז", 56, { w: 700, o: oTitle });
          txt(640, 370, "כשמשהו שנמדד באחוזים משתנה", 30, { fill: C.n600, o: oTitle });
          const o1 = after(t, S.points, 7, o);
          grid(1150, 170, 28, 3, (i) => (i < 4 ? "teal" : "empty"), o1);
          txt(1150 - 154, 150, "4%", 32, { w: 700, o: o1, ltr: true });
          grid(780, 170, 28, 3, (i) => (i < 4 ? "teal" : i < 5 ? "tq2" : "empty"), o1);
          txt(780 - 154, 150, "5%", 32, { w: 700, o: o1, ltr: true });
          txt(1150 - 154, 120, "לפני", 22, { fill: C.n600, o: o1 });
          txt(780 - 154, 120, "אחרי", 22, { fill: C.n600, o: o1 });
          const o2 = after(t, S.points, 15, o);
          card(240, 240, 330, 110, o2);
          txt(240, 230, `\u2066+${fact("pp.points")}\u2069 נקודת אחוז`, 34, { w: 700, o: o2 });
          txt(240, 270, "ריבוע אחד נוסף", 22, { fill: C.n700, o: o2 });
          const o3 = after(t, S.points, 23, o);
          card(240, 400, 330, 110, o3, C.mint);
          txt(240, 390, `\u2066+${V.rel}%\u2069 ביחס למה שהיה`, 30, { w: 700, fill: C.teal, o: o3 });
          txt(240, 430, "ריבוע אחד על 4 שהיו", 22, { fill: C.n700, o: o3 });
        }
        // Scene 6 — takeaway
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          txt(640, 290, "אחוז = חלק אחד ממאה.", 52, { w: 700, o });
          const o2 = after(t, S.end, 5, o, 0.8);
          txt(640, 380, "ובכל אחוז שואלים: אחוז ממה?", 38, { fill: C.n700, o: o2 });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
