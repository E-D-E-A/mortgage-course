<!doctype html>
<!--
  Video scene for lesson 9.2 — "מהתוכנית לשלוש חלופות". Every number comes from data/lessons/9-2.json; render(t) depends only on t.
  Fictional case, fictional banks with the exercise's invented rules; every price is an estimate until a bank answers in writing.

  Script (one idea: one plan, four banks, three alternatives that buy different things, three scenarios, and four kinds of number):
  1. Title.
  2. The plan: 21,000 more equity moves the ratio under the line and earns a relief at bank א׳.
  3. Four banks, one request: three approve, bank ד׳ refuses on the financing ratio.
  4. Three alternatives, three goals: each wins its goal and costs something.
  5. Three scenarios: the fixed alternative does not move; the linked one moves most.
  6. Which number is this: estimate, scenario, personal offer, executed deal.
  7. Takeaway.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 9.2 · התיק המסכם, ב׳</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      import { boot } from "/video/_s8c.js";
      const v = await boot("9-2");
      const { fact, num, shek, lr, inScene, vis, after, grow, C, el, txt, box } = v;
      const BANK = { a: "בנק א׳", b: "בנק ב׳", c: "בנק ג׳", d: "בנק ד׳" };
      const S = { title: [0, 8], plan: [8, 46], banks: [46, 84], alts: [84, 126], scen: [126, 166], kinds: [166, 196], end: [196, 210] };
      window.duration = 210;
      const stamp = (o = 1) => txt(640, 552, "דוגמה לימודית · בנקים ותיק בדויים · אומדנים, לא הצעות", 18, { fill: C.n600, o });
      const T = (id) => num(fact(id));
      window.cues = [
        [1, 6, "מהתוכנית לשלוש חלופות."],
        [6, 8, "הכול בדוי, וכל מחיר הוא אומדן."],
        [9, 18, `מוסיפים ${lr(shek(fact("plan.extra")))} להון העצמי.`],
        [18, 28, `ההלוואה קטנה ל־${lr(shek(fact("plan.loan")))}.`],
        [28, 38, `יחס ההחזר ${lr(T("o.request.a.ratio"))}%, מתחת ל־40%.`],
        [38, 45, `בבנק א׳ זו הנחה של ${lr(fact("o.request.a.relief"))} נקודת אחוז.`],
        [47, 58, "אותה בקשה, ארבעה בנקים."],
        [58, 70, "שלושה מאשרים, ובנק א׳ הזול."],
        [70, 83, "בנק ד׳ מסרב: שיעור המימון מעל התקרה שלו."],
        [85, 95, "שלוש חלופות, שלוש מטרות."],
        [95, 105, `צמודה: החזר ראשון ${lr(shek(fact("o.payment.b.base.first")))}.`],
        [105, 115, `25 שנה: הסך הנמוך, ${lr(shek(fact("o.total.b.base.total")))}.`],
        [115, 125, "קבועה: אותו החזר בכל תרחיש."],
        [127, 137, "כל חלופה בשלושה תרחישים."],
        [137, 148, "הצמודה זזה הכי הרבה בלחץ."],
        [148, 158, "הקבועה לא זזה, ומשלמים על זה."],
        [158, 165, "הסיכון של הצמודה רחוק בזמן."],
        [167, 176, "אומדן, תרחיש, הצעה אישית, עסקה."],
        [176, 186, "הצעה ועסקה עוד אין."],
        [186, 195, "בין חלופות לא משווים לפי מחיר."],
        [197, 203, "כל חלופה קונה משהו ומשלמת עליו."],
        [203, 209, "ההמלצה, בשיעור הבא."],
      ];
      const line2 = (x, y, name, val, o, big = false, fill = C.navy) => {
        txt(x, y, name, 24, { anchor: "start", fill: C.n700, o });
        txt(x - 6, y + 44, val, big ? 44 : 34, { anchor: "start", ltr: true, w: 700, fill, o });
      };
      window.render = (t) => {
        svg.replaceChildren();
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 280, "התיק המסכם, ב׳", 80, { w: 700, o });
          txt(640, 360, "תוכנית, הצעות, שלוש חלופות ותרחישים", 44, { fill: C.n600, o });
          txt(640, 440, "נועם ושירה · תיק בדוי · אומדנים לפי כללי תרגיל", 24, { fill: C.n600, o: after(t, S.title, 3, o) });
        }
        if (inScene(t, S.plan)) {
          const o = vis(t, S.plan);
          txt(1190, 122, "התוכנית: הון עצמי נוסף", 42, { anchor: "start", w: 700, o });
          box(660, 190, 520, 290, o, C.n0);
          box(100, 190, 520, 290, after(t, S.plan, 1, o), C.mint);
          txt(1150, 232, "לפני", 26, { anchor: "start", fill: C.n600, o });
          txt(580, 232, "אחרי", 26, { anchor: "start", fill: C.teal, w: 700, o: after(t, S.plan, 1, o) });
          const rows = [
            ["הון עצמי", shek(fact("a.equity")), shek(fact("plan.equity")), 9],
            ["הלוואה", shek(fact("a.loan")), shek(fact("plan.loan")), 18],
            ["יחס החזר", `${T("o.original.a.ratio")}%`, `${T("o.request.a.ratio")}%`, 28],
            ["שיעור מימון", `${T("a.ltv")}%`, `${T("plan.ltv")}%`, 36],
          ];
          rows.forEach(([name, a, b, at], i) => {
            const oa = after(t, S.plan, at - 8, o);
            const y = 282 + i * 48;
            txt(1150, y, name, 24, { anchor: "start", w: 600, fill: C.n700, o: oa });
            txt(880, y, a, 28, { anchor: "start", ltr: true, o: oa });
            txt(260, y, b, 28, { anchor: "start", ltr: true, w: 700, fill: C.teal, o: oa });
          });
          txt(640, 520, `סך התשלומים בבנק א׳ נמוך ב־${shek(fact("gain.total"))}`, 28, { w: 700, fill: C.teal, o: after(t, S.plan, 30, o) });
          stamp(o);
        }
        if (inScene(t, S.banks)) {
          const o = vis(t, S.banks);
          txt(1190, 122, "אותה בקשה, ארבעה בנקים", 42, { anchor: "start", w: 700, o });
          const ids = ["a", "b", "c", "d"];
          const max = Math.max(...["a", "b", "c"].map((b) => Number(fact(`o.request.${b}.base.total`))));
          const min = Math.min(...["a", "b", "c"].map((b) => Number(fact(`o.request.${b}.base.total`))));
          ids.forEach((b, i) => {
            const y = 190 + i * 80;
            const oa = after(t, S.banks, 1 + i * 2.5, o);
            const ok = fact(`o.request.${b}.decision`) === "approve";
            txt(1170, y + 40, BANK[b], 30, { anchor: "start", w: 700, o: oa });
            if (ok) {
              const total = Number(fact(`o.request.${b}.base.total`));
              const w = 120 + ((total - min) / (max - min + 1)) * 360 * grow(t, S.banks, 2 + i * 2.5, 1.2);
              el("rect", { x: 880 - w, y: y + 8, width: w, height: 48, rx: 10, fill: b === "a" ? C.teal : C.tq2, opacity: oa });
              txt(880 - w - 14, y + 42, `${num(total)} ₪`, 28, { anchor: "end", ltr: true, w: 700, o: oa });
              const rl = fact(`o.request.${b}.relief`);
              txt(1040, y + 42, rl === "0" ? "מחירון" : `הנחה ${rl}`, 22, { anchor: "start", fill: C.n700, o: oa });
            } else {
              txt(1040, y + 42, "מסרב: שיעור מימון מעל התקרה", 26, { anchor: "start", fill: "var(--mogi-danger)", w: 700, o: oa });
            }
          });
          txt(640, 520, "הציר חתוך כדי שיראו את ההפרשים", 18, { fill: C.n600, o });
          stamp(o);
        }
        if (inScene(t, S.alts)) {
          const o = vis(t, S.alts);
          txt(1190, 122, "שלוש חלופות, שלוש מטרות", 42, { anchor: "start", w: 700, o });
          const alts = [
            ["payment", "צמודה", "החזר חודשי נמוך", "o.payment.b.base.first", "o.payment.b.base.total", "o.payment.b.rise"],
            ["total", "25 שנה", "סך תשלומים נמוך", "o.total.b.base.first", "o.total.b.base.total", "o.total.b.rise"],
            ["exposure", "קבועה", "יציבות", "o.exposure.b.base.first", "o.exposure.b.base.total", "o.exposure.b.rise"],
          ];
          alts.forEach(([id, name, goal, first, total, rise], i) => {
            const x = 900 - i * 400;
            const oa = after(t, S.alts, 1 + i * 10, o);
            box(x - 20, 190, 360, 320, oa, i === 1 ? C.mint : C.n0);
            txt(x + 160, 238, name, 34, { w: 700, o: oa });
            txt(x + 160, 272, goal, 22, { fill: C.teal, w: 600, o: oa });
            const rowsA = [["החזר ראשון", `${T(first)} ₪`], ["סך תשלומים", `${T(total)} ₪`], ["חשיפה", `${T(rise)} ₪`]];
            rowsA.forEach(([a, b], k) => {
              txt(x + 330, 330 + k * 56, a, 20, { anchor: "start", fill: C.n700, o: oa });
              txt(x + 10, 330 + k * 56, b, 26, { anchor: "start", ltr: true, w: 700, o: oa });
            });
          });
          stamp(o);
        }
        if (inScene(t, S.scen)) {
          const o = vis(t, S.scen);
          txt(1190, 122, "כל חלופה בשלושה תרחישים", 42, { anchor: "start", w: 700, o });
          const sc = [["בסיס", "base"], ["לחץ", "stress"], ["מקרו", "macro"]];
          const alts = [["צמודה", "payment"], ["25 שנה", "total"], ["קבועה", "exposure"]];
          const all = alts.flatMap(([, id]) => sc.map(([, s]) => Number(fact(`o.${id}.b.${s}.total`))));
          const lo = Math.min(...all) - 200000, hi = Math.max(...all);
          alts.forEach(([name, id], i) => {
            const y = 190 + i * 110;
            const oa = after(t, S.scen, 1 + i * 8, o);
            txt(1170, y + 52, name, 30, { anchor: "start", w: 700, o: oa });
            sc.forEach(([sn, s], k) => {
              const total = Number(fact(`o.${id}.b.${s}.total`));
              const w = (420 * (total - lo)) / (hi - lo) * grow(t, S.scen, 2 + i * 8 + k * 0.8, 1);
              const yy = y + k * 34;
              el("rect", { x: 880 - w, y: yy, width: w, height: 26, rx: 6, fill: k === 1 ? C.teal : C.tq2, opacity: oa * (k === 0 ? 1 : 0.9) });
              txt(880 - w - 10, yy + 21, `${num(total)}`, 20, { anchor: "end", ltr: true, o: oa });
              txt(1040, yy + 21, sn, 20, { anchor: "start", fill: C.n700, o: oa });
            });
          });
          txt(640, 520, "הציר חתוך כדי שיראו את ההפרשים", 18, { fill: C.n600, o });
          stamp(o);
        }
        if (inScene(t, S.kinds)) {
          const o = vis(t, S.kinds);
          txt(1190, 122, "איזה מספר זה?", 42, { anchor: "start", w: 700, o });
          const rows = [["אומדן", "מחירון בנק על תמהיל שעוד לא ראה", 1], ["תרחיש", "מה אם: בסיס, לחץ, מקרו", 4], ["הצעה אישית", "עוד אין: בכתב מהבנק", 8], ["עסקה שבוצעה", "עוד אין: רק אחרי חתימה", 12]];
          rows.forEach(([a, b, at], i) => {
            const oa = after(t, S.kinds, at, o);
            box(160, 190 + i * 78, 920, 62, oa, i < 2 ? C.mint : C.n0);
            txt(1050, 190 + i * 78 + 42, a, 30, { anchor: "start", w: 700, o: oa });
            txt(760, 190 + i * 78 + 42, b, 26, { anchor: "start", fill: C.n700, o: oa });
          });
        }
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          const rows = [["כל חלופה", "קונה משהו ומשלמת עליו"], ["בין חלופות", "לא משווים לפי מחיר"], ["ההמלצה", "בשיעור 9.3"]];
          rows.forEach(([a, b], i) => {
            const oa = after(t, S.end, 0.3 + i * 2.5, o);
            txt(1060, 240 + i * 80, a, 34, { anchor: "start", w: 700, o: oa });
            txt(760, 240 + i * 80, b, 30, { anchor: "start", fill: C.teal, o: oa });
          });
          stamp(o);
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
