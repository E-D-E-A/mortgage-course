<!doctype html>
<!--
  Video scene for lesson 1.1 — "הלוואה עם גיבוי".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t,
  so the same input always gives the same video.
  Every number comes from data/lessons/1-1.json (the explanation's apartment, debt,
  sale prices, shares and cushion). The scene does no arithmetic on amounts; bar
  lengths are geometry from the data's own values. The subtitle cues (window.cues)
  carry the explanatory sentences — the script for narration, if it is ever added.

  Script (one idea: a mortgage is a loan with the apartment behind it, and from a
  sale the debt is paid first):
  1. Title. Every lender asks "what if I am not repaid?"; a mortgage answers it.
  2. A loan without collateral leans on the borrower only; a mortgage also on the
     apartment, pledged to the lender. The apartment stays yours; the lien gives
     the lender two rights: to realise it, and to be paid first.
  3. Apartment worth 1,000,000, debt 600,000. Sold at full value: 600,000 to the
     bank first, 400,000 back to you (before costs and late interest).
  4. Prices fell, sold at 550,000: all of it to the bank, still owe 50,000.
     The collateral protects the lender first.
  5. The cushion: the price can fall by 400,000, 40% of the value, and the sale
     still covers the debt. Smaller debt for the value, bigger cushion.
  Claim labels: the order of the steps when payments stop is simplified general
  knowledge, not checked against a legal source (the lesson marks it "לא אומת").
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 1.1 · משכנתא: הלוואה עם בטוחה</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/1-1.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf = new Intl.NumberFormat("he-IL", { maximumFractionDigits: 2 });
      const shek = (v) => `${nf.format(Number(v))} ₪`;

      const V = {
        value: fact("explain.value"), debt: fact("explain.debt"),
        toLender: fact("explain.full.to_lender"), toYou: fact("explain.full.to_borrower"),
        low: fact("explain.low_sale"), lowLender: fact("explain.low.to_lender"), owed: fact("explain.low.still_owed"),
        cushion: fact("explain.cushion"),
      };

      // Timeline (seconds). Each scene owns a window; render(t) draws whatever is on screen at t.
      const S = { title: [0, 12], two: [12, 44], sale: [44, 86], low: [86, 118], cushion: [118, 150] };
      window.duration = 150;
      window.cues = [
        [1, 6, "כל מלווה שואל את עצמו: ומה אם לא יחזירו לי?"],
        [6, 11.5, "במשכנתא יש תשובה: הדירה עומדת מאחורי ההלוואה."],
        [13, 21, "בהלוואה ללא בטוחה, המלווה נשען רק על הלווה."],
        [21, 29, "במשכנתא הדירה היא הבטוחה: היא משועבדת למלווה."],
        [29, 36, "הדירה נשארת שלכם. השעבוד נותן למלווה שתי זכויות:"],
        [36, 43, "לממש אותה אם לא משלמים, ולקבל את החוב קודם."],
        [45, 53, `דירה ששווה ${shek(V.value)}, וחוב של ‏${shek(V.debt)}.`],
        [53, 60, "הלווה הפסיק לשלם, ובסוף ההליך הדירה נמכרת."],
        [60, 69, `מהכסף נפרע קודם החוב: ${shek(V.toLender)} לבנק.`],
        [69, 77, `מה שנשאר, ${shek(V.toYou)}, חוזר אליכם.`],
        [77, 85, "זה לפני הוצאות ההליך והריבית על הפיגור. בפועל — פחות."],
        [87, 95, `ואם המחירים ירדו, והדירה נמכרה רק ב־${shek(V.low)}?`],
        [95, 103, `כל הכסף הולך לבנק: ${shek(V.lowLender)}. וזה לא מספיק.`],
        [103, 111, `עדיין חייבים ${shek(V.owed)}. הדירה נמכרה, והחוב נשאר.`],
        [111, 117, "הבטוחה מגינה קודם כול על המלווה — לא על הלווה."],
        [119, 127, `המכירה מכסה את החוב כל עוד המחיר לפחות ${shek(V.debt)}.`],
        [127, 135, `המחיר יכול לרדת ב־${shek(V.toYou)}: ${V.cushion}% מהשווי.`],
        [135, 142, "לזה קוראים כרית הביטחון."],
        [142, 149, "חוב קטן ביחס לשווי — כרית גדולה, ומלווה מוגן יותר."],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      // Opacity of something that appears at absolute time `start`, inside a scene of opacity o.
      const at = (t, start, o, d = 0.6) => Math.min(o, clamp((t - start) / d));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: "start" puts the text's right edge at x. LTR runs (numbers, equations, no
      // Hebrew) use ltr: true, laid out strictly left to right so "2 × 2 = 4" never flips.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": opts.ltr ? "bidi-override" : "isolate" }, s);
      const box = (x, y, w, h, o, opts = {}) =>
        el("rect", { x, y, width: w, height: h, rx: opts.rx ?? 14, fill: opts.fill ?? C.n0, stroke: opts.stroke ?? C.n200, "stroke-width": opts.sw ?? 1.5, "stroke-dasharray": opts.dash ?? "none", opacity: o });

      // Simple pictograms: a person and a house.
      function person(cx, cy, s, o, fill = C.navy) {
        el("circle", { cx, cy: cy - 22 * s, r: 13 * s, fill, opacity: o });
        el("path", { d: `M ${cx - 22 * s} ${cy + 26 * s} Q ${cx - 22 * s} ${cy - 4 * s} ${cx} ${cy - 4 * s} Q ${cx + 22 * s} ${cy - 4 * s} ${cx + 22 * s} ${cy + 26 * s} Z`, fill, opacity: o });
      }
      function house(cx, cy, s, o, fill = C.teal) {
        el("polygon", { points: `${cx - 40 * s},${cy - 6 * s} ${cx},${cy - 40 * s} ${cx + 40 * s},${cy - 6 * s}`, fill, opacity: o });
        el("rect", { x: cx - 30 * s, y: cy - 6 * s, width: 60 * s, height: 40 * s, fill, opacity: o });
        el("rect", { x: cx - 8 * s, y: cy + 12 * s, width: 16 * s, height: 22 * s, fill: C.n0, opacity: o });
      }

      // Money bars, right to left: x = right edge, the whole width is the apartment's value.
      const BAR = { right: 960, full: 740 };
      const px = (v) => (Number(v) / Number(V.value)) * BAR.full;

      // A labelled row: label on the right of the bar, then the bar from BAR.right leftwards.
      function rowLabel(y, label, o) {
        txt(1180, y + 36, label, 26, { anchor: "start", w: 600, o });
      }

      window.render = (t) => {
        svg.replaceChildren();

        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 290, "הלוואה עם גיבוי", 80, { w: 700, o });
          txt(640, 355, "משכנתא, ומה קורה אם לא משלמים", 34, { fill: C.n600, o });
          const o2 = at(t, 6.5, o, 0.8);
          person(600, 470, 1.2, o2);
          house(690, 470, 1.2, o2);
        }

        // Scene 2 — a loan without collateral, and a mortgage
        if (inScene(t, S.two)) {
          const o = vis(t, S.two);
          txt(640, 112, "על מה המלווה נשען", 40, { w: 700, o });
          // Right card: without collateral.
          const o1 = at(t, 13, o);
          box(670, 150, 480, 230, o1);
          txt(910, 198, "הלוואה ללא בטוחה", 30, { w: 700, o: o1 });
          person(910, 280, 1.3, o1);
          txt(910, 356, "רק הלווה", 24, { fill: C.n700, o: o1 });
          // Left card: a mortgage.
          const o2 = at(t, 21, o);
          box(130, 150, 480, 230, o2, { stroke: C.teal, sw: 3 });
          txt(370, 198, "משכנתא", 30, { w: 700, o: o2 });
          person(420, 280, 1.3, o2);
          house(320, 284, 1.2, o2);
          txt(370, 356, "הלווה, ועוד הדירה — משועבדת למלווה", 22, { fill: C.n700, o: o2 });
          // What the lien gives the lender.
          const o3 = at(t, 29, o);
          txt(1140, 432, "הדירה נשארת שלכם. השעבוד נותן למלווה:", 26, { anchor: "start", w: 600, o: o3 });
          const o4 = at(t, 36, o);
          box(640, 460, 500, 80, o4, { fill: C.mint, stroke: C.mint });
          txt(1116, 508, "לממש את הדירה, אם לא משלמים", 24, { anchor: "start", w: 600, o: o4 });
          const o5 = at(t, 39, o);
          box(140, 460, 480, 80, o5, { fill: C.mint, stroke: C.mint });
          txt(596, 508, "לקבל את החוב קודם, כשהיא נמכרת", 24, { anchor: "start", w: 600, o: o5 });
        }

        // Scene 3 — sold at its value: the debt first, the rest to you
        if (inScene(t, S.sale)) {
          const o = vis(t, S.sale);
          txt(640, 112, `הדירה נמכרת ב־${shek(V.value)}`, 40, { w: 700, o });
          // The debt.
          const oD = at(t, 45, o);
          rowLabel(170, "החוב", oD);
          box(BAR.right - px(V.debt), 170, px(V.debt), 56, oD, { rx: 6, fill: C.n0, stroke: C.navy, sw: 2.5 });
          txt(BAR.right - px(V.debt) / 2, 207, shek(V.debt), 24, { w: 700, o: oD, ltr: true });
          // The money from the sale.
          const oS = at(t, 53, o);
          rowLabel(290, "הכסף מהמכירה", oS);
          box(BAR.right - BAR.full, 290, BAR.full, 56, oS * 0.5, { rx: 6, fill: C.n300, stroke: C.n300 });
          txt(BAR.right - BAR.full / 2, 327, shek(V.value), 24, { w: 700, o: oS * (1 - clamp((t - 60) / 0.6)), ltr: true });
          const oL = at(t, 60, o);
          box(BAR.right - px(V.toLender), 290, px(V.toLender), 56, oL, { rx: 6, fill: C.teal, stroke: C.teal });
          txt(BAR.right - px(V.toLender) / 2, 327, shek(V.toLender), 24, { w: 700, fill: C.n0, o: oL, ltr: true });
          txt(BAR.right - px(V.toLender) / 2, 390, "קודם: לבנק", 24, { w: 600, o: oL });
          const oY = at(t, 69, o);
          box(BAR.right - BAR.full, 290, px(V.toYou), 56, oY, { rx: 6, fill: C.tq2, stroke: C.tq2 });
          txt(BAR.right - BAR.full + px(V.toYou) / 2, 327, shek(V.toYou), 24, { w: 700, o: oY, ltr: true });
          txt(BAR.right - BAR.full + px(V.toYou) / 2, 390, "מה שנשאר: לכם", 24, { w: 600, o: oY });
          const oN = at(t, 77, o);
          txt(640, 480, "לפני הוצאות ההליך ולפני ריבית על הפיגור, שמקטינות את מה שנשאר לכם.", 22, { fill: C.n700, o: oN });
          txt(640, 520, "סדר הצעדים כשלא משלמים מתואר בפישוט, ולא נבדק מול מקור משפטי (לא אומת).", 20, { fill: C.n600, o: oN });
        }

        // Scene 4 — prices fell: the sale does not cover the debt
        if (inScene(t, S.low)) {
          const o = vis(t, S.low);
          txt(640, 112, `המחירים ירדו: הדירה נמכרת ב־${shek(V.low)}`, 40, { w: 700, o });
          rowLabel(170, "החוב", o);
          box(BAR.right - px(V.debt), 170, px(V.debt), 56, o, { rx: 6, fill: C.n0, stroke: C.navy, sw: 2.5 });
          txt(BAR.right - px(V.debt) / 2, 207, shek(V.debt), 24, { w: 700, o, ltr: true });
          const oS = at(t, 87, o);
          rowLabel(290, "הכסף מהמכירה", oS);
          const grow = clamp((t - 95) / 2);
          box(BAR.right - px(V.low), 290, px(V.low), 56, oS, { rx: 6, fill: C.n300, stroke: C.n300 });
          if (grow > 0) box(BAR.right - px(V.low) * grow, 290, px(V.low) * grow, 56, oS, { rx: 6, fill: C.teal, stroke: C.teal });
          txt(BAR.right - px(V.low) / 2, 327, shek(V.lowLender), 24, { w: 700, fill: grow > 0.5 ? C.n0 : C.navy, o: oS, ltr: true });
          txt(BAR.right - px(V.low) / 2, 390, "הכול לבנק", 24, { w: 600, o: at(t, 95, o) });
          // The part of the debt the sale did not cover.
          const oG = at(t, 103, o);
          const gx = BAR.right - px(V.debt), gw = px(V.owed);
          box(gx, 290, gw, 56, oG, { rx: 6, fill: C.n0, stroke: C.navy, sw: 2.5, dash: "8 6" });
          el("line", { x1: gx + gw / 2, y1: 360, x2: gx + gw / 2, y2: 420, stroke: C.navy, "stroke-width": 2, opacity: oG });
          txt(gx + gw / 2 + 120, 452, `עדיין חייבים: ${shek(V.owed)}`, 26, { w: 700, o: oG });
          const oT = at(t, 111, o);
          box(290, 488, 700, 64, oT, { fill: C.mint, stroke: C.mint });
          txt(640, 530, "הבטוחה מגינה קודם כול על המלווה — לא על הלווה.", 28, { w: 700, o: oT });
        }

        // Scene 5 — the cushion
        if (inScene(t, S.cushion)) {
          const o = vis(t, S.cushion);
          txt(640, 112, "כרית הביטחון", 44, { w: 700, o });
          rowLabel(180, "שווי הדירה", o);
          box(BAR.right - BAR.full, 180, BAR.full, 56, o, { rx: 6, fill: C.n300, stroke: C.n300 });
          box(BAR.right - px(V.debt), 180, px(V.debt), 56, o, { rx: 6, fill: C.teal, stroke: C.teal });
          txt(BAR.right - px(V.debt) / 2, 217, `החוב: ${shek(V.debt)}`, 24, { w: 700, fill: C.n0, o });
          txt(1180, 262, shek(V.value), 22, { anchor: "start", fill: C.n700, o });
          // The room between the debt and the value.
          const oR = at(t, 127, o);
          const rx = BAR.right - BAR.full, rw = px(V.toYou);
          box(rx, 180, rw, 56, oR, { rx: 6, fill: C.tq2, stroke: C.tq2 });
          el("path", { d: `M ${rx + 4} 252 L ${rx + 4} 268 L ${rx + rw - 4} 268 L ${rx + rw - 4} 252`, fill: "none", stroke: C.navy, "stroke-width": 2.5, opacity: oR });
          txt(rx + rw / 2, 302, `המחיר יכול לרדת ב־${shek(V.toYou)}`, 24, { w: 600, o: oR });
          el("line", { x1: BAR.right - px(V.debt), x2: BAR.right - px(V.debt), y1: 166, y2: 250, stroke: C.navy, "stroke-width": 3, "stroke-dasharray": "6 4", opacity: oR });
          const oC = at(t, 129, o);
          box(240, 340, 360, 150, oC);
          txt(420, 380, `${nf.format(Number(V.toYou))} מתוך ${nf.format(Number(V.value))}`, 22, { fill: C.n700, o: oC });
          txt(420, 450, `${V.cushion}%`, 60, { w: 700, o: oC, ltr: true });
          txt(420, 478, "מהשווי", 20, { fill: C.n700, o: oC });
          const oK = at(t, 135, o);
          txt(1100, 384, "כרית הביטחון:", 30, { anchor: "start", w: 700, o: oK });
          txt(1100, 424, "בכמה המחיר יכול לרדת,", 24, { anchor: "start", fill: C.n700, o: oK });
          txt(1100, 458, "ועדיין המכירה תכסה את החוב", 24, { anchor: "start", fill: C.n700, o: oK });
          const oE = at(t, 142, o, 0.8);
          box(290, 510, 700, 56, oE, { fill: C.mint, stroke: C.mint });
          txt(640, 546, "חוב קטן יותר ביחס לשווי — כרית גדולה יותר.", 26, { w: 700, o: oE });
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
