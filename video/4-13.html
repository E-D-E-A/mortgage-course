<!doctype html>
<!--
  Video scene for lesson 4.13 — "אותה משפחה, ארבעה טפסים".
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t.
  Every number comes from data/lessons/4-13.json. The subtitle cues (window.cues)
  are the narration script.

  Script (one idea: the four banks' public forms ask for the same facts in different
  units and definitions, and the forms say nothing about what each bank does):
  1. Title.
  2. One family, children aged 4, 19 and 20: Leumi's form counts children up to 18 (1),
     Hapoalim's up to 21 (3), Mizrahi-Tefahot's up to 18; Discount's record does not say.
  3. A self-employed income of 210,000 ₪ a year: yearly net in one form, a monthly
     average (÷ 12 = 17,500) in another, both a monthly net and a yearly gross in a third.
  4. A loan with exactly 18 months left: "more than 18 months" does not count it,
     "a year and a half and above" does. What the bank counts in its own check is lesson 4.2.
  5. What is known about each bank (what its form asks) and what is not.
  6. Takeaway: which unit, which base, which definition.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 4.13 · ארבעת הבנקים</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/4-13.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const inputs = (id) => data.facts.find((f) => f.id === id).inputs;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const num = (v) => nf2.format(Number(v)).replace(/\.00$/, "");
      const pl = (v) => String(v).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");
      const ages = inputs("pred.leumi").ages.split("|");
      const V = {
        ages: ages.map(Number),
        leumi: pl(fact("pred.leumi")),
        poalim: pl(fact("pred.poalim")),
        yearly: num(fact("ex3.yearly")),
        monthly: num(fact("ex3.answer")),
      };

      const S = { title: [0, 10], kids: [10, 62], income: [62, 105], oblig: [105, 145], know: [145, 175], end: [175, 187] };
      window.duration = 187;
      window.cues = [
        [1, 5, "אותה משפחה, ארבעה טפסים."],
        [5, 9.5, "מה כל בנק שואל, ומה לא ידוע עליו."],
        [11, 17, `משפחה אחת, שלושה ילדים: בני ${V.ages[0]}, ${V.ages[1]} ו־${V.ages[2]}.`],
        [17, 24, "בטופס של לאומי: ילדים עד גיל 18."],
        [24, 31, `סימנו ${V.leumi}: רק הילד בן ${V.ages[0]}.`],
        [31, 38, "בטופס של הפועלים: ילדים עד גיל 21."],
        [38, 45, `סימנו ${V.poalim}: שלושתם.`],
        [45, 53, "מזרחי־טפחות כמו לאומי. דיסקונט: הרישום לא אומר."],
        [53, 61, "אותה עובדה, כמה מספרים. כל טופס מגדיר ילד לבד."],
        [63, 70, `עצמאי שההכנסה השנתית נטו שלו ${V.yearly} ₪.`],
        [70, 77, "בלאומי כותבים את המספר השנתי."],
        [77, 86, "בהפועלים מבקשים ממוצע חודשי: חלקי 12."],
        [86, 95, "דיסקונט: חודשי נטו, וגם שנתי ברוטו לפי שומה."],
        [95, 104, "אותו אדם, כמה מספרים. לכל אחד יחידה אחרת."],
        [106, 113, "הלוואה שנשארו לה בדיוק 18 חודשים."],
        [113, 121, "לאומי שואל ״מעל 18 חודשים״. לא נספרת."],
        [121, 129, "דיסקונט: ״שנה וחצי ומעלה״. כן נספרת."],
        [129, 138, "הנוסחים נשמעים אותו דבר, והתשובה שונה."],
        [138, 144, "מה הבנק סופר בבדיקה: כלל אחר, בשיעור 4.2."],
        [146, 153, "מה שהקורס יודע על כל בנק: מה הטופס שלו שואל."],
        [153, 161, "הטופס הוא בקשה. הוא לא מתמחר ולא מבטיח."],
        [161, 168, "ומה לא ידוע: מי זול יותר, מי מקל, כמה זמן לוקח."],
        [168, 174, "את זה לא מלמדים בלי מקור. שאלות פתוחות לאילון."],
        [176, 181, "לפני שכותבים מספר בטופס: באיזו יחידה?"],
        [181, 186, "על איזה בסיס? ולפי איזו הגדרה?"],
      ];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, s, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6));
      // Visible only between two moments of a scene.
      const during = (t, sc, s, e, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6), clamp((sc[0] + e - t) / 0.6));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: anchor "start" puts its right edge at x. LTR runs (numbers) take ltr: true.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);
      // An equation, left to right. Parts are strings, or [base, exponent] pairs.
      function eqn(x, y, parts, size, opts = {}) {
        const e = el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 600, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: "ltr", "unicode-bidi": "bidi-override" });
        const ns = "http://www.w3.org/2000/svg";
        for (const p of typeof parts === "string" ? [parts] : parts) {
          if (typeof p === "string") {
            const s = document.createElementNS(ns, "tspan");
            s.textContent = p;
            e.appendChild(s);
          } else {
            const b = document.createElementNS(ns, "tspan");
            b.textContent = p[0];
            e.appendChild(b);
            const sup = document.createElementNS(ns, "tspan");
            sup.setAttribute("dy", String(-size * 0.42));
            sup.setAttribute("font-size", String(Math.round(size * 0.62)));
            sup.textContent = p[1];
            e.appendChild(sup);
            const back = document.createElementNS(ns, "tspan");
            back.setAttribute("dy", String(size * 0.42));
            back.textContent = " ";
            e.appendChild(back);
          }
        }
        return e;
      }
      const box = (x, y, w, h, o, fill = C.n0) => el("rect", { x, y, width: w, height: h, rx: 14, fill, stroke: fill === C.n0 ? C.n200 : "none", opacity: o });

      

      window.render = (t) => {
        svg.replaceChildren();
        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 290, "ארבעת הבנקים", 76, { w: 700, o });
          txt(640, 360, "מה כל טופס שואל, ומה לא ידוע", 30, { fill: C.n600, o: after(t, S.title, 4, o) });
        }
        // Scene 2 — one family, children's ages
        if (inScene(t, S.kids)) {
          const o = vis(t, S.kids);
          txt(640, 124, "אותה משפחה: ילדים בני " + V.ages.join(", "), 36, { w: 700, o });
          // the three children
          V.ages.forEach((a, i) => {
            const oc = after(t, S.kids, 1 + i * 0.6, o);
            el("circle", { cx: 760 - i * 120, cy: 206, r: 30, fill: C.mint, opacity: oc });
            txt(760 - i * 120, 216, String(a), 28, { w: 700, o: oc, ltr: true });
          });
          const banks = [
            { x: 940, name: "לאומי", asks: "ילדים עד גיל 18", val: V.leumi, from: 6 },
            { x: 650, name: "הפועלים", asks: "ילדים עד גיל 21", val: V.poalim, from: 20 },
            { x: 360, name: "מזרחי־טפחות", asks: "ילדים עד גיל 18", val: V.leumi, from: 34 },
            { x: 70, name: "דיסקונט", asks: "הרישום לא אומר עד איזה גיל", val: "?", from: 36 },
          ];
          banks.forEach((b) => {
            const ob = after(t, S.kids, b.from, o);
            box(b.x, 270, 260, 220, ob);
            txt(b.x + 130, 312, b.name, 26, { w: 700, o: ob });
            txt(b.x + 130, 346, b.asks, 17, { fill: C.n600, o: ob });
            txt(b.x + 130, 440, b.val, 64, { w: 700, fill: b.val === "?" ? C.n600 : C.teal, o: after(t, S.kids, b.from + 3, o), ltr: true });
          });
          txt(640, 530, "אותה משפחה, כמה מספרים", 26, { w: 700, fill: C.n700, o: after(t, S.kids, 44, o) });
        }
        // Scene 3 — a self-employed income
        if (inScene(t, S.income)) {
          const o = vis(t, S.income);
          txt(640, 124, "הכנסה של עצמאי", 40, { w: 700, o });
          txt(640, 166, `הכנסה שנתית נטו: ${V.yearly} ₪ (בשנתיים האחרונות, זהה)`, 22, { fill: C.n600, o });
          const cards = [
            { x: 820, name: "לאומי", ask: "הכנסה שנתית נטו", val: `${V.yearly} ₪`, from: 8 },
            { x: 480, name: "הפועלים", ask: "ממוצע חודשי בשנתיים האחרונות", val: `${V.monthly} ₪`, from: 15, eq: `${V.yearly} ÷ 12 = ${V.monthly}` },
            { x: 140, name: "דיסקונט", ask: "חודשי נטו, וגם שנתי ברוטו לפי שומה", val: "שני מספרים", from: 24 },
          ];
          cards.forEach((c) => {
            const oc = after(t, S.income, c.from, o);
            box(c.x, 210, 320, 260, oc);
            txt(c.x + 160, 252, c.name, 26, { w: 700, o: oc });
            txt(c.x + 160, 288, c.ask, 16, { fill: C.n600, o: oc });
            txt(c.x + 160, 370, c.val, c.val.length > 12 ? 30 : 44, { w: 700, fill: C.teal, o: oc, ltr: c.val !== "שני מספרים" });
            if (c.eq) eqn(c.x + 160, 430, c.eq, 22, { fill: C.n700, o: oc });
          });
          txt(640, 530, "אותו אדם, יחידה אחרת בכל טופס", 26, { w: 700, fill: C.n700, o: after(t, S.income, 33, o) });
        }
        // Scene 4 — 18 months exactly
        if (inScene(t, S.oblig)) {
          const o = vis(t, S.oblig);
          txt(640, 124, "הלוואה שנשארו לה בדיוק 18 חודשים", 38, { w: 700, o });
          const cards = [
            { x: 700, name: "לאומי", q: "״מעל 18 חודשים״", res: "לא נספרת", from: 8, c: C.n600 },
            { x: 200, name: "דיסקונט", q: "״שנה וחצי ומעלה״", res: "נספרת", from: 16, c: C.teal },
          ];
          cards.forEach((c) => {
            const oc = after(t, S.oblig, c.from, o);
            box(c.x, 190, 380, 250, oc);
            txt(c.x + 190, 236, c.name, 28, { w: 700, o: oc });
            txt(c.x + 190, 290, c.q, 30, { o: oc });
            txt(c.x + 190, 380, c.res, 48, { w: 700, fill: c.c, o: after(t, S.oblig, c.from + 2, o) });
          });
          txt(640, 500, "ומה הבנק סופר בבדיקה שלו? כלל אחר (שיעור 4.2)", 22, { fill: C.n700, o: after(t, S.oblig, 32, o) });
        }
        // Scene 5 — what is known, what is not
        if (inScene(t, S.know)) {
          const o = vis(t, S.know);
          txt(640, 124, "מה ידוע על כל בנק, ומה לא", 40, { w: 700, o });
          box(700, 170, 420, 300, after(t, S.know, 1, o));
          txt(910, 212, "ידוע: מה הטופס שלו שואל", 24, { w: 700, fill: C.teal, o: after(t, S.know, 1, o) });
          ["העסקה והדירות", "המחיר והשווי", "הלווים וההכנסות", "ההתחייבויות, הסכום והתקופה"].forEach((s2, i) =>
            txt(1090, 262 + i * 44, s2, 21, { anchor: "start", o: after(t, S.know, 2 + i * 0.7, o) }));
          box(160, 170, 460, 300, after(t, S.know, 9, o));
          txt(390, 212, "לא ידוע", 24, { w: 700, fill: C.n600, o: after(t, S.know, 9, o) });
          ["מי זול יותר, ומתי", "איזה לקוח כל בנק מעדיף", "איך מחשבים הכנסה של עצמאי", "כמה זמן לוקח כל שלב"].forEach((s2, i) =>
            txt(595, 262 + i * 44, s2, 21, { anchor: "start", fill: C.n700, o: after(t, S.know, 10 + i * 0.7, o) }));
          txt(640, 530, "לא אומת · שאלות פתוחות לאילון", 22, { fill: C.n600, o: after(t, S.know, 18, o) });
        }
        // Scene 6 — the three questions
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
          const rows = [
            { y: 250, a: "באיזו יחידה?", b: "חודש או שנה, נטו או ברוטו", from: 0.5 },
            { y: 320, a: "על איזה בסיס?", b: "תלוש, ממוצע, שומה", from: 3 },
            { y: 390, a: "לפי איזו הגדרה?", b: "ילד עד 18 או 21, מעל 18 חודשים", from: 5.5 },
          ];
          for (const r of rows) {
            const or = after(t, S.end, r.from, o);
            txt(1060, r.y, r.a, 34, { anchor: "start", w: 700, o: or });
            txt(620, r.y, r.b, 26, { anchor: "start", fill: C.teal, o: or });
          }
        }
      };

      await document.fonts.ready;
      window.ready = true;
      window.render(0);
    </script>
  </body>
</html>
