<!doctype html>
<!--
  Video scene for lesson 3.12 — "ארבעה צעדים, ועיגול אחד" (סדנה: לוח סילוקין ביד ובגיליון).
  Rendered frame by frame by scripts/render-video.mjs: it calls window.render(t)
  for each time t (seconds) and photographs the page. render(t) depends only on t.
  Every number comes from data/lessons/3-12.json. The subtitle cues (window.cues)
  carry the explanatory sentences — the script for narration, if it is ever added.

  Script (one idea: every row of a schedule is four steps in the same order, with one
  rounding rule; written once by hand, once in a sheet, and checked against the course's
  calculator, where a difference of agorot is a rounding convention):
  1. Title.
  2. The four steps: opening balance, interest (rounded to the agora), principal, closing.
  3. By hand — איתי (invented; a separate exercise): 12,000 ₪, 0.5% a month, 12 months,
     1,032.80 ₪. Months 1–3; in month 2 the exact interest 55.136 is 55.14 in the table.
     The last payment 1,032.78. Four common mistakes, by name.
  4. In a sheet: one row of formulas, copied down; the minus before PMT.
  5. Against the calculator — תמר ועידו, 400,000 ₪ at 5.4% for 180 months: the payment
     3,247.15, the last 3,246.15; sheets that round otherwise differ by agorot, or by a
     shekel. The rounding rule is the course's calculation assumption; a bank can round
     otherwise.
  6. Takeaway.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-400-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-600-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 600; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-hebrew-700-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("/node_modules/@fontsource/heebo/files/heebo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-22FF; }
      /* The bottom 150px stay clear for the subtitles. */
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--mogi-n50); font-family: "Heebo", sans-serif; color: var(--mogi-n900); }
      #stage { position: relative; width: 1280px; height: 720px; }
      .logo { position: absolute; top: 28px; right: 40px; height: 44px; }
      .kicker { position: absolute; top: 36px; right: 100px; font-size: 18px; font-weight: 600; color: var(--mogi-n600); }
      svg text { font-family: "Heebo", sans-serif; }
    </style>
  </head>
  <body>
    <div id="stage">
      <img class="logo" src="/public/brand/mogi-logo.png" alt="" />
      <div class="kicker">שיעור 3.12 · סדנה: לוח סילוקין ביד ובגיליון</div>
      <svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg>
    </div>
    <script type="module">
      const data = await (await fetch("/data/lessons/3-12.json")).json();
      const fact = (id) => data.facts.find((f) => f.id === id).value;
      const nf2 = new Intl.NumberFormat("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      // Money with agorot when there are any: "1,493.74", "2,400".
      const num = (v) => nf2.format(Number(v)).replace(/\.00$/, "");
      const shek = (v) => `${num(v)} ₪`;
      // A count, a rate or a factor as written in the data, without trailing zeros: "0.50" → "0.5".
      const pl = (v) => String(v).replace(/(\.\d*?)0+$/, "$1").replace(/\.$/, "");

      const hand = fact("hand.schedule");
      const last = hand[hand.length - 1];
      const V = {
        hLoan: num(fact("hand.loan")),
        hMonthly: pl(fact("hand.monthly")),
        hPay: num(fact("hand.payment")),
        hLast: num(fact("hand.last_payment")),
        hLastGap: num(fact("hand.last_gap")),
        hTotal: num(fact("hand.total_paid")),
        hInt: num(fact("hand.total_interest")),
        unrounded: String(fact("hand.m2.interest.unrounded")),
        pmtShown: String(fact("hand.pmt_shown")).replace("-", "−"),
        sLoan: num(fact("sheet.loan")),
        sMonths: pl(fact("sheet.months")),
        sPay: num(fact("sheet.statement.regular")),
        sLast: num(fact("sheet.statement.last")),
        sGapLast: num(fact("sheet.gap_last")),
        sInt: num(fact("sheet.statement.total_interest")),
        exInt: num(fact("sheet.exact.total_interest")),
        exGap: num(fact("sheet.gap_exact_interest")),
        unInt: num(fact("sheet.payment_unrounded.total_interest")),
        unGap: num(fact("sheet.gap_unrounded_interest")),
        noPaid: num(fact("sheet.no_last_adjust.total_paid")),
        over: num(fact("sheet.overpaid")),
      };

      // Timeline (seconds). Each scene owns a window; render(t) draws whatever is on screen at t.
      const S = { title: [0, 10], steps: [10, 40], hand: [40, 92], sheet: [92, 128], match: [128, 166], end: [166, 178] };
      window.duration = 178;
      window.cues = [
        [1, 5, "סדנה: לוח סילוקין ביד, ובגיליון."],
        [5, 9.5, "ארבעה צעדים בכל חודש, ועיגול אחד."],
        [11, 17, "צעד 1: היתרה בתחילת החודש — היתרה בסוף החודש הקודם."],
        [17, 24, "צעד 2: הריבית — היתרה כפול הריבית החודשית, מעוגלת לאגורה."],
        [24, 31, "צעד 3: הקרן — התשלום פחות הריבית."],
        [31, 39, "צעד 4: היתרה בסוף — היתרה בתחילה פחות הקרן. לא כל התשלום."],
        [41, 47, `איתי (בדוי) לווה ${V.hLoan} ₪, ב־6% לשנה, ל־12 חודשים.`],
        [47, 53, `ההחזר, מהנוסחה של שיעור 3.1: ${V.hPay} ₪.`],
        [53, 60, `חודש 1: ריבית ${num(hand[0].interest)} ₪, קרן ${num(hand[0].principal_paid)} ₪.`],
        [60, 67, `חודש 2: הריבית המדויקת ${V.unrounded}. בלוח: ${num(hand[1].interest)} ₪.`],
        [67, 74, "הריבית יורדת, הקרן עולה באותו סכום, והתשלום לא זז."],
        [74, 82, `התשלום האחרון סוגר את העיגול: ${V.hLast} ₪.`],
        [82, 91, "ארבע טעויות נפוצות, ולכל אחת שם."],
        [93, 99, "בגיליון כותבים את ארבעת הצעדים פעם אחת, בשורה אחת."],
        [99, 106, "ומעתיקים למטה, עד החודש האחרון."],
        [106, 113, "הסימן $ נועל תא: הריבית החודשית נשארת אותו תא."],
        [113, 120, `PMT לבד מחזירה ${V.pmtShown}: כסף שיוצא מכם.`],
        [120, 127, "המינוס שלפניה הופך אותו לחיובי, כמו בלוח."],
        [129, 135, `תמר ועידו (בדויים): ${V.sLoan} ₪, ב־5.4%, ${V.sMonths} חודשים.`],
        [135, 142, `ההחזר ${V.sPay} ₪. התשלום האחרון: ${V.sLast} ₪.`],
        [142, 149, "גיליון שמעגל אחרת יוצא שונה באגורות, או בשקל."],
        [149, 157, "אגורות או שקל: מוסכמת עיגול. עשרות שקלים: נוסחה אחרת."],
        [157, 165, "כלל העיגול הוא הנחת החישוב של הקורס. בנק יכול לעגל אחרת."],
        [167, 172, "ארבעה צעדים, באותו סדר, בכל חודש."],
        [172, 177, "ובדיקה מול המחשבון: עד האגורה."],
      ];

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const inScene = (t, [a, b]) => t >= a && t < b;
      const fadeIn = (t, [a], d = 0.6) => clamp((t - a) / d);
      const fadeOut = (t, [, b], d = 0.6) => clamp((b - t) / d);
      const vis = (t, sc) => Math.min(fadeIn(t, sc), fadeOut(t, sc));
      const after = (t, sc, s, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6));
      // Visible only between two moments of a scene.
      const during = (t, sc, s, e, o) => Math.min(o, clamp((t - sc[0] - s) / 0.6), clamp((sc[0] + e - t) / 0.6));

      const C = {
        navy: "var(--mogi-navy)", n0: "var(--mogi-n0)", n100: "var(--mogi-n100)", n200: "var(--mogi-n200)", n300: "var(--mogi-n300)",
        n600: "var(--mogi-n600)", n700: "var(--mogi-n700)",
        teal: "var(--mogi-teal-deep)", tq2: "var(--mogi-turquoise-2)", mint: "var(--mogi-mint)",
      };

      const svg = document.getElementById("svg");
      const el = (tag, attrs, text) => {
        const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        if (text !== undefined) e.textContent = text;
        svg.appendChild(e);
        return e;
      };
      // RTL text: anchor "start" puts its right edge at x. LTR runs (numbers) take ltr: true.
      const txt = (x, y, s, size, opts = {}) =>
        el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 400, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: opts.ltr ? "ltr" : "rtl", "unicode-bidi": "isolate" }, s);
      // An equation, left to right. Parts are strings, or [base, exponent] pairs.
      function eqn(x, y, parts, size, opts = {}) {
        const e = el("text", { x, y, "font-size": size, "font-weight": opts.w ?? 600, fill: opts.fill ?? C.navy, "text-anchor": opts.anchor ?? "middle", opacity: opts.o ?? 1, direction: "ltr", "unicode-bidi": "bidi-override" });
        const ns = "http://www.w3.org/2000/svg";
        for (const p of typeof parts === "string" ? [parts] : parts) {
          if (typeof p === "string") {
            const s = document.createElementNS(ns, "tspan");
            s.textContent = p;
            e.appendChild(s);
          } else {
            const b = document.createElementNS(ns, "tspan");
            b.textContent = p[0];
            e.appendChild(b);
            const sup = document.createElementNS(ns, "tspan");
            sup.setAttribute("dy", String(-size * 0.42));
            sup.setAttribute("font-size", String(Math.round(size * 0.62)));
            sup.textContent = p[1];
            e.appendChild(sup);
            const back = document.createElementNS(ns, "tspan");
            back.setAttribute("dy", String(size * 0.42));
            back.textContent = " ";
            e.appendChild(back);
          }
        }
        return e;
      }
      const box = (x, y, w, h, o, fill = C.n0) => el("rect", { x, y, width: w, height: h, rx: 14, fill, stroke: fill === C.n0 ? C.n200 : "none", opacity: o });

      window.render = (t) => {
        svg.replaceChildren();
        // Scene 1 — title
        if (inScene(t, S.title)) {
          const o = vis(t, S.title);
          txt(640, 290, "ארבעה צעדים, ועיגול אחד", 70, { w: 700, o });
          const o2 = after(t, S.title, 4, o);
          txt(640, 360, "לוח סילוקין ביד · בגיליון · מול המחשבון", 32, { fill: C.n600, o: o2 });
        }
        // Scene 2 — the four steps
        if (inScene(t, S.steps)) {
          const o = vis(t, S.steps);
          txt(640, 132, "כל שורה בלוח: ארבעה צעדים", 40, { w: 700, o });
          const steps = [
            { y: 216, a: "היתרה בתחילת החודש", b: "= היתרה בסוף החודש הקודם", from: 1 },
            { y: 304, a: "הריבית", b: "= היתרה × הריבית החודשית, מעוגלת לאגורה", from: 7 },
            { y: 392, a: "הקרן", b: "= התשלום − הריבית", from: 14 },
            { y: 480, a: "היתרה בסוף החודש", b: "= היתרה בתחילה − הקרן", from: 21 },
          ];
          steps.forEach((s, i) => {
            const os = after(t, S.steps, s.from, o);
            box(160, s.y - 44, 960, 72, os);
            el("circle", { cx: 1076, cy: s.y - 8, r: 20, fill: C.navy, opacity: os });
            txt(1076, s.y + 1, String(i + 1), 22, { w: 700, fill: C.n0, o: os, ltr: true });
            txt(1040, s.y + 1, s.a, 24, { anchor: "start", w: 700, o: os });
            txt(780, s.y + 1, s.b, 22, { anchor: "start", fill: C.n700, o: os });
          });
        }
        // Scene 3 — by hand
        if (inScene(t, S.hand)) {
          const o = vis(t, S.hand);
          txt(640, 124, `ביד · איתי · ${V.hLoan} ₪ · ${V.hMonthly}% לחודש · 12 חודשים`, 32, { w: 700, o });
          const at = (s) => after(t, S.hand, s, o);
          txt(640, 158, `ההחזר: ${V.hPay} ₪ · בדוי, תרגיל נפרד`, 20, { fill: C.n600, o: at(7) });
          const cols = [
            { x: 1080, label: "חודש", key: "period" }, { x: 960, label: "יתרה בתחילה", key: "opening" }, { x: 800, label: "ריבית", key: "interest" },
            { x: 650, label: "קרן", key: "principal_paid" }, { x: 500, label: "התשלום", key: "payment" }, { x: 340, label: "יתרה בסוף", key: "closing" },
          ];
          const ob = at(13);
          box(200, 176, 900, 236, ob);
          for (const c of cols) txt(c.x, 208, c.label, 17, { anchor: "start", fill: C.n600, w: 600, o: ob });
          el("line", { x1: 220, x2: 1080, y1: 222, y2: 222, stroke: C.n200, "stroke-width": 1, opacity: ob });
          const rows = [...hand.slice(0, 3), null, last];
          rows.forEach((r, i) => {
            const y = 258 + i * 36;
            const or = at(i === 0 ? 13 : i === 1 ? 20 : i === 2 ? 27 : 34);
            if (!r) { txt(1066, y, "…", 20, { fill: C.n600, o: or, ltr: true }); return; }
            for (const c of cols) {
              if (c.key === "period") txt(c.x - 14, y, String(r.period), 20, { w: 600, o: or, ltr: true });
              else txt(c.x, y, num(r[c.key]), 20, { anchor: "end", w: c.key === "interest" ? 700 : 400, fill: c.key === "interest" ? C.teal : (i === 4 && c.key === "payment" ? C.navy : C.n700), o: or, ltr: true });
            }
          });
          // The equations of month 1, then the rounding of month 2.
          const eqs = [
            { s: 13, e: 20, text: `${num(hand[0].opening)} × ${V.hMonthly}% = ${num(hand[0].interest)} · ${num(hand[0].payment)} − ${num(hand[0].interest)} = ${num(hand[0].principal_paid)}` },
            { s: 20, e: 27, text: `${num(hand[1].opening)} × ${V.hMonthly}% = ${V.unrounded} → ${num(hand[1].interest)}` },
          ];
          for (const q of eqs) {
            const oq = during(t, S.hand, q.s, q.e, o);
            if (oq > 0) eqn(640, 450, q.text, 24, { o: oq });
          }
          const ol = during(t, S.hand, 34, 42, o);
          if (ol > 0) txt(640, 450, `התשלום האחרון: ${V.hLast} ₪ — ${V.hLastGap} ₪ פחות · בסך הכול ${V.hTotal} ₪, מתוכם ${V.hInt} ₪ ריבית`, 20, { fill: C.n700, o: ol });
          // Four named mistakes.
          const om = at(42);
          const mistakes = ["ריבית על ההלוואה המקורית", "ריבית לשנה במקום לחודש", "ריבית שלא עוגלה", "הורדה של כל התשלום מהיתרה"];
          mistakes.forEach((m, i) => {
            const x = 1100 - i * 232;
            el("rect", { x: x - 222, y: 430, width: 222, height: 56, rx: 10, fill: C.n100, opacity: om });
            txt(x - 111, 464, m, 16, { w: 600, fill: C.n700, o: om });
          });
          txt(640, 530, "הטעויות הנפוצות", 18, { fill: C.n600, o: om });
        }
        // Scene 4 — in a sheet
        if (inScene(t, S.sheet)) {
          const o = vis(t, S.sheet);
          txt(640, 124, "בגיליון: שורה אחת, ומעתיקים למטה", 38, { w: 700, o });
          const at = (s) => after(t, S.sheet, s, o);
          const cells = [
            { c: "B20", what: "היתרה בתחילת החודש", f: "=B5" },
            { c: "C20", what: "התשלום (בחודש האחרון: היתרה ועוד הריבית)", f: "=IF(A20=$B$7,B20+D20,$B$11)" },
            { c: "D20", what: "הריבית, מעוגלת לאגורה", f: "=ROUND(B20*$B$10,2)" },
            { c: "E20", what: "הקרן", f: "=C20-D20" },
            { c: "F20", what: "היתרה בסוף החודש", f: "=B20-E20" },
            { c: "B21", what: "החודש הבא מתחיל מהיתרה בסוף", f: "=F20" },
          ];
          box(160, 152, 960, 290, at(1));
          cells.forEach((r, i) => {
            const y = 192 + i * 44;
            const or = at(1 + i * 0.8);
            txt(1090, y, r.c, 20, { anchor: "end", w: 700, o: or, ltr: true });
            txt(1020, y, r.what, 19, { anchor: "start", fill: C.n700, o: or });
            txt(190, y, r.f, 20, { anchor: "start", w: 600, fill: i === 2 ? C.teal : C.navy, o: or, ltr: true });
          });
          const od = during(t, S.sheet, 7, 21, o);
          if (od > 0) txt(640, 490, "מעתיקים את השורה למטה, עד החודש האחרון", 22, { fill: C.n700, o: od });
          const op = at(21);
          box(250, 464, 780, 96, op * 0.6, C.mint);
          txt(640, 498, "ההחזר, בתא B11:", 18, { fill: C.n700, o: op });
          txt(640, 536, "=ROUND(-PMT(B10,B7,B5),2)", 26, { w: 700, o: op, ltr: true });
        }
        // Scene 5 — against the course's calculator
        if (inScene(t, S.match)) {
          const o = vis(t, S.match);
          txt(640, 124, `מול המחשבון · תמר ועידו · ${V.sLoan} ₪ · 5.4% · ${V.sMonths} חודשים`, 30, { w: 700, o });
          const at = (s) => after(t, S.match, s, o);
          box(330, 152, 620, 70, at(7));
          txt(640, 196, `ההחזר ${V.sPay} ₪ · התשלום האחרון ${V.sLast} ₪`, 24, { w: 700, o: at(7) });
          const rows = [
            { name: "כמו הקורס", v: `ריבית ${V.sInt} ₪`, gap: "", from: 14 },
            { name: "בלי ROUND בכלל", v: `ריבית ${V.exInt} ₪`, gap: `${V.exGap} ₪ יותר`, from: 16 },
            { name: "ROUND על הריבית, לא על ההחזר", v: `ריבית ${V.unInt} ₪`, gap: `${V.unGap} ₪ יותר`, from: 18 },
            { name: "גם החודש האחרון משלם את ההחזר הרגיל", v: `סך התשלומים ${V.noPaid} ₪`, gap: `${V.over} ₪ יותר`, from: 20 },
          ];
          rows.forEach((r, i) => {
            const y = 250 + i * 62;
            const or = at(r.from);
            box(160, y, 960, 52, or);
            txt(1100, y + 34, r.name, 20, { anchor: "start", w: 700, o: or });
            txt(600, y + 34, r.v, 20, { anchor: "start", fill: C.n700, o: or });
            if (r.gap) txt(190, y + 34, r.gap, 20, { anchor: "end", w: 700, fill: C.teal, o: or });
          });
          const oc = at(21);
          txt(640, 518, "אגורות או שקל: מוסכמת עיגול · עשרות שקלים ומעלה: נוסחה אחרת", 21, { w: 600, fill: C.n700, o: oc });
          txt(640, 552, "כלל העיגול — הנחת החישוב של הקורס; בנק יכול לסגור את העיגול אחרת", 17, { fill: C.n600, o: at(29) });
        }
        // Scene 6 — takeaway
        if (inScene(t, S.end)) {
          const o = vis(t, S.end);
